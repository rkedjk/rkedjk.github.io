<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Шпаргалки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            padding: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        /* Светлая тема */
        body.light {
            background-color: #ffffff;
            color: #000000;
        }

        /* AMOLED тема - чистый черный #000 */
        body.dark {
            background-color: #000000;
            color: #ffffff;
        }

        .header {
            position: sticky;
            top: 0;
            background: inherit;
            padding-bottom: 8px;
            z-index: 100;
        }

        .theme-toggle {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid;
            cursor: pointer;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .light .theme-toggle {
            background: #f0f0f0;
            border-color: #ddd;
            color: #000;
        }

        .dark .theme-toggle {
            background: #1a1a1a;
            border-color: #333;
            color: #fff;
        }

        .search-box {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid;
            margin-bottom: 12px;
        }

        .light .search-box {
            background: #f9f9f9;
            border-color: #ddd;
            color: #000;
        }

        .dark .search-box {
            background: #1a1a1a;
            border-color: #333;
            color: #fff;
        }

        .ticket {
            border: 1px solid;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .light .ticket {
            background: #f9f9f9;
            border-color: #e0e0e0;
        }

        .light .ticket:active {
            background: #eeeeee;
        }

        .dark .ticket {
            background: #0a0a0a;
            border-color: #222;
        }

        .dark .ticket:active {
            background: #1a1a1a;
        }

        .ticket-header {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .ticket-title {
            font-size: 12px;
            opacity: 0.8;
        }

        .ticket-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            font-size: 12px;
            line-height: 1.5;
        }

        .ticket.expanded .ticket-content {
            max-height: 2000px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid;
        }

        .light .ticket.expanded .ticket-content {
            border-top-color: #ddd;
        }

        .dark .ticket.expanded .ticket-content {
            border-top-color: #333;
        }

        /* Подсветка найденного текста */
        .highlight {
            font-weight: 600;
            border-radius: 2px;
            padding: 1px 2px;
        }

        .light .highlight {
            background: #ffeb3b;
            color: #000;
        }

        .dark .highlight {
            background: #ffd600;
            color: #000;
        }

        .no-results {
            text-align: center;
            padding: 20px;
            opacity: 0.6;
            font-size: 13px;
        }

        .hidden {
            display: none;
        }

        /* Оптимизация для Apple Watch */
        @media only screen and (max-width: 250px) {
            body {
                font-size: 12px;
                padding: 4px;
            }

            .ticket {
                padding: 8px;
                margin-bottom: 6px;
            }

            .search-box,
            .theme-toggle {
                padding: 6px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body class="dark">
    <div class="header">
        <button class="theme-toggle" onclick="toggleTheme()">🌓 Сменить тему</button>
        <input type="text" class="search-box" id="searchBox" placeholder="Поиск..." oninput="searchTickets()">
    </div>

    <div id="ticketContainer">
        <!-- Билеты будут добавлены здесь -->
    </div>

    <div id="noResults" class="no-results hidden">Ничего не найдено</div>

    <script>
        // Массив с билетами - добавьте свои данные
        const tickets = [
            {
                number: 1,
                title: "Основы программирования",
                content: "Программирование — процесс создания компьютерных программ. Основные концепции: переменные, условия, циклы, функции. Языки программирования делятся на низкоуровневые (ассемблер) и высокоуровневые (Python, Java, C++)."
            },
            {
                number: 2,
                title: "Структуры данных",
                content: "Массивы - упорядоченные коллекции элементов. Списки - динамические структуры. Деревья - иерархические структуры. Хеш-таблицы - быстрый доступ по ключу. Графы - связи между узлами."
            },
            {
                number: 3,
                title: "Алгоритмы сортировки",
                content: "Пузырьковая сортировка O(n²). Быстрая сортировка O(n log n). Сортировка слиянием O(n log n). Сортировка вставками O(n²). Выбор алгоритма зависит от размера данных."
            },
            {
                number: 4,
                title: "Базы данных",
                content: "SQL - реляционные БД (PostgreSQL, MySQL). NoSQL - документные (MongoDB), ключ-значение (Redis), графовые (Neo4j). ACID - требования к транзакциям. Нормализация - устранение избыточности."
            },
            {
                number: 5,
                title: "Сетевые протоколы",
                content: "HTTP/HTTPS - передача гипертекста. TCP/IP - транспортный уровень. DNS - преобразование доменов в IP. WebSocket - двусторонняя связь. REST API - архитектура веб-сервисов."
            }
        ];

        // Инициализация
        function init() {
            renderTickets(tickets, '');
            loadTheme();
        }

        // Функция подсветки текста
        function highlightText(text, query) {
            if (!query) return text;

            const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Экранирование спецсимволов регулярных выражений
        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Отрисовка билетов
        function renderTickets(ticketsToRender, query) {
            const container = document.getElementById('ticketContainer');
            const noResults = document.getElementById('noResults');

            container.innerHTML = '';

            if (ticketsToRender.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');

            ticketsToRender.forEach(ticket => {
                const ticketEl = document.createElement('div');
                ticketEl.className = 'ticket';

                // Проверяем, найден ли текст в content
                const foundInContent = query && ticket.content.toLowerCase().includes(query.toLowerCase());

                // Если найдено в содержимом, автоматически раскрываем билет
                if (foundInContent) {
                    ticketEl.classList.add('expanded');
                }

                // Подсвечиваем найденный текст
                const highlightedTitle = highlightText(ticket.title, query);
                const highlightedContent = highlightText(ticket.content, query);

                ticketEl.innerHTML = `
                    <div class="ticket-header">Билет ${ticket.number}</div>
                    <div class="ticket-title">${highlightedTitle}</div>
                    <div class="ticket-content">${highlightedContent}</div>
                `;

                ticketEl.onclick = function () {
                    this.classList.toggle('expanded');
                };

                container.appendChild(ticketEl);
            });
        }

        // Поиск по билетам
        function searchTickets() {
            const query = document.getElementById('searchBox').value.toLowerCase();

            if (!query) {
                renderTickets(tickets, '');
                return;
            }

            const filtered = tickets.filter(ticket => {
                return ticket.title.toLowerCase().includes(query) ||
                    ticket.content.toLowerCase().includes(query) ||
                    ticket.number.toString().includes(query);
            });

            renderTickets(filtered, query);
        }

        // Переключение темы
        function toggleTheme() {
            const body = document.body;
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                body.classList.add('light');
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Загрузка сохраненной темы
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.body.className = savedTheme;
        }

        // Запуск при загрузке страницы
        init();
    </script>
</body>

</html>
