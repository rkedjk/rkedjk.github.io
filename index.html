ля монопродуктовых территорий). Временной — ошибки в выборе момента для вложений или реализации проекта. Ликвидности — трудности с быстрой продажей актива по справедливой цене. Операционный — потери из-за сбоев в технологиях, ошибок персонала, проблем с обработкой информации.</p>"}, {"number": 25, "title": "Риски финансового мошенничества", "content": "<p>Риск финансового мошенничества — это вероятность потерять деньги или имущество из‑за обмана, злоупотребления доверием или подлога. В правовом поле такие действия квалифицируются по ст. 159 УК РФ («Мошенничество») и смежным статьям. Основные виды рисков и соответствующие им схемы: - Риск утечки платёжных данных и кражи денег с карты. Схемы: скимминг (установка устройств на банкоматы), фишинг (поддельные сайты и письма), вишинг (звонки от «сотрудников банка»). - Инвестиционные риски из‑за псевдодоходных предложений. Сюда входят финансовые пирамиды, лже-форекс и «гарантированные» доходности. Признак риска: обещание высокой прибыли при отсутствии рисков. - Кредитные и долговые риски. Оформление кредитов на чужое имя, навязывание «обязательных» страховок и комиссий, скрытые условия договора. - Риски при онлайн‑покупках и переводах. Оплата на поддельных сайтах, «безопасные сделки» в мессенджерах, предоплата без гарантий. - Риски социальной инженерии. Мошенник давит на эмоции (страх, срочность, жалость) и вынуждает жертву самостоятельно перевести деньги или раскрыть данные. Ключевые признаки, указывающие на риск мошенничества Предложение «слишком хорошее, чтобы быть правдой»: сверхвысокие проценты, гарантированный доход, отсутствие рисков. Давление на срочность: «только сегодня», «акция заканчивается через 10 минут». Требование конфиденциальных данных: ПИН‑коды, одноразовые коды из СМС, CVV. Анонимность контрагента: нет юридического адреса, лицензии, прозрачной отчётности. Нестандартные способы оплаты: перевод на карту физлица, криптовалюта, электронные кошельки. Факторы, повышающие уязвимость к финансовому мошенничеству: - Низкий уровень финансовой грамотности: непонимание принципов работы банковских продуктов, инвестиций, страхования. - Эмоциональное принятие решений: страх потери, желание быстро разбогатеть. - Доверие к «авторитетам» в соцсетях и мессенджерах без проверки источников. - Использование небезопасных устройств и сетей (публичный Wi‑Fi, устаревшие приложения).</p>"}, {"number": 26, "title": "SWOT и PEST анализ", "content": "<p>Среди инструментов качественного анализа рисков выделяют SWOT и PEST анализ. SWOT-анализ представляет собой анализ сильных и слабых сторон, а также возможностей и угроз. К числу сильных сторон организации можно отнести: 1) Широкая известность на рынке и наличие сильного бренда; 2) Высокая гибкость в принятии решений для небольших компаний; 3) Наличие сертификатов качества на продукцию компании; 4) Наличие развитой дилерской сети; 5) Наличие регламентированных бизнес-процессов в организации; 6) Наличие квалифицированных трудовых ресурсов в компании и др. К числу слабых сторон компании можно отнести: 1) Наличие на рынке хорошо известных конкурентов; 2) Недостаточно высокий уровень организации продаж товаров; 3) Имеется репутация поставщика низкокачественной продукции; 4) Несоответствие продукции отраслевым стандартам 5) Частая смена ключевых сотрудников организации и другие факторы. Возможности компании: 1) Имеется потенциал для выхода на новые рынки; 2) Имеется возможность расширить ассортимент продукции; 3) Возможное слияние компании приведет к росту доли рынка; 4) Наличие инвестиций позволяет масштабировать компанию и другие факторы К угрозам компании можно отнести: 1) Падение спроса на продукцию и платежеспособности целевой аудитории 2) Резкое изменение курса иностранной валюты 3) Появление на рынке новых конкурентов, в том числе зарубежных 4) Кадровый дефицит и др. Правильно проведенный SWOT анализ дает представление о внешней среде и деловом климате, и несмотря на то, что анализ проводится как по внешним, так и внутренним факторам, большое значение уделяется наиболее доступным для измерения и наиболее значимым по степени влияния на бизнес показателям и факторам. PEST-анализ представляет собой анализ макроэкономических факторов в следующем разрезе: политические, экономические, социальные, технические. Политические: на развитие и эффективность функционирования организации сказываются события, происходящие в политической среде. Системы законодательных актов и нормативов регулируют взаимоотношения между бизнесом, населением и государством, что формирует экономическую основу государства. Государство оказывает влияние на экономическую среду через систему законов и нормативных актов. К группе политических относятся следующие факторы: Конституционные принципы Гибкость национальных институтов (инвестиционное законодательство, судебная практика, налоговая система) Наличие внешних обстоятельств (сотрудничество с другими государствами, конфликты, вмешательство в политические процессы других стран и т.д.) Одним из важнейших экономических факторов макросреды является покупательная способность населения. Общий уровень платежеспособного спроса зависит от текущих доходов населения, уровня цен, сбережений и доступности кредитных ресурсов. Тенденция в изменении доходов и структуре расходов оказывает влияние на фин.-хоз. деятельность организации, особенно те компаний, спрос на товары, которых чувствителен к уровню цен и доходов. К группе экономических факторов также относят: 1) экономический рост и доход на душу населения 2) размер и рост бюджетного дефицита 3) Размер и участие государства в экономике, в том числе источники и структура доходов 4) Национальные приоритеты и стратегические отрасли 5) Стабильность основных статей экспорта и импорта 6) Величина иностранных инвестиций, их территориальное и отраслевое распределение Социальные факторы - факторы, связанные с тенденциями развития демографической ситуации в стране, регионе: рост народонаселения влечет рост потребностей развитие рынка; старение - значительное изменение структуры общества по возрасту; падение рождаемости - угроза для одних сфер деятельности и благо для других; рост бессемейных хозяйств в различных формах - одинокие (разведенные, вдовы, молодежь), безбрачные хозяйства, проживание общиной - порождает разнообразие потребностей; - структуризация по этническим группам; географическая миграция - усиливает урбанизацию, рост предметной; возросший уровень образования – увеличение спроса на товары высокого качества и организацию досуга и др. 4. Технические - группа факторов влияет на перспективы развития, конкурентоспособность и т. д. - инновации, технологические прорывы - патенты и законы - влияние технологий на отдельные отрасли Технологические факторы: Данные факторы связаны с инновациями, роботизацией, автоматизацией процессов в конкретной отросли. Возможность применения результатов НТП определяет развитие и конкурентоспособность в конкретной отросли.</p>"}, {"number": 27, "title": "Инвестиционный климат и страновой риск", "content": "<p>Инвестиционный климат — это совокупность условий в стране (регионе, отрасли), определяющих привлекательность и безопасность вложений капитала для инвесторов. Ключевые факторы инвестиционного климата: - Политические: стабильность власти, предсказуемость политики, уровень коррупции, защита прав собственности. - Экономические: темпы роста ВВП, инфляция, курс валюты, налоговая нагрузка, развитость инфраструктуры. - Правовые: качество законодательства об инвестициях, судебная система, защита миноритарных акционеров. - Институциональные: прозрачность регулирования, административные барьеры, доступность информации. - Социальные: квалификация рабочей силы, социальная напряжённость. Инвестиционный климат оценивают через рейтинги, а также через страновые рейтинги агентств ( Страновой (суверенный) риск — вероятность финансовых потерь инвестора из‑за событий в конкретной стране, влияющих на платёжеспособность государства и контрагентов, а также на возможность вывода капитала. Основные компоненты странового риска: - Политический риск: смена режима, экспроприация/национализация, санкции, военные конфликты, массовые протесты. - Экономический риск: рецессия, высокая инфляция, девальвация, дефицит бюджета и платёжного баланса. - Финансовый риск: неспособность государства обслуживать долг, дефолт, ограничения на движение капитала. - Правовой риск: изменение законодательства задним числом, ухудшение условий для инвесторов, проблемы с исполнением контрактов. - Трансфертный риск: ограничения на конвертацию и перевод валюты за рубеж. Эти два понятия тесно связаны: страновой риск — это часть инвестиционного климата. - Высокий страновой риск обычно ухудшает инвестиционный климат. - Инвесторы закладывают премию за страновой риск в требуемую доходность: чем выше риск, тем выше ставка дисконтирования и тем меньше проектов становятся экономически оправданными. - Улучшение институтов и предсказуемости политики снижает страновой риск и улучшает инвестиционный климат.</p>"}, {"number": 28, "title": "Место страхования в защите предпринимательской деятельности", "content": "<p>Предпринимательская деятельность сопряжена с рисками — их невозможно предусмотреть полностью, поэтому сохраняется угроза убытков или недополучения прибыли. Один из способов защиты — страхование: оно позволяет нейтрализовать влияние неблагоприятных обстоятельств на финансовое состояние предпринимателя. Потенциальный страховой интерес предпринимателя — получить возмещение по максимально возможному числу рисков. При этом страховщик принимает ответственность лишь за случаи, наступление которых носит вероятностный характер и не зависит от воли страхователя. Поэтому страхованию в основном подлежат внешние риски, а не внутренние. Страхование предпринимательских рисков - совокупность видов страхования, предусматривающих обязанности страховщика по выплате страхового возмещения предпринимателя при наступлении страховых случаев, воздействующих на материально-финансовые ресурсы и результаты предпринимательской деятельности. Выделяют основные виды страхования предпринимательских рисков: 1. Страхование возможных убытков по различным сделкам, связанным с продажей товаров, работ услуг; 2. Страхование финансовых ресурсов, размещенных на депозитных и расчетных счетах банка; 3. Страхование кредитных денег; 4. Страхование средств, вложенных в реализацию инвестиционных и инновационных проектов; 5. Страхование рисков снижения объема продаж и других убытков от предпринимательской деятельности. Сущность договора страхования предпринимательских рисков — защита предпринимателя от неблагоприятных последствий его деятельности. Чаще всего страхуют финансовые риски (угрожающие средствам юрлиц). Их особенность — ущерб возникает из‑за операций в финансово‑кредитной сфере и с ценными бумагами. К видам страхования финансовых рисков относят: страхование кредитных рисков — защита от неуплаты заёмщиком основного долга и процентов; страхование валютных рисков — защита от потерь из‑за изменения курса валюты. Такое страхование реализуют через оговорки во внешнеторговых контрактах, ограничивающие возможные потери в отношениях с партнёрами.</p>"}, {"number": 29, "title": "Методические подходы к оптимизации процесса управления риском в организации", "content": "<p>Под методическими подходами к оптимизации управления риском понимают совокупность принципов, методов и алгоритмов для повышения эффективности процесса при сокращении затрат ресурсов. Цель оптимизации — максимально снизить риски при минимальных затратах, то есть найти «золотую середину», когда затраты на управление риском не превышают возможный ущерб от его реализации. Основные подходы: 1. Процессно‑ориентированный (интеграция в бизнес‑процессы). Встраивание процедур управления рисками в бизнес‑процессы (а не создание изолированной системы) — базовый принцип стандартов ISO 31000, COSO ERM. Позволяет принимать обоснованные решения в условиях неопределённости на всех уровнях управления. 2. Экономико‑математический (количественная оптимизация). Использование математических методов для выбора экономически эффективного способа управления рисками: сравнение затрат (например, на страхование) с потенциальными выгодами. Включает модели оптимизации затрат — сокращение издержек на исследование факторов риска и подбор целевых показателей с перенаправлением ресурсов на технологическое развитие. 3. Организационно‑управленческий (Lean и оптимизация процессов). Совершенствование процесса управления рисками для повышения его эффективности и снижения затрат. Применение «Бережливого производства»: фокус на ценности для клиента и устранение потерь (перепроизводство информации, задержки решений, лишние перемещения, излишняя обработка данных и др.). 4. Технологический (автоматизация и цифровизация). Оптимизация через ИТ‑решения: - автоматизация рутинных процессов с помощью программных роботов (RPA) для выполнения повторяющихся контрольных процедур; - цифровизация и единое хранилище данных — для применения сложных аналитических инструментов и многофакторных моделей. 5. Поведенческий (управление риск‑культурой). Вовлечение персонала — ключевой фактор успеха. Формирование риск‑культуры, при которой управление рисками — осознанная потребность сотрудника, а не навязанная обязанность. Важно, чтобы сотрудники видели личную ценность применения инструментов риск‑менеджмента. 6. Непрерывный мониторинг и адаптация. Обеспечение гибкости и адаптивности системы к изменениям внешней и внутренней среды. Мониторинг позволяет оценивать результативность мер и заблаговременно выявлять новые риски. На его основе проводят регулярную корректировку и оптимизацию всех элементов системы риск‑менеджмента.</p>"}, {"number": 30, "title": "Классификация финансовых рисков", "content": "<p>Финансовые риски — спекулятивные (возможны и потери, и прибыль). Возникают при отношениях с финансовыми институтами. Причины: инфляция, рост ставок, падение курса ценных бумаг. Виды финансовых рисков: 1. Риски покупательной способности денег: Инфляционный — обесценивание доходов при росте инфляции. Дефляционный — падение цен и доходов. Валютный — потери из-за изменения курсов валют. Риск ликвидности — потери при продаже активов из-за ухудшения их качества. 2. Инвестиционные риски: Риск упущенной выгоды — неполучение прибыли (например, из-за отказа от страхования/хеджирования). Риск снижения доходности — уменьшение процентов и дивидендов. Включает: процентный (потери из-за роста ставок по привлечённым средствам) и кредитный (неуплата долга заёмщиком). Риск прямых потерь: биржевой (потери по сделкам), селективный (неверный выбор вложений), риск банкротства (полная потеря капитала). 3. Валютные риски (разновидность): операционный, трансляционный (несоответствие активов и пассивов в разных валютах), экономический (влияние курса на положение компании). 4. Процентные риски: позиционный (при плавающей ставке), портфельный (влияние ставок на стоимость портфеля), экономический (влияние на компанию в целом). 5. Портфельные риски — влияние макро- и микрофакторов на портфель активов. Диверсификация снижает риски.</p>"}, {"number": 31, "title": "115-ФЗ – основное содержание и влияние на бизнес", "content": "<p>115-ФЗ — это Федеральный закон от 7 августа 2001 года № 115-ФЗ «О противодействии легализации (отмыванию) доходов, полученных преступным путём, и финансированию терроризма». Его цель — создать правовой механизм, который поможет не допустить использования финансовой системы для незаконных целей: чтобы преступно полученные деньги не легализовывались, а также чтобы средства не шли на финансирование терроризма, экстремистской деятельности и распространения оружия массового уничтожения. Сфера применения. Закон касается не только банков, но и других организаций, которые работают с деньгами или имуществом клиентов: микрофинансовых организаций (МФО), ломбардов, страховых компаний, управляющих компаний (инвестиционные фонды, НПФ), агентств недвижимости, нотариусов, аудиторов, организаторов лотерей и других. Обязанности субъектов 115-ФЗ. Такие организации обязаны: Идентифицировать клиента — собирать и проверять данные о нём (реквизиты документов) перед началом сотрудничества. Осуществлять внутренний контроль — анализировать операции и сделки клиентов, чтобы выявлять подозрительные. Сообщать в Росфинмониторинг об операциях, которые вызывают подозрения в легализации доходов или финансировании терроризма. Критерии подозрительности. Закон не даёт жёсткого списка «запрещённых» операций, но задаёт ориентиры. Например, банк может обратить внимание на: операции, не имеющие явного экономического смысла; работу с контрагентами, чьи счета демонстрируют признаки транзитных операций; отсутствие типичных для бизнеса расходов (аренда, зарплата, закупки) при значительных оборотах; платежи, не соответствующие заявленному виду деятельности компании (например, медицинская организация закупает только стройматериалы); низкую налоговую нагрузку (по рекомендациям ЦБ РФ, внимание могут привлекать показатели ниже 0,9% от оборота). Влияние на бизнес Для предпринимателей 115-ФЗ создаёт как риски, так и определённые требования к организации работы. С какими сложностями можно столкнуться: Запросы документов. Если у банка возникают сомнения, он вправе запросить у бизнеса документы, подтверждающие легальность операций: договоры, счета-фактуры, акты выполненных работ, накладные, налоговую отчётность, учредительные документы. Бизнесу приходится собирать и предоставлять эти бумаги, что требует времени и ресурсов. Ограничения в обслуживании. В случае серьёзных подозрений банк может приостановить операцию, ограничить дистанционное банковское обслуживание (ДБО) или даже расторгнуть договор банковского счёта. Риск из-за контрагентов. Бизнес несёт ответственность не только за свои действия, но и за связи. Если партнёр покажется банку подозрительным (например, активно обналичивает средства), это может отразиться на операциях компании. Сложности с репутацией. Если бизнес систематически попадает в «красную зону» в системе ЗСК, это серьёзно бьёт по деловой репутации и затрудняет привлечение финансирования или работу с новыми партнёрами. Как снизить риски и работать прозрачнее: Оформлять договорные отношения и сохранять все подтверждающие документы (накладные, акты, чеки). Подробно заполнять платёжные документы (указывать назначение платежа, реквизиты договора). Минимизировать расчёты наличными, по возможности переводить операции в безналичную форму. Тщательно проверять контрагентов перед сделкой. Следить за уровнем налоговой нагрузки. При возникновении вопросов не игнорировать запросы банка, а оперативно предоставлять пояснения и документы. В целом закон направлен на повышение прозрачности экономики, но бизнесу важно понимать его логику, чтобы не создавать лишних барьеров для легальной деятельности.</p>"}]

        function escapeRegex(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        function highlightNode(node, query) {
            if (node.nodeType === Node.TEXT_NODE) {
                const regex = new RegExp(`(${escapeRegex(query)})`, "gi");
                const parts = node.textContent.split(regex);
                if (parts.length === 1) return;
                const fragment = document.createDocumentFragment();
                parts.forEach((part, index) => {
                    if (!part) return;
                    if (index % 2 === 0) {
                        fragment.appendChild(document.createTextNode(part));
                    } else {
                        const span = document.createElement("span");
                        span.className = "highlight";
                        span.textContent = part;
                        fragment.appendChild(span);
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                Array.from(node.childNodes).forEach(child => highlightNode(child, query));
            }
        }

        function highlightHtml(value, query) {
            if (!query) return value;
            const wrapper = document.createElement("div");
            wrapper.innerHTML = value;
            highlightNode(wrapper, query);
            return wrapper.innerHTML;
        }

        const listScreen = document.getElementById("listScreen");
        const readerScreen = document.getElementById("readerScreen");
        const searchBox = document.getElementById("searchBox");
        const searchPanel = document.getElementById("searchPanel");
        const searchToggle = document.getElementById("searchToggle");
        const fontPanel = document.getElementById("fontPanel");
        const fontToggle = document.getElementById("fontToggle");
        const fontDecrease = document.getElementById("fontDecrease");
        const fontIncrease = document.getElementById("fontIncrease");
        const fontScaleValue = document.getElementById("fontScaleValue");
        const FONT_SCALE_KEY = "ved-font-scale";
        const MIN_FONT_SCALE = 80;
        const MAX_FONT_SCALE = 140;
        const FONT_SCALE_STEP = 10;
        let listScrollPosition = 0;
        let fontScale = 100;

        function renderItems(items, query) {
            const container = document.getElementById("itemContainer");
            const noResults = document.getElementById("noResults");
            container.innerHTML = "";
            noResults.classList.toggle("hidden", items.length > 0);
            document.getElementById("resultCount").textContent = query
                ? `Найдено: ${items.length}`
                : `${questions.length} вопросов`;

            items.forEach(item => {
                const element = document.createElement("button");
                element.type = "button";
                element.className = "item";
                element.dataset.question = item.number;
                element.setAttribute("aria-label", `Открыть вопрос ${item.number}: ${item.title}`);
                element.innerHTML = `
                    <div class="item-header">Вопрос ${item.number}</div>
                    <div class="item-title">${highlightHtml(item.title, query)}</div>
                `;
                element.addEventListener("click", () => openQuestion(item.number));
                container.appendChild(element);
            });
            updateWatchFocus();
        }

        function searchItems() {
            const query = searchBox.value.trim().toLowerCase();
            const items = query
                ? questions.filter(item => item.number.toString().includes(query) || item.searchText.includes(query))
                : questions;
            renderItems(items, query);
        }

        function toggleSearch(forceOpen) {
            const shouldOpen = forceOpen ?? searchPanel.classList.contains("hidden");
            searchPanel.classList.toggle("hidden", !shouldOpen);
            searchToggle.setAttribute("aria-expanded", shouldOpen.toString());
            if (shouldOpen) searchBox.focus();
        }

        function setFontScale(value, persist = true) {
            const parsed = value === null || value === "" ? NaN : Number(value);
            fontScale = Number.isFinite(parsed)
                ? Math.min(MAX_FONT_SCALE, Math.max(MIN_FONT_SCALE, Math.round(parsed / FONT_SCALE_STEP) * FONT_SCALE_STEP))
                : 100;
            document.documentElement.style.setProperty("--font-scale", fontScale / 100);
            fontScaleValue.textContent = `${fontScale}%`;
            fontDecrease.disabled = fontScale === MIN_FONT_SCALE;
            fontIncrease.disabled = fontScale === MAX_FONT_SCALE;
            if (persist) {
                try {
                    localStorage.setItem(FONT_SCALE_KEY, fontScale.toString());
                } catch {}
            }
            updateWatchFocus();
        }

        function loadFontScale() {
            try {
                return localStorage.getItem(FONT_SCALE_KEY);
            } catch {
                return null;
            }
        }

        function changeFontScale(direction) {
            setFontScale(fontScale + direction * FONT_SCALE_STEP);
        }

        function toggleFontPanel(forceOpen) {
            const shouldOpen = forceOpen ?? fontPanel.classList.contains("hidden");
            fontPanel.classList.toggle("hidden", !shouldOpen);
            fontToggle.setAttribute("aria-expanded", shouldOpen.toString());
        }

        function addTableHints(container) {
            container.querySelectorAll(".table-scroll").forEach(table => {
                const hint = document.createElement("p");
                hint.className = "table-hint";
                hint.textContent = "Листайте таблицу влево →";
                table.before(hint);
            });
        }

        function openQuestion(number, updateHash = true) {
            const item = questions[number - 1];
            if (!item) return;
            if (!listScreen.classList.contains("hidden")) listScrollPosition = window.scrollY;
            document.getElementById("readerNumber").textContent = `Вопрос ${item.number} из ${questions.length}`;
            document.getElementById("readerTitle").textContent = item.title;
            const content = document.getElementById("readerContent");
            content.innerHTML = highlightHtml(item.content, searchBox.value.trim());
            addTableHints(content);
            document.getElementById("prevQuestion").disabled = item.number === 1;
            document.getElementById("nextQuestion").disabled = item.number === questions.length;
            document.getElementById("prevQuestion").dataset.question = item.number - 1;
            document.getElementById("nextQuestion").dataset.question = item.number + 1;
            listScreen.classList.add("hidden");
            readerScreen.classList.remove("hidden");
            document.body.dataset.screen = "reader";
            if (updateHash) history.pushState({ question: item.number }, "", `#question-${item.number}`);
            window.scrollTo(0, 0);
            updateReadingProgress();
        }

        function showList(updateHash = true) {
            readerScreen.classList.add("hidden");
            listScreen.classList.remove("hidden");
            document.body.dataset.screen = "list";
            if (updateHash) history.pushState({}, "", location.pathname + location.search);
            requestAnimationFrame(() => {
                window.scrollTo(0, listScrollPosition);
                updateWatchFocus();
            });
        }

        function routeFromHash() {
            const match = location.hash.match(/^#question-(\d+)$/);
            if (match) {
                openQuestion(Number(match[1]), false);
            } else {
                showList(false);
            }
        }

        function updateReadingProgress() {
            if (document.body.dataset.screen !== "reader") return;
            const scrollable = document.documentElement.scrollHeight - window.innerHeight;
            const progress = scrollable > 0 ? Math.min(100, window.scrollY / scrollable * 100) : 100;
            document.getElementById("progressBar").style.width = `${progress}%`;
        }

        function updateWatchFocus() {
            if (window.innerWidth > 480 || window.innerHeight > 480 || document.body.dataset.screen === "reader") return;
            const center = window.innerHeight / 2;
            let closest = null;
            let closestDistance = Infinity;
            document.querySelectorAll(".item").forEach(item => {
                item.classList.remove("watch-focus");
                const rect = item.getBoundingClientRect();
                const distance = Math.abs(rect.top + rect.height / 2 - center);
                if (distance < closestDistance) {
                    closest = item;
                    closestDistance = distance;
                }
            });
            if (closest) closest.classList.add("watch-focus");
        }

        questions.forEach(item => {
            const wrapper = document.createElement("div");
            wrapper.innerHTML = item.content;
            item.searchText = `${item.title} ${wrapper.textContent}`.toLowerCase();
        });

        searchToggle.addEventListener("click", () => toggleSearch());
        fontToggle.addEventListener("click", () => toggleFontPanel());
        fontDecrease.addEventListener("click", () => changeFontScale(-1));
        fontIncrease.addEventListener("click", () => changeFontScale(1));
        document.getElementById("fontReset").addEventListener("click", () => setFontScale(100));
        document.getElementById("searchClear").addEventListener("click", () => {
            searchBox.value = "";
            searchItems();
            searchBox.focus();
        });
        searchBox.addEventListener("input", searchItems);
        document.getElementById("readerBack").addEventListener("click", () => showList());
        document.getElementById("prevQuestion").addEventListener("click", event => openQuestion(Number(event.currentTarget.dataset.question)));
        document.getElementById("nextQuestion").addEventListener("click", event => openQuestion(Number(event.currentTarget.dataset.question)));
        window.addEventListener("scroll", () => {
            updateReadingProgress();
            updateWatchFocus();
        }, { passive: true });
        window.addEventListener("resize", updateWatchFocus);
        window.addEventListener("popstate", routeFromHash);

        setFontScale(loadFontScale(), false);
        document.body.dataset.screen = "list";
        renderItems(questions, "");
