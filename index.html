    <script>
        const questions = [{"number": 1, "title": "Определение и содержание внешнеэкономической деятельности", "content": "<p><em><strong>Внешнеэкономическая деятельность –</strong></em> внешнеторговая, инвестиционная и иная деятельность, включая производственную кооперацию, в области международного обмена товарами, информацией, работами, услугами, результатами интеллектуальной деятельности (правами на них).</p><p><em><strong>В соответствии со ст. 71 Конституции РФ </strong></em><em><strong>в</strong></em><em><strong> введении РФ (применительно к сфере ВЭД) находятся:</strong></em></p><p>- внешняя политика и международные отношения;</p><p>- международные договоры РФ;</p><p>- вопросы войны и мира, внешнеэкономические отношения;</p><p>- установление правовых основ единого рынка;</p><p>- финансовое, валютное, кредитное, таможенное регулирование;</p><p>- денежная эмиссия, основы ценовой политики.</p><p><em><strong>В соответствии со ст. 72 Конституции РФ в совместном ведении РФ и субъектов РФ находятся:</strong></em></p><p>- координация международных и внешнеэкономических связей субъектов РФ;</p><p>- выполнение международных договоров РФ.</p><p>Внешнеэкономическая деятельность тесно связана с внешнеполитической деятельностью цель и</p><p>основные задачи которой, закреплены в Концепции внешней политики РФ.</p><p>Концепция внешней политики РФ</p><p>1993 — сохранение единства территориальной целостности РФ.</p><p>2000 — защита интересов личности, общества и государства</p><p>2008 — многовекторность как отличительная черта российской внешней политики</p><p>2013 — рост ответственности за формирование основ международной системы</p><p>2016 — кризис отношений с Западом, вызванный геополитической экспансией США, НАТО и ЕС</p><p>2023 — переоценка тенденций развития современного мира</p>"}, {"number": 2, "title": "Субъекты внешнеэкономической деятельности", "content": "<p><em><strong>Субъекты ВЭД –</strong></em> субъекты, регулирующие внешнеэкономическую деятельность, а также субъекты, осуществляющие предпринимательскую деятельность во внешнеторговой сфере.</p><div class=\"table-scroll\"><table><tr><td><p><em>Обладающие</em><em> общей компетенцией</em></p></td><td><p><em>Обладающие</em><em> специальной компетенцией </em></p></td></tr><tr><td><p>Президент РФ</p></td><td><p>Фед. таможенная служба</p></td></tr><tr><td><p>Правительство РФ</p></td><td><p>Минфин РФ</p></td></tr><tr><td><p>Минпромторг РФ</p></td><td><p>Фед. комиссии, подразделения и службы, наделенные полномочиями в сфере регулирования ВЭД</p></td></tr></table></div><p><em><strong>Органы гос. власти, регулирующие ВЭД:</strong></em></p><p>1<em>. </em><em>Правительство РФ</em> (разрабатывает законы и правила, направленные на защиту и обеспечение стабильности рубля и экономики в целом. Анализирует экономическую ситуацию и прогнозирует будущее, а также координирует международное экономическое сотрудничество);</p><p><em>2. </em><em>Федеральная таможенная служба</em> (Следит за перемещением товаров через границы РФ. Взимает таможенные пошлины, а также борется с контрабандой и другими нарушениями);</p><p>3. <em>Федеральная налоговая служба</em> (Занимается контролем и надзором за соблюдением налогового законодательства);</p><p>4.<em>Центральный банк РФ</em> (Издает нормативные акты в отношении валютных операций, а также их учета и контроля. Следит за стабильностью рубля и платежным балансом страны);</p><p>5. <em>Министерство промышленности и торговли РФ (</em>Разрабатывает и реализует программы по ВЭ, а также заключает торговые соглашения с другими странами);</p><p>6. <em>Россельхознадзор (</em>Регулирует импорт и экспорт сельхоз. товаров, проверяет их на соответствие санитарным и фитосанитарным требованиям и предотвращает ввоз некачественной продукции);</p><p>7. <em>Роспотребнадзор </em>(Проверяет импортируемую продукцию на соответствие российским стандартам качества и безопасности. А также контролирует ввоз товаров, представляющие потенциальную угрозу)</p>"}, {"number": 3, "title": "Сущность и классификация внешнеэкономических связей", "content": "<p><em><strong>Внешнеэкономические связи —</strong></em> это комплексная система международного сотрудничества государств и их субъектов во всех отраслях экономики. Эти двусторонние отношения охватывают производственную, торговую, инвестиционную и финансовую деятельность государства.</p><p><em><strong>Сущность внешнеэкономических связей как экономической категории проявляется в их функциях:</strong></em></p><p>-Организация и обслуживание международного обмена природными ресурсами и результатами труда в их вещественной и стоимостной форме.</p><p>-Международное признание потребительной стоимости продуктов международного разделения труда.</p><p>-Организация международного денежного обращения.</p><p>Классификация внешнеэкономических связей подразумевает распределение этих связей на конкретные группы по определенным признакам для достижения поставленных целей. Классификационная система состоит из видов и форм связей:</p><p>Вид — это совокупность связей, объединенная одним общим признаком, например направлением товарного потока и структурным признаком.</p><p>Направление товарного потока определяет движение товара (услуги, работы) из одной страны в другую, то есть отражает вывоз товара из страны или ввоз товара в другую страну. По этому признаку внешнеэкономические связи делятся на экспортные, связанные с продажей и вывозом товара, и импортные, связанные с покупкой и ввозом товара.</p><p>Структурный признак определяет групповой состав связи и связан со сферой экономических интересов и с основной целью внешнеэкономической деятельности государства. По этому признаку связи подразделяются на внешнеторговые, финансовые, производственные, инвестиционные.</p><p>Форма связи — это способ существования данного вида связи, внешнее проявление (очертание, оформление) сущности какой-либо конкретной связи. К формам внешнеэкономических связей относят торговлю, бартер, туризм, инжиниринг, франчайзинг, лизинг и другие.</p>"}, {"number": 4, "title": "Маркетинг во внешнеэкономической деятельности: сущность и основные характеристики", "content": "<p><em><strong>Маркетинг</strong></em><em> –</em> комплекс действий по подготовке и производству товаров, который будет востребован покупателем и будет отличаться от конкурентов.</p><p><em><strong>Этапы маркетинга</strong></em><strong>:</strong></p><p>1. Исследование рынка и покупателей;</p><p>2. Выявление их потребностей и мотивов совершения покупки;</p><p>3. Продвижение товаров на рынок;</p><p>4. Продажа товара;</p><p>5. Удовлетворение потребностей</p><p><em><strong>Характеристики маркетинга</strong></em><em>:</em></p><p>- Становится участником всех организационных и управленческих процессов организации;</p><p>- Рассматривается как основной элемент общей стратегии организации;</p><p>- Основывается на формировании долгосрочных отношений с потребителем;</p><p>- Маркетинговая стратегия становится частью нематериальных активов организации;</p><p>-Ориентируется на потребителей, а не на товар.</p><p><em><strong>Особенности международного маркетинга и продвижения товаров на внешние рынки:</strong></em></p><p>1) Важное значение имеет адаптация продукта к новым зарубежным рынкам</p><p>2) Изучение новых рынков требует значительных издержек, как финансовых, так и трудовых</p><p>3) Внешние рынки представляют более высокие требования к товарам по сравнению с требованиями внутреннего рынка</p><p>4) Мероприятия по продвижению продукта на внешнем рынке требуют значительных затрат</p><p><em><strong>Факторы, влияющие на выход отечественных производителей на зарубежные рынки:</strong></em></p><p>- Наличие неиспользованных производственных мощностей</p><p>- Удовлетворение внутреннего спроса на производимый товар</p><p>- Изменение покупательной способности на внутреннем рынке</p><p>- Появление возможности ведения бизнеса за границей</p><p>- Увеличивавшаяся экспансия на международные рынки</p><p>- Благоприятная для конкурентного производителя или товара экономическая и коммерческая ситуация на зарубежных рынках</p><p>- Возможность получить большую прибыль при продаже продукта на внешнем рынке по сравнению с внутренним рынком</p><p><em><strong>Развитие ВЭД и международного маркетинга</strong></em></p><p>1) <em>Обеспечивает более высокий уровень жизни</em> – товары, которые по разным причинам не могут быть произведены на территории конкретной страны, становится доступными;</p><p>2) <em>Обеспечивает оптимальное и рациональное использование ресурсов</em> – глобальный международный рынок позволяет экспортировать то, что с избытком есть у одной страны, и то, чего не хватает другим странам;</p><p>3) <em>Усиление международного сотрудничества</em> – торговые отношения между странами обеспечивают стабильность и устраняют экономическое неравенство;</p><p>4) Эффективное использование избыточного внутреннего производства.</p>"}, {"number": 5, "title": "Международные маркетинговые исследования", "content": "<p><em><strong>Международные маркетинговые исследования</strong></em><em> –</em> комплекс действий, направленных на изучение рынка и товара, который планируется выводить на рынок.</p><p>Особенности международного маркетинга и продвижения товаров на внешние рынки:</p><p>-Важное значение имеет адаптация продукта к новым зарубежным рынкам</p><p>-Изучение новых рынков требует значительных издержек, как финансовых, так и трудовых</p><p>-Внешние рынки предъявляют более высокие требования к товарам по сравнению с требованиями внутреннего рынка</p><p>-Мероприятия по продвижению продукта на внешнем рынке требуют значительных затрат</p><p>Факторы, влияющие на выход отечественных производителей на зарубежные рынки:</p><p>-Наличие неиспользованных производственных мощностей</p><p>-Удовлетворение внутреннего спроса на производимый товар</p><p>-Изменение покупательной способности на внутреннем рынке</p><p>-Появление возможности ведения бизнеса за границей</p><p>-Увеличивающаяся экспансия на международные рынки</p><p>-Благоприятная для конкретного производителя или товара экономическая и коммерческая ситуация</p><p>на зарубежных рынках</p><p>-Возможность получить большую прибыль при продаже продукта на внешнем рынке по сравнению</p><p>с внутренним рынком</p><p>Развитие ВЭД и международного маркетинга:</p><p>-Обеспечивает более высокий уровень жизни (товары, которые по разным причинам не могут быть</p><p>произведены на территории конкретной страны, становятся доступными)</p><p>-Обеспечивает оптимальное и рациональное использования ресурсов (глобальный международный</p><p>рынок позволяет экспортировать то, что с избытком есть у одной страны, и то, чего не хватает</p><p>другим странам)</p><p>-Усиление международного сотрудничества (торговые отношения между странами обеспечивают</p><p>стабильность и устраняют экономическое неравенство).</p>"}, {"number": 6, "title": "Маркетинг 4Р (1Р Продукт)", "content": "<p>- Продукт</p><p>1. <em>Формирование </em><em>мультиатрибутивной</em><em> модели</em> (определяется как концепция, где товар представляет собой совокупность благ). Выделяют 5 уровневую мультиатрибутивную модель: Ключевой продукт; основной продукт; ожидаемый продукт; улучшенный продукт; потенциальный продукт.</p><p>(1. <strong>Ключевой продукт</strong>. Формируется ключевая ценность продукта, т.е. какую пользу он приносит потребителю и какую проблему решает.</p><p>2. <strong>Основной продукт</strong>. Формируется основной набор характеристик, позволяющий удовлетворить определенные потребности покупателей. На данном уровне определяется основная выгода продукта.</p><p>3. <strong>Ожидаемый продукт.</strong> Формируется набор полезных свойств и качеств товара, который соответствует минимальным ожиданиям потребителя. Как правило, ожидаемый продукт НЕ РАСКРЫВАЕТ ключевого конкурентного преимущества.</p><p>4. <strong>Улучшенный (дополнительный) продукт.</strong> Включает в себя дополнительные характеристики, повышающие его потребительскую ценность. Улучшенный товар представляет собой предложение, которое превышает ожидания потребителей и, как правило, отличается от конкурентов.</p><p>5. <strong>Потенциальный (идеальный) продукт</strong>. Включает в себя все возможные характеристики, превосходящие ожидания потребителей. Продукт данного уровня несет в себе максимальные выгоды для потребителей. Это продукт, к которому должна стремиться компания.)</p><p><em>2. Формирование конкурентных преимуществ;</em></p><p><em>3. Формирование конкурентной стратегии.</em></p><p><em><strong>Многоуровневая модель позволяет:</strong></em></p><p>- определить его ключевую идею;</p><p>- предложить комплекс базовых характеристик, которые способны удовлетворить потребности;</p><p>- сформировать предложение, которое будет представлять потребителю ценность, соответствующую его ожиданиям или превышающую их;</p><p>- способствовать постоянному поиску направлений для развития и совершенствования товара, повышению его конкурентоспособности.</p><p><em><strong>2. Формирование конкурентных преимуществ</strong></em></p><p>Конкурентоспособность – это возможность противостоять конкурентам в долгосрочной перспективе и привлекать покупателей.</p><p><em><strong>Этапы формирования конкурентных преимуществ:</strong></em></p><p>- анализ продукта и конкурентов</p><p>- определить целевую аудиторию продукта</p><p>- определить выгоды потребителя</p><p>- определить способы реализации преимущества</p><p><em><strong>Абсолютные конкурентные преимущества</strong></em> – связаны с наличием у организации уникальных ресурсов и возможностей, позволяющих на более выгодных условиях продавать свой продукт.</p><p><em><strong>Сравнительные конкурентные преимущества –</strong></em> обусловлены лучшими по сравнению с другими странами характеристиками.</p><p><em><strong>3. Формирование конкурентной стратегии </strong></em></p>"}, {"number": 7, "title": "Маркетинг 4Р (2Р Цена)", "content": "<p><em><strong>Факторы, влияющие на формирование цены экспортного товара</strong></em><em><strong>: </strong></em></p><p>1) Издержки производства</p><p>2) Затраты, связанные с выполнением условий экспортной поставки</p><p>3) Цены на аналогичную продукцию у конкурентов</p><p>4) Качество выпускаемой продукции</p><p>5) Спрос на продукцию</p><p>6) Желаемая (планируемая) прибыль</p><p><em><strong>Подходы к формированию цены:</strong></em></p><p><em><strong>-</strong></em><em>Затратный</em><em> (производственный</em>) – ключевыми факторами являются затраты на создание и производство товара.</p><p><em><strong>-</strong></em><em>Рыночный</em> – ключевыми факторами являются конъюнктура рынка, соотношение спроса и предложения.</p><p><em><strong>Ценовая политика компании</strong></em> – общие принципы, которых придерживается компания, устанавливая цены на производимую и реализуемую продукцию (услуги), и направленные на достижение целей компании.</p><div class=\"table-scroll\"><table><tr><td><p><strong>Виды политики ценообразования</strong></p></td></tr><tr><td><p>Премиального ценообразования</p></td><td><p>Нейтрального ценообразования</p></td><td><p>Низкого ценообразования (ценового прорыва)</p></td></tr><tr><td><p>Отсутствие прямых конкурентов, которые могли бы стремительно нарастить предложение или предложить более уникальный товар.</p></td><td><p>Применятся ко всем товарам широкого потребления и позволяет организации поддерживать стабильное положение на рынке в условиях «спокойной» конкуренции.</p></td><td><p>Предполагает установление цен на товары существенно ниже уровня, который воспринимается большинством потребителей как соответствующий ценности товара.</p></td></tr></table></div><p><em><strong>Факторы, влияющие на разработку ценовой политики:</strong></em></p><div class=\"table-scroll\"><table><tr><td><p><em>Внешние</em></p></td><td><p><em>Внутренние</em></p></td></tr><tr><td><p><strong>На национальном рынке:</strong></p><p>- государственная политика в области ценообразования, финансов, налогообложения, внешней торговли;</p><p>- уровень инфляции;</p><p>- действия и реакция конкурентов;</p><p>- предпочтения покупателей;</p><p>- чувствительность покупателей к уровням цен.</p></td><td><p>- брэнд и имидж компании на рынках;</p><p>- качество продукции;</p><p>- дополнительные услуги к товару;</p><p>- наличие уникальных ресурсов (материальных, финансовых, трудовых)</p></td></tr><tr><td><p><strong>На зарубежных рынках:</strong></p><p>- политические факторы;</p><p>- законодательство зарубежных стран;</p><p>- состояние конъюнктуры рынков;</p><p>- колебания валютных курсов;</p><p>- запреты, ограничения, санитарные нормы, технические нормы и т.п.</p></td><td></td></tr></table></div><p><em><strong>Ценовая стратегия –</strong></em> средство реализации на рынке ценовой политики компании.</p><p><em><strong>ЦЕНОВАЯ СТРАТЕГИЯ –</strong></em> ЭТО ВЫБОР оптимального варианта цена из нескольких возможных для достижения поставленных целей.</p><div class=\"table-scroll\"><table><tr><td><p><em><strong>Виды ценовых стратегий </strong></em></p></td></tr><tr><td><p><em>Дифференцированного ценообразования </em></p></td><td><p><em>Конкурентного ценообразования </em></p></td><td><p><em>Ассортиментного ценообразования </em></p></td></tr><tr><td><p>Построена на неоднородности рынка и покупателей, когда один и тот же товар может быть продан на различных рынках и различным группам покупателей по разным ценам. Успешность применения стратегии зависит от точности и качества сегментации.</p></td><td><p>Основывается на том, что цены на товары формируются с учетом действующих на рынке цен у конкурентов.</p></td><td><p>Предполагает, производство и реализацию широкого ассортимента товаров, а также наличие набора аналогичных, сопряженных или взаимосвязанных товаров.</p></td></tr></table></div>"}, {"number": 8, "title": "Маркетинг 4Р (3Р Место)", "content": "<p>Правильный выбор места продажи обеспечивает доступность продукта для потенциальных потребителей.</p><p><em><strong>Канал распределения</strong></em><em> –</em> это путь, по которому товары движутся от производителей к потребителям (совокупность компаний).</p><p><em><strong>Характеристика каналов распределения:</strong></em></p><p><em>Уровень канала распределения -</em> посредник процесса товародвижения, выполняющий операции по приближению товара к конечному потребителю;</p><p><em>Длина канала распределения -</em> протяженность (длина) канала в международной торговле определяется количеством имеющихся в нем промежуточных уровней, т.е. посредников;</p><p><em>Ширина канала распределения -</em> характеризуется количеством однотипных участников конкретного уровня.</p><p><em><strong>Виды каналов распределения:</strong></em></p><p><em><strong>- </strong></em><em>Прямой канал распределения</em> – движение товара происходит непосредственно от производителя к потребителю</p><p>-<em>Косвенный канал распределения</em> – движение товара происходит от производителя, через посредников к потребителю:</p><p>Производитель → Экспортер посредник → Зарубежный оптовый продавец → Зарубежный розничный продавец → Потребитель</p><p><em><strong>Преимущества прямого канала распределения:</strong></em></p><p><em><strong>- </strong></em>Контроль за движением товара</p><p>-Реагирование на требования</p><p>-Контроль качества и цены</p><p>-Увеличение прибыли</p><p><em><strong>-</strong></em>Контроль над долей рынка</p><p>-Отношения с клиентами</p><p><em><strong>Недостатки прямого канала распределения:</strong></em></p><p><em><strong>-</strong></em>Инвестиции в канал продаж</p><p>-Необходимость в кадровом обеспечении</p><p>-Риски и издержки</p><p>-Задачи по организации сбыта</p><p><em><strong>Преимущества косвенного канала распределения:</strong></em></p><p><em><strong>-</strong></em>Посредники</p><p>-Оптимизация распределения</p><p>-Охват новых рынков</p><p>-Удовлетворение потребностей потребителей</p><p><em><strong>Недостатки косвенного канала распределения:</strong></em></p><p><em><strong>-</strong></em>Высокие затраты</p><p>-Зависимость от посредников</p><p>-Конфликты в канале</p><p>-Потеря контроля</p><p>-Отсутствие прямого контакта</p><p>-Снижение маржи</p><p><em><strong>Формы работы на зарубежных рынках</strong></em></p><div class=\"table-scroll\"><table><tr><td><p>Показатель</p></td><td><p>Собственной представительство</p></td><td><p>Эксклюзивный дистрибьютер</p></td><td><p>Несколько дистрибьютеров</p></td></tr><tr><td><p>Влияние производителя на развитие торговой марки в регионе и уровень цен</p></td><td><p>Высокое (представительство реализует разработанную производителем маркетиноговую программу)</p></td><td><p>Среднее или высокое (возможно построение и реализация маркетинговых программ)</p></td><td><p>Слабое или среднее (затруднено проведение последовательного долгосрочного развития)</p></td></tr><tr><td><p>Покрытие потенциала региона (экспертная оценка)</p></td><td><p>60-70%</p></td><td><p>70-80%</p></td><td><p>80-90%</p></td></tr><tr><td><p>Затраты на организацию и поддержание канала распределения</p></td><td><p>Большие затраты на поддержание полноценной структуры представительства</p></td><td><p>Средние затраты напредоставление больших торговых скидок, покрытие затрат на продвижение продукции</p></td><td><p>Низкие или средние (в основном только на представление торговых скидок)</p></td></tr><tr><td><p>Возможное поведение</p></td><td><p>Контролируется из центрального офиса</p></td><td><p>Возможное завышение цен</p></td><td><p>Возможны ценовые войны</p></td></tr><tr><td><p>Возможные действия производителя</p></td><td><p>Системный контроль за представительством</p></td><td><p>- договор о максимальной наценке</p><p>- бонусы за выполнение планов продаж</p><p>- требования по уровню дестрибуции</p><p>- угроза открытия второго дистрибьютора</p></td><td><p>- разделение рынков по географическому или другому признаку</p><p>- договор о минимальной цене</p><p>- снижение скидки нарушающему договор дистрибьютеру</p></td></tr></table></div>"}, {"number": 9, "title": "Маркетинг 4Р (4Р Продвижение)", "content": "<p><strong>ФАКТОРЫ</strong><strong> ВЛИЯЮЩИЕ НА ПРОДВИЖЕНИЕ</strong></p><p><em><strong>Наличие экономической системы </strong></em></p><p>Влияние экономических систем на продвижение продукции</p><p><em><strong>Политические системы </strong></em></p><p>Влияние политических систем на продвижение продукции</p><p><em><strong>Потребительные модели </strong></em></p><p>Влияние потребительских моделей на продвижение продукции</p><p><em><strong>Конкурентная среда </strong></em></p><p>Влияние конкурентной среды на продвижение продукции</p><p><em><strong>Технологическое развитие </strong></em></p><p>Влияние технологического развития на продвижение продукции</p><p><strong>ОСОБЕННОСТИ ПРОДВИЖЕНИЯ В РАЗНЫХ СТРАНАХ</strong></p><p><em><strong>КИТАЙ</strong></em></p><p><em><strong>Доминирование цифровых платформ</strong></em></p><p>WeChat, Little Red Book</p><p><em><strong>Культ</strong></em><em><strong> KOL (Key Opinion Leaders) </strong></em><em><strong>и</strong></em><em><strong> live-</strong></em><em><strong>стримы</strong></em></p><p>Инфлюэнсеры, Шопинг-стримы</p><p><em><strong>Государственная цензура (</strong></em><em><strong>недоступны</strong></em><em><strong>)</strong></em></p><p>Google, Facebook, YouTube</p><p><em><strong>Электронная коммерция</strong></em></p><p>Alibaba, Pinduoduo</p><p><em><strong>Национальный патриотизм</strong></em></p><p>«Сделано в Китае», Локальные бренды</p><p><em><strong>АФРИКА (ЮАР, НИГЕРИЯ, КЕНИЯ, ЕГИПЕТ)</strong></em></p><p>Соцсети: Facebook WhatsApp Instagram</p><p><em><strong>Особенности продвижения</strong></em></p><p>Низкий уровень доверия к онлайн-платежам, Мобильный интернет, Местные маркетплейсы, Локальные продукты</p><p>Важно: Сарафанное радио, Локальные лидеры мнений</p><p><strong>США</strong></p><p>Цифровые каналы: Google Ads, Meta, TikTok, Amazon Ads</p><p>Региональные различия: Адаптация контента</p><p>Высокая конкуренция: УТП, Конкурентный анализ, Культура скидок и купонов</p><p>Доверие к отзывам: Сбор отзывов, Управление репутацией</p><p><strong>РОССИЯ</strong></p><p>Соцсети: Вконтакте, Telegram, Одноклассники, YouTube, Rutube</p><p>Маркетплейсы: Wildberries, Ozon, СберМегаМаркет, Avito</p><p>Поисковые системы: Яндекс Google</p><p>ТВ и радио: Ориентация на регионы, Аудитория 45+</p><p>Выставки и B2B-центры: Отраслевые выставки, Деловые мероприятия</p><p>Наружная реклама: Билборды, Транспорт</p><p>Продажи и модификации: Скидки, Подарки</p><p>Любовь к скидкам: Акции «2 по цене 1», Чёрная пятница</p><p>Региональные различия: Москва / Санкт-Петербург и Малые города</p><p>Культурные и поведенческие особенности: Доверие к «своим», Локальные бренды, Рекомендации знакомых, Консерватизм части аудитории</p>"}, {"number": 10, "title": "Информационное обеспечение маркетинга", "content": "<p>Под <em><strong>маркетинговой</strong></em><strong> </strong><em><strong>информацией</strong></em><strong> </strong>понимают цифры, факты, сведения и другие данные, необходимые для обеспечения аналитических потребностей маркетинга. Маркетинговая информация может быть количественной и качественной.</p><p><em><strong>Информационное обеспечение маркетинга</strong></em><em> -</em> процесс сбора, систематизации, анализа и передачи информации о рынке и его характеристиках для подготовки рекомендаций с целью совершенствования процесса управления маркетингом. В систему Информационного обеспечения маркетинга входят:</p><p>а) <em>каналы поступления информации о внутренних делах и положении фирмы</em> - оперативная информация о производстве, портфеле имеющихся заказов, текущих поставках продукции, ценовых показателях и т. п.;</p><p>б) <em>каналы поступления информации о внешней среде</em> - состояние рынков, на которых работает фирма (по определенному кругу показателей), поведение и предпочтение покупателей, изменение в стратегии и тактике поведения основных конкурентов, появление новых товаров-аналогов на рынке; государственная экономическая и внешнеэкономическая политика в привязке к соответствующим рынкам и др.</p>"}, {"number": 11, "title": "Выбор маркетинговой стратегии", "content": "<p>ФОРМИРОВАНИЕ КОНКУРЕНТНОЙ СТРАТЕГИИ: «Суть стратегии заключается в выборе того, чего делать НЕ следует.» - Майкл Портер (американский экономист).</p><p>РАЗРАБОТКА БИЗНЕС-СТРАТЕГИИ: Ключевой вопрос- кого и как будем побеждать?</p><p><em><strong>Разработка стратегии:</strong></em></p><p>-Анализ конкурентной среды</p><p>-Оценка собственных ресурсов</p><p>-Выбор пути и модели стратегии</p><p><em><strong>Критерии конкурентного преимущества товара:</strong></em></p><p>1. Полезность (Продукт должен решать конкретную задачу покупателя)</p><p>2. Уникальность (Конкурентное преимущество не должно встречаться у конкурентов)</p><p>3.Ценность для потребителей (Конкурентное преимущество должно обладать ценностью для клиента)</p><p>4. Неповторимость (Конкурентам должно быть сложно скопировать преимущества)</p><p>5. Доверия (Товар или компания должны вызывать доверие у потребителей)</p><p><em><strong>Базовые стратегии по Портеру:</strong></em></p><p>1) Стратегия дифференцирования (Apple, Сбер) создавать уникальные продукты или услуги, за которые клиенты готовы платить больше.</p><p>2) Стратегия лидерства по издержкам (Магнит, Вкусно и точка) быть самым эффективным и дешёвым производителем в отрасли, сохраняя приемлемое качество.</p><p>3) Стратегия фокусирования (Л’Этуаль, Bose) концентрироваться на нишевом сегменте рынка.</p><p><em><strong>Управление:</strong></em></p><p>1. проектами (проектное управление)</p><p>2. Процессами (процессоре управление)</p><p>3. Людьми (функциональное управление)</p><p><em>Бизнес - процесс — это</em> повторяющаяся последовательность действий по преобразованию входов в выход, направленная на получение результата, ценного для организации или потребителя.</p><p><em><strong>Элементы бизнес-процесса:</strong></em></p><p>1.  Что делает</p><p>2.  Зачем делает</p><p>3.  Когда и кто делает</p><p>4.  Как делает</p><p>5.  Какие ресурсы используются</p><p>6.  Какой результат и чем измеряется</p><p>Международные продуктовые стратегии:</p><p>1. Товар без изменений (прямое распространение)</p><p>2. Адаптированный товар</p><p>3. Разработка нового продукта</p><p><em>Адаптация -</em> это процесс приспособления продукции и (или) коммуникаций к требованиям зарубежного рынка.</p><p><em>Стандартизация </em>- это установление определенных требований к качеству товара, оформлению, упаковке.</p><p><em><strong>Виды адаптации:</strong></em></p><p>• вынужденная (связана с необходимостью учитывать регулирующие требования и нормы принимающей страны, которые необходимо учитывать)</p><p>• Необходимая (желание производителя достичь максимального соответствия своих товаров запросам зарубежных потребителей)</p>"}, {"number": 12, "title": "Понятие и сущность логистики", "content": "<p>Важным этапом организации ВЭД является логистика и ее документальное обеспечение.</p><p><em><strong>Логистика –</strong></em> система процессов планирования, управления и контроля организации складирования, в транспортировке и распределения товаров на основе документального и информационного обеспечения.</p><p><em><strong>В развитии логистики ВЭД выделяют следующие основные направления:</strong></em></p><p>1. Реализация национальной продукции на международном рынке (экспорт);</p><p>2. Приобретение продукции на международном рынке для внутренних потребностей (импорт);</p><p>3. Перемещение товаров в рамках участия в международном рынке (реэкспорт /реимпорт).</p><p><em><strong>Логистика решает следующие задачи</strong></em>:</p><p>- Определение оптимальных направлений движения товаров;</p><p>- Организация процессов складирования, транспортировки и распределения товаров;</p><p>- Планирование и прогнозирование объектов перевозок;</p><p>- Обеспечение сохранности и целостности товаров по качеству и количеству;</p><p>- Обеспечение правового, таможенного, финансового сопровождения логистических процессов;</p><p>- Поиск направлений совершенствования логистической деятельности.</p><p><em><strong>Функции логистики:</strong></em></p><p>1. <em>Интегрирующая</em><em> </em>(реализуется посредством создания процесса движения товаров в единой целостной системе);</p><p>2. <em>Системообразующая </em>(создание на основе эффективного управления системы логистики, ориентированной на рациональное использование ресурсов организации);</p><p>3. <em>Организующая</em> (направлена на организацию эффективного взаимодействия между участниками товародвижения);</p><p>4. <em>Управляющая </em>(обеспечение рационального процесса товародвижения и эффективного использования ресурсов на всех этапах логистической цепи).</p>"}, {"number": 13, "title": "Правовое обеспечение логистической деятельности", "content": "<p><em><strong>Общие и межотраслевые акты</strong></em></p><p>Конституция РФ</p><p>Гражданский кодекс РФ (главы 39, 40, 41, 46, 47, 48, 49)</p><p>Федеральный закон «О транспортно-экспедиционной деятельности» от 30.06.2003 № 87-ФЗ</p><p><em><strong>Морской транспорт</strong></em></p><p>Кодекс торгового мореплавания РФ от 30.04.1999 № 81-ФЗ</p><p>Общие правила морской перевозки грузов, пассажиров и багажа (утв. приказом Министерства морского флота СССР от 20.06.1972 № 107)</p><p>Правила перевозки пассажиров, ручной клади и багажа и предоставления услуг на судах и в портах Министерства морского флота СССР (утв. приказом Министерства морского флота СССР № РД 31.16.02-87)</p><p>Правила перевозки контейнеров морским транспортом (утв. приказом Министерства морского флота СССР от 01.02.1982 № РД 31.10.23-89)</p><p><em><strong>Воздушный транспорт</strong></em></p><p>Воздушный кодекс РФ от 19.03.1997 № 60-ФЗ</p><p>Федеральные авиационные правила «Общие правила воздушных перевозок пассажиров, багажа, грузов и требования к обслуживанию пассажиров, грузоотправителей, грузополучателей» (утв. приказом Минтранса России от 28.06.2007 № 82)</p><p><em><strong>Внутренний водный транспорт</strong></em></p><p>Кодекс внутреннего водного транспорта РФ от 07.03.2001 № 24-ФЗ</p><p>Правила перевозок грузов и буксировки плотов и судов речным транспортом (утв. Департаментом речного транспорта Минтранса России от 01.01.1994)</p><p>Правила оказания услуг по перевозке пассажиров, багажа, грузов для личных (бытовых) нужд на внутреннем водном транспорте (утв. постановлением Правительства РФ от 06.02.2003 № 72)</p><p><em><strong>Железнодорожный транспорт</strong></em></p><p>Федеральный закон «О железнодорожном транспорте в Российской Федерации» от 10.01.2003 № 17-ФЗ</p><p>Устав железнодорожного транспорта РФ от 10.01.2003 № 18-ФЗ</p><p>Правила перевозок грузов железнодорожным транспортом</p><p>Правила оказания услуг по перевозкам на железнодорожном транспорте пассажиров, а также грузов, багажа и грузобагажа для личных, семейных, домашних и иных нужд, не связанных с осуществлением предпринимательской деятельности (утв. постановлением Правительства РФ от 02.03.2005 № 111)</p><p><em><strong>Автомобильный и городской наземный электрический транспорт</strong></em></p><p>Федеральный закон «О безопасности дорожного движения» от 10.12.1995 № 196-ФЗ</p><p>Устав автомобильного транспорта и городского наземного электрического транспорта от 08.11.2007 № 259-ФЗ</p><p>Общие правила перевозок грузов автомобильным транспортом (утв. Минавтотрансом РСФСР 30.07.1971)</p><p>Правила перевозок пассажиров и багажа автомобильным и городским наземным электрическим транспортом (утв. постановлением Правительства РФ от 14.02.2009 № 112)</p>"}, {"number": 14, "title": "Этапы жизненного цикла экспортного проекта", "content": "<p><em><strong>Этапы жизненного цикла экспортного проекта:</strong></em></p><p>1. Выбор рынка и поиск покупателей;</p><p>2. Подготовка товара к требованиям рынка и покупателя;</p><p>3.Переговоры с покупателем и заключение внешнеторгового контракта;</p><p>4. Подготовка и производство товара на экспорт;</p><p>5. Таможенное оформление товара при экспорте;</p><p>6. Организация логистики;</p><p>7. Организация финансовых расчетов.</p><p>На каждом из этапов целесообразно оценить потенциальные возможности организации, а также узнать на какую поддержку со стороны государства можно рассчитывать.</p>"}, {"number": 15, "title": "ВЫБОР РЫНКА И ПОИСК ПОКУПАТЕЛЕЙ", "content": "<p><em><strong>На 1 этапе</strong></em>, как правило, проводятся маркетинговые исследования, позволяющие определить наиболее привлекательный рынок и найти потенциального покупателя.</p><p><em><strong>Выделяют 2 вида маркетинговых исследований:</strong></em></p><p>1. <em>Полевое исследование</em> (сбор первичной информации о рынке и покупателях. Данное исследование реализуется в реальных рыночных условиях путем наблюдений, обследований, опросов групп, проводимых специально для решения конкретной задачи).</p><p><em><strong>Основные задачи полевого исследования:</strong></em></p><p>- сбор информации о текущих условиях продажи конкретного товара на иностранном рынке и его перспективах;</p><p>- сбор информации о конкурентах, в том числе ассортиментной и ценовой политики;</p><p>- сбор информации о реакции покупателей на предлагаемые товары или услуги;</p><p>- сбор информации об отношении покупателей к конкретной производителям и предпочтениях покупателей;</p><p>- сбор информации о возможных каналах сбыта продукции.</p><p><em><strong>Преимущества полевого исследования –</strong></em> позволяют получить более точную информацию, как правило привлекаются специалисты конкретной области.</p><p><em><strong>Недостатки полевого исследования –</strong></em> значительные финансовые затраты; требует много времени.</p><p><em>2. </em><em>Кабинетн</em><em>ые исследования</em> (сбор вторичной информации из открытых источников. Данное исследование реализуется через сбор информации о рынке и покупателе на основе статистических справочников, отчетов организации, экономических изданий и др.)</p><p><em><strong>Задачи кабинетно</strong></em><em><strong>го исследования:</strong></em></p><p>- сбор информации и емкости потенциального рынка;</p><p>- определение основных тенденций и перспектив развития определенной ниши на конкретном рынке;</p><p>- проведение конкурентного и ценового анализа, выявление особенностей конкретного рынка.</p><p><em><strong>Преимущества комбинированного исследования –</strong></em> более бюджетное исследование; задействовано значительное количество источников информации, что делает ее более достоверной; возможность провести исследование собственными силами.</p><p><em><strong>Недостатки комбинированного исследования</strong></em><em><strong> –</strong></em> возможное искажение информации; не представляет полной картины о состоянии рынка.</p>"}, {"number": 16, "title": "Подготовка товара к требованиям рынка и покупателя", "content": "<p>-Документы на вывоз товара из РФ с таможенной территории ЕАЭС.</p><p>-Документы, необходимые при ввозе в страну экспорта.</p><p><strong>Документы, необходимые при ввозе в страну экспорта</strong> – CE Mark.</p><p><em><strong>Виды продукции:</strong></em> мед оборудование, детские игрушки, строительные изделия и материалы, машины и оборудование, измерительные приборы и др.</p><p><strong>Защита интеллектуальной собственности на внешних рынках:</strong></p><p>Интеллектуальная собственность – закрепленное законом временное исключительное право, а также личные неимущественные права авторов на результат интеллектуальной деятельности или средств индивидуализации.</p><p><em><strong>Результаты интеллектуальной деятельности</strong></em> – патент, ноу-хау, объект авторского права;</p><p>- Средства индивидуализации – товарный знак, фирменное наименование компании.</p><p><em><strong>Конкуренты на внешнем рынке могут незаконно использовать товарный знак и иные объекты ИС:</strong></em></p><p>- может повлиять на деловую репутацию компании на местном рынке;</p><p>- может быть нанесен ущерб маркетинговым и рекламным усилиям компании.</p><p><em><strong>Защита ИС:</strong></em></p><p>ТМ</p><p>1) защита торгового знака за рубежом;</p><p>2) международная регистрация товарного знака;</p><p>3) национальная регистрация товарного знака в отдельных странах.</p><p><em><strong>Защита ИС: преимущества российского обладателя международного товарного знака:</strong></em></p><p>- отсутствует риск запрета использования предприятием собственного товарного знака на территории государства, где пройдена регистрация;</p><p>- возможность защитить свои интересы и получить компенсацию за незаконное использование товарного знака;</p><p>- возможность получать доп. прибыль за счет передачи прав на использование товарного знака по лицензионным договорам и договорам франшизы.</p><p><em><strong>Документы на вывоз товара из РФ с таможенной территории ЕАЭС:</strong></em></p><p>- Сертификат происхождения товара— экспортер получает в России и представляет в таможню страны импорта для расчета ставки таможенной пошлины (выдается сертификат ТПП РФ).</p><p>- Документы, подтверждающие соблюдение запретов и ограничений на вывоз товаров (ветеринарные, радиационные, экологические и другие сертификаты, подтверждающие соответствие технологическим нормам).</p><p><em><strong> Для товаров двойного назначения:</strong></em></p><p>1. Разрешение или лицензия Федеральной службы по техническому и экспортному контролю Российской Федерации;</p><p>2. Фитосанитарные сертификаты для продукции растительного происхождения с целью подтверждения соответствия товара требованиям карантинного контроля и соответствие гигиеническим нормам, выдаются россельхознадзором РФ;</p><p>3. Специальные разрешительные документы на экспорт (например, металлолом требует оформления радиационного сертификата в Роспотребнадзоре).</p>"}, {"number": 17, "title": "Переговоры с покупателем и заключение внешнеторгового контракта", "content": "<p><em><strong>Этапы подготовки к международным переговорам:</strong></em></p><p>1) Постановка задачи;</p><p>2) Сбор информации;</p><p>3) Анализ позиции партнера;</p><p>4) Выбор стратегии и тактики, определение концепции переговоров;</p><p>5) Решение организационных вопросов.</p><p><em><strong>Подготовка к международным переговорам:</strong></em></p><p>-Где проводить? Страна экспортера, страна импортера, нейтральная сторона.</p><p>- Когда и как проводить? Время проведения, формат проведения, продолжительность переговоров.</p><p><em><strong>План международных переговоров (культура, религия, язык, привычки):</strong></em></p><p>1) Начало переговоров, обмен мнениями, первые предложения;</p><p>2) Дебаты (обсуждение);</p><p>3) Зона конкретных предложений;</p><p>4) Принятие решений;</p><p>5) Завершение переговоров.</p><p><em><strong>Меморандум (соглашение) о намерениях сторон. Цель:</strong></em></p><p>- Быстро и эффективно согласовать основные условия договора;</p><p>- Закрепить на бумаге промежуточные результаты переговоров;</p><p>- Заранее понять позиции сторон;</p><p>- Помочь юридическим консультантам в подготовке основного контракта.</p><p><em><strong>Внешнеторговый контракт:</strong></em></p><p>- Является базой для составления обеспечивающих договоров (перевозка, хранение, страхование и т.п.);</p><p>- Юридическая основа экспортного проекта;</p><p>- Подтверждает контролирующим органам намерение осуществить поставку на экспорт;</p><p>- Подтверждает соответствие требованиям национальных и международных правовых норм.</p><p><em><strong> </strong></em><em><strong>Этапы заключения внешнеторгового контракта:</strong></em></p><p>1) Составление и принятие текста контракта;</p><p>2) Установление аутентичности текстов контракта на языках контрагентов;</p><p>3) Выражение согласия на обязательность контракта;</p><p>4) Подписание контракта;</p><p>5) Исполнение контракта</p><p><em><strong>Основные принципы, регулируемые в терминах </strong></em><em><strong>инкотермс</strong></em> (международные правила в формате словаря, обеспечивающие однозначные толкования наиболее широко используемых торговых терминов в области ВЭД, прежде всего относительно места перехода ответственности от продавца к покупателю):</p><p>-Распределение между продавцом (экспортером) и покупателем обязанностей и расходов, связанных с поставкой товара;</p><p>- Момент перехода с продавца на покупателя рисков повреждения, утраты или случайной гибели груза.</p><p>ВАЖНО: Инкотермс не регламентирует переход права собственности на товар!</p><p><em><strong>Существенные условия внешнеторгового контракта:</strong></em></p><p>1 .Преамбула внешнеторгового контракта</p><p>2. Полное и точное наименование сторон контракта</p><p>3.Предмет внешнеторгового контракта</p><p>4 .Приемка товара:</p><p>5. Полномочия лиц подписывающих контракт</p><p>6. Порядок расчетов: цена и валютная оговорка</p><p>7 .Арбитражная оговорка</p><p>8 .Упаковка и маркировка товара</p><p>9 .Ответственность сторон</p><p>10 Приложения</p>"}, {"number": 18, "title": "Подготовка и производство товара на экспорт", "content": "<p><em><strong>1. Оценка кадрового ресурса и потенциала</strong></em> (Владение иностранными языками; Владение инструментами международного маркетинга (особенности ин. Покупателей);  Умение ведения деловых переговоров с ин. партнерами; Знание правовых аспектов ведения экспортной деятельности; Недостаточно только оценить наличие необходимых компетенций, нужны сотрудники, готовые начать новый для них вид деятельности).</p><p><em><strong>Специалисты, необходимые для ВЭД:</strong></em></p><p><em>- специалист по продажам</em> (исследование рынка, продвижение продукта, ведение международных переговоров);</p><p><em>- юрист 1 - международник</em> (подготовка и заключение внешнеторгового контракта, получение сертификатов соответствия, лицензий, разрешений, разрешение международных споров);</p><p><em>- бухгалтер/финансист</em> (подготовка отчетной документации, привлечение внешних финансовых источников, оценка финансовых рисков);</p><p><em>-специалист по производству</em> (планирует, оценивает и при необходимости вносит изменения в продукт, адаптирует товара с учетом новых требований и условий).</p><p><em><strong>Поиск специалистов:</strong></em></p><p>1. Специалист, обладающий необходимыми компетенциями внутри компании;</p><p>2. новый специалист;</p><p>3. Повышение компетенций внутренних специалистов.</p><p><em><strong>2. О</strong></em><em><strong>ц</strong></em><em><strong>енка производственных мощностей</strong></em> (Потенциальные возможности текущего производства обеспечить: доп. объем производства и складирования; срок производства; качество производства; повышение производительности).</p><p><em><strong>3. Оценка д</strong></em><em><strong>остаточности сырья и материалов</strong></em> (Наличие сырья и комплектующих для производства готовых изделий; соответствие товара и упаковки международным стандартам; соответствие техническим требованиям ин. покупателя; технологическая возможность адаптировать продукт; проработаны ли вопросы логистики).</p><p><em><strong>4.</strong></em><em><strong> Оценка финансовых ресурсов </strong></em>(Командировочные расходы; расходы на проведение маркетинговых исследований; расходы на адаптацию товара; расходы на модернизацию производства; возможность покупки оборудования).</p>"}, {"number": 19, "title": "Организация логистики", "content": "<p><em><strong>Логистика ВЭД</strong></em> — это управление цепочками поставок в международной торговле, включающее планирование, транспортировку, таможенное оформление и контроль. Ее эффективность напрямую влияет на стоимость, сроки и надежность экспортно-импортных операций. Рассмотрим ключевые этапы и особенности.</p><p>Планирование логистики ВЭД</p><p><em><strong>Этапы:</strong></em></p><p>- Анализ рынка: выбор стран-партнеров, изучение требований к товарам (сертификация, упаковка).</p><p>- Выбор условий поставки (INCOTERMS-2020): определение ответственности сторон (например, FOB — - продавец оплачивает доставку до порта, CIF — включает страховку и фрахт).</p><p>- Расчет сроков и бюджета: учет времени на производство, транспортировку, таможню.</p>"}, {"number": 20, "title": "Организация финансовых расчетов", "content": "<p><em><strong>Организация финансовых расчетов при ВЭД –</strong></em> это комплекс мероприятий, направленных на эффективное управление денежными потоками, возникающими в процессе внешнеэкономической деятельности. Она включает выбор банковских инструментов, учет и контроль валютных операций, а также соблюдение требований валютного законодательства.</p><p><em><strong>Основные аспекты организации финансовых расчетов при ВЭД: </strong></em></p><p>1<em>. </em><em>Выбор банка и открытие валютных счетов</em> (для проведения расчетов в валюте необходимо открыть валютные счета в банке, оказывающем услуги ВЭД. Банки предоставляют различные услуги, такие как открытие и ведение валютных счетов, осуществление валютных операций, расчетно-кассовое обслуживание, и другие);</p><p><em>2. Определение формы расчетов</em> (Внешнеторговые контракты могут предусматривать различные формы расчетов, например, банковский перевод, кредитные линии, аккредитивы, и так далее);</p><p><em>3. Осуществление валютных операций</em> (Включает в себя покупку и продажу иностранной валюты, перевод средств, а также операции по валютному контролю.);</p><p><em>4. Учет и контроль валютных операций</em> (Важно вести учет всех валютных операций и соблюдать требования валютного законодательства);</p><p><em>5. Организация налогообложения</em> (Учет и уплата налогов при ВЭД, включая НДС и налоги на прибыль);</p><p><em>6. Аутсорсинг и сопровождение ВЭД</em> (В некоторых случаях организации могут привлекать специализированные компании для оказания услуг по сопровождению ВЭД, включая бухгалтерский учет, таможенное оформление, и прочие услуги).</p>"}, {"number": 21, "title": "ESG-факторы во ВЭД", "content": "<p><strong>ESG факторы являются</strong> инструментом оценки эффективности и достижения цели устойчивого развития. Применительно к компаниям, <strong>устойчивое развитие</strong> — это стратегическое видение, и цели ответственного развития бизнеса в отношении охраны окружающей среды, сотрудников. поставщиков и покупателей, а также других участников хозяйственных процессов.  ESG это:</p><p>- окружающая среда (Е)</p><p>- общество (S)</p><p>- управление (G)</p><p>Кроме того, это факторы, которые реализуются через инструменты корпоративного управления. В финансовом аспекте факторы учитываются при финансировании проекта и управления активами на предмет на предмет ESG рисков.</p><p><strong>В широком смысле ESG </strong>определяется как изучение экологических, социальных и управленческих практик компаний в сравнении с установленными показателями. То есть ESG – это количественные показатели эффективности, соответствующие определенным критериям.</p><p>Учет ESG факторов помогает принимать решения о рисках и прозрачности конкретных компаний. Позиция компаний и ее работа по отдельным ESG направлениям помогает потребителям решить, какие компании поддерживать, поскольку дает представления о том, соответствует ли практика ведения бизнеса и действия компании их собственным ценностям.</p><p>ESG инициативы зачастую реализуются в рамках корпоративной стратегии в области устойчивого развития и направлены на удовлетворение требований инвесторов и регулирующих органов.</p><p>К числу основных <strong>нормативных документов</strong> в РФ с ESG повесткой относят:</p><p>1. в стратегии экологической безопасности РФ</p><p>2. закон об ограничении выброса парниковых газов</p><p>3. энергетическая стратегия в РФ</p><p>4. стратегия социально-экономического развития РФ</p><p>5. развития трудового кодекса РФ в части обязанности работодателя в области охраны труда</p><p><strong>Н</strong><strong>ормативные документы</strong> в области <strong>корпоративного управления</strong>:</p><p>- дорожная карта правительства РФ по совершенствованию корпоративного управления</p><p>- рекомендации ЦБ РФ по раскрытию нефинансовой информации и учету ESG факторов</p><p>- вопросы устойчивого развития и борьбы с изменением климата, попадающие под внимание органов исполнительной власти и финансовых регуляторов разных стран</p><p>Отчет организации об устойчивом развитии содержит основной перечень нефинансовой информации, которую может включать следующие аспекты:</p><p>1) совокупность сведений и показателей, отражающих цели компании, стратегию, а также подходы к управлению</p><p>2) систему управления рисками</p><p>3) связь стратегии организации с национальными стратегическими целями по ESG аспектам</p><p>4) результаты деятельности в части влияния организации на окружающую среду, общество и экономику</p><p>(Как ESG-факторы влияют на внешнеэкономическую деятельность:</p><p><em><strong>Экологические факторы:</strong></em><em><strong> </strong></em>Влияние компании на климат, использование природных ресурсов, выбросы вредных веществ и управление отходами.</p><p><em><strong>Социальные факторы:</strong></em><em><strong> </strong></em>Права работников, условия труда, отношения с клиентами и обществом, а также соблюдение прав человека.</p><p><em><strong>Факторы корпоративного управления:</strong></em><em><strong> </strong></em>Прозрачность, этичность, борьба с коррупцией и соблюдение прав акционеров.)</p>"}, {"number": 22, "title": "Правовое обеспечение экспортного проекта", "content": "<p><em><strong>Правовое обеспечение экспортного проекта</strong></em> подразумевает соблюдение всех нормативных актов и регуляций, связанных с экспортом товаров, работ, услуг или прав на результаты интеллектуальной деятельности за пределы Российской Федерации, а также за пределы других государств, в которых реализуется проект. Это включает в себя разработку и заключение экспортного контракта, соблюдение таможенных процедур, получение необходимых лицензий и разрешений, а также урегулирование возможных споров и рисков.</p><p><em><strong>Основные нормативные акты</strong></em></p><p><strong>Федеральный закон от 08.12.2003 №164-ФЗ «Об основах государственного регулирования внешнеторговой деятельности»</strong><strong>. </strong>Определяет основы госрегулирования ВЭД, полномочия органов власти, методы регулирования (таможенно-тарифное, нетарифное, запреты и ограничения). В статье 24 закреплено лицензирование в сфере внешней торговли товарами в определённых случаях (временные количественные ограничения, разрешительный порядок экспорта/импорта и др.).</p><p><strong>Федеральный закон от 18.07.1999 №183-ФЗ «Об экспортном контроле»</strong><strong>. </strong>Устанавливает принципы государственной политики в области экспортного контроля, правовые основы деятельности органов власти, права, обязанности и ответственность участников ВЭД. Регулирует лицензирование внешнеэкономических операций с контролируемыми товарами и технологиями.</p><p><strong>Федеральный закон от 10.12.2003 №173-ФЗ «О валютном регулировании и валютном контроле»</strong><strong>. </strong>Определяет принципы осуществления валютных операций, полномочия органов валютного регулирования и контроля, права и обязанности лиц в отношении валютных ценностей, ответственность за нарушения.</p><p><strong>Таможенный кодекс Евразийского экономического союза (ТК ЕАЭС)</strong><strong>. </strong>Регулирует таможенные процедуры, режимы, оформление, платежи и контроль при перемещении товаров через границу ЕАЭС.</p><p><strong>Налоговый кодекс РФ</strong><strong>. </strong>Регулирует вопросы налогообложения, включая порядок возмещения экспортного НДС (ст. 165, п. 3 ст. 172 НК РФ).<strong> </strong></p><p><strong>Кодекс РФ об административных правонарушениях (КоАП РФ)</strong><strong>. </strong>Устанавливает административную ответственность за нарушения в сфере валютного законодательства (ст. 15.25) и таможенных правил (глава 16).</p>"}, {"number": 23, "title": "Экспортный контроль", "content": "<p><em><strong>Экспортный контроль –</strong></em> это система регулирования внешнеэкономической деятельности, направленная на обеспечение безопасности государства, его политических и экономических интересов, а также на соблюдение международных обязательств.</p><p>Он затрагивает вывоз и импорт товаров, технологий, информации, работ и услуг, которые могут быть использованы в военных целях или для подготовки террористических актов.</p><p>Цели экспортного контроля:</p><p>– защита интересов Российской Федерации;</p><p>– реализация требований международных договоров Российской Федерации в области нераспространения оружия массового поражения, средств его доставки, а также в области контроля за экспортом продукции военного и двойного назначения;</p><p>– создание условий для интеграции экономики Российской Федерации в мировую экономику.</p><p>Экспортный контроль осуществляет специально уполномоченный федеральный орган исполнительной власти – <strong>Минэкономразвития России</strong>.</p><p>Осуществляется посредством методов правового регулирования внешнеэкономической деятельности:</p><p>1) идентификацию контролируемых товаров и технологий, то есть установление соответствия конкретных сырья, материалов, оборудования, научно-технической информации, работ, услуг, результатов интеллектуальной деятельности, являющихся объектами внешнеэкономических операций, товарам и технологиям, включенным в списки (перечни) контролируемых товаров и технологий;</p><p>2) разрешительный порядок осуществления внешнеэкономических операций с контролируемыми товарами и технологиями, предусматривающий лицензирование или иную форму их государственного регулирования;</p><p>3) таможенный контроль и таможенное оформление вывоза из Российской Федерации контролируемых товаров и технологий в соответствии с законодательством Российской Федерации о таможенном деле;</p><p>4) применение мер государственного принуждения (санкций) в отношении лиц, нарушивших установленный нормативными правовыми актами Российской Федерации порядок осуществления внешнеэкономической деятельности.</p><p>Внешнеэкономические операции, предусматривающие передачу контролируемых товаров и технологий иностранному лицу, подлежат лицензированию. Указами Президента РФ утверждаются списки товаров и технологий, таможенное оформление которых производится только при условии представления лицензий, выдаваемых Минэкономразвития России.</p>"}];

        function escapeRegex(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        function highlightNode(node, query) {
            if (node.nodeType === Node.TEXT_NODE) {
                const regex = new RegExp(`(${escapeRegex(query)})`, "gi");
                const parts = node.textContent.split(regex);
                if (parts.length === 1) return;
                const fragment = document.createDocumentFragment();
                parts.forEach((part, index) => {
                    if (!part) return;
                    if (index % 2 === 0) {
                        fragment.appendChild(document.createTextNode(part));
                    } else {
                        const span = document.createElement("span");
                        span.className = "highlight";
                        span.textContent = part;
                        fragment.appendChild(span);
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                Array.from(node.childNodes).forEach(child => highlightNode(child, query));
            }
        }

        function highlightHtml(value, query) {
            if (!query) return value;
            const wrapper = document.createElement("div");
            wrapper.innerHTML = value;
            highlightNode(wrapper, query);
            return wrapper.innerHTML;
        }

        function renderItems(items, query) {
            const container = document.getElementById("itemContainer");
            const noResults = document.getElementById("noResults");
            container.innerHTML = "";
            noResults.classList.toggle("hidden", items.length > 0);

            items.forEach(item => {
                const element = document.createElement("div");
                element.className = "item";
                if (query && item.searchText.includes(query)) element.classList.add("expanded");
                element.innerHTML = `
                    <div class="item-header">Вопрос ${item.number}</div>
                    <div class="item-title">${highlightHtml(item.title, query)}</div>
                    <div class="item-content">${highlightHtml(item.content, query)}</div>
                `;
                element.onclick = function () {
                    this.classList.toggle("expanded");
                };
                container.appendChild(element);
            });
        }

        function searchItems() {
            const query = document.getElementById("searchBox").value.trim().toLowerCase();
            const items = query
                ? questions.filter(item => item.number.toString().includes(query) || item.searchText.includes(query))
                : questions;
            renderItems(items, query);
        }

        questions.forEach(item => {
            const wrapper = document.createElement("div");
            wrapper.innerHTML = item.content;
            item.searchText = `${item.title} ${wrapper.textContent}`.toLowerCase();
        });
        renderItems(questions, "");
    </script>
</body>
