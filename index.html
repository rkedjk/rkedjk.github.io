<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Зачет по БФО</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --bg: #000;
            --panel: #101114;
            --panel-active: #1b1d22;
            --line: #292c33;
            --muted: #a6abb6;
            --accent: #9ac7ff;
            --font-scale: 1;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            padding: 12px;
            background: var(--bg);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            font-size: calc(14px * var(--font-scale));
            line-height: 1.45;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding-bottom: 10px;
            background: linear-gradient(#000 82%, transparent);
        }

        h1 {
            padding: 4px 2px 10px;
            font-size: calc(17px * var(--font-scale));
            line-height: 1.25;
        }

        .compact-title {
            display: none;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 1px solid var(--line);
            color: #fff;
            background: var(--panel);
            cursor: pointer;
            touch-action: manipulation;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .toolbar,
        .reader-toolbar,
        .reader-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-button,
        .nav-button {
            min-width: 44px;
            min-height: 44px;
            padding: 8px 11px;
            border-radius: 22px;
            font-weight: 700;
        }

        .search-panel {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .font-panel {
            margin-top: 8px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--panel);
        }

        .font-controls {
            display: flex;
            gap: 7px;
            align-items: center;
            justify-content: center;
        }

        .scale-value {
            min-width: 58px;
            color: var(--accent);
            text-align: center;
            font-size: calc(14px * var(--font-scale));
            font-weight: 700;
        }

        .reset-button {
            min-height: 44px;
            padding: 7px 11px;
            border-radius: 22px;
            color: var(--muted);
            font-size: calc(12px * var(--font-scale));
            font-weight: 700;
        }

        .font-preview {
            margin-top: 9px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #090a0c;
        }

        .font-preview-label {
            color: var(--accent);
            font-size: calc(12px * var(--font-scale));
            font-weight: 700;
        }

        .font-preview-title {
            margin-top: 3px;
            font-size: calc(14px * var(--font-scale));
            font-weight: 700;
        }

        .font-preview-text {
            margin-top: 5px;
            color: var(--muted);
            font-size: calc(13px * var(--font-scale));
            line-height: 1.35;
        }

        .search-box {
            min-width: 0;
            width: 100%;
            min-height: 44px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--panel);
            color: #fff;
            font-size: calc(14px * var(--font-scale));
        }

        .result-count {
            padding: 0 4px 7px;
            color: var(--muted);
            font-size: calc(12px * var(--font-scale));
        }

        .item-list {
            padding-bottom: 16px;
        }

        .item {
            display: block;
            width: 100%;
            margin-bottom: 8px;
            padding: 13px 14px;
            border-radius: 18px;
            text-align: left;
            transition: background 160ms ease, border-color 160ms ease, opacity 160ms ease, transform 160ms ease;
        }

        .item:active {
            background: var(--panel-active);
        }

        .item-header {
            margin-bottom: 4px;
            color: var(--accent);
            font-size: calc(12px * var(--font-scale));
            font-weight: 600;
        }

        .item-title {
            font-size: calc(14px * var(--font-scale));
            font-weight: 600;
            line-height: 1.25;
        }

        .reader {
            max-width: 760px;
            margin: 0 auto;
        }

        .reader-toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 8px 0 12px;
            background: linear-gradient(#000 84%, transparent);
        }

        .reader-heading {
            min-width: 0;
            flex: 1;
        }

        .reader-number {
            color: var(--accent);
            font-size: calc(12px * var(--font-scale));
            font-weight: 700;
        }

        .reader-title {
            overflow: hidden;
            margin-top: 2px;
            font-size: calc(15px * var(--font-scale));
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .progress-track {
            position: sticky;
            top: 62px;
            z-index: 99;
            height: 3px;
            margin-bottom: 10px;
            border-radius: 3px;
            background: #20232a;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: var(--accent);
        }

        .reader-content {
            font-size: calc(15px * var(--font-scale));
            line-height: 1.58;
        }

        .reader-content p {
            margin: 10px 0;
        }

        .reader-nav {
            position: fixed;
            left: 50%;
            bottom: 12px;
            z-index: 110;
            justify-content: center;
            padding: 5px;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: rgba(16, 17, 20, 0.96);
            box-shadow: 0 4px 16px #000;
            transform: translateX(-50%);
        }

        .nav-button {
            min-width: 44px;
            color: var(--accent);
            white-space: nowrap;
        }

        .nav-button:disabled {
            visibility: hidden;
        }

        .reader-content {
            padding-bottom: 76px;
        }

        .table-scroll {
            position: relative;
            margin: 10px 0;
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: inset -18px 0 14px -14px var(--accent);
            -webkit-overflow-scrolling: touch;
        }

        .table-hint {
            display: none;
            margin: 4px 0;
            color: var(--accent);
            font-size: calc(11px * var(--font-scale));
        }

        table {
            width: 100%;
            min-width: 420px;
            border-collapse: collapse;
        }

        td {
            padding: 4px 6px;
            border: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        td p {
            margin: 0;
        }

        tr:first-child td {
            background: var(--panel-active);
            font-weight: 600;
        }

        .highlight {
            padding: 1px 2px;
            border-radius: 2px;
            background: #ffd600;
            color: #000;
            font-weight: 600;
        }

        .no-results {
            padding: 20px;
            text-align: center;
            font-size: calc(13px * var(--font-scale));
            opacity: 0.6;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) and (max-height: 480px) {
            body {
                padding: 7vh 4vw 9vh;
            }

            .header {
                margin: -4vh 0 0;
                padding: 0 0 8px;
            }

            .toolbar {
                justify-content: center;
            }

            h1 {
                padding: 0 3px 6px;
                font-size: calc(15px * var(--font-scale));
            }

            .full-title {
                display: none;
            }

            .compact-title {
                display: inline;
            }

            .item {
                min-height: 62px;
                margin-bottom: 7px;
                padding: 12px 14px;
                opacity: 0.82;
            }

            .item.watch-focus {
                border-color: #4b5d73;
                background: var(--panel-active);
                box-shadow: 0 0 0 1px rgba(154, 199, 255, 0.2);
                opacity: 1;
            }

            .item-header {
                font-size: calc(13px * var(--font-scale));
            }

            .item-title {
                font-size: calc(15px * var(--font-scale));
            }

            .reader {
                margin: -4vh 0 0;
            }

            .reader-toolbar {
                padding-top: 0;
            }

            .reader-content {
                padding: 0 1vw 78px;
                font-size: calc(16px * var(--font-scale));
                line-height: 1.58;
            }

            .reader-title {
                font-size: calc(14px * var(--font-scale));
            }

            .progress-track {
                top: 54px;
            }

            .table-hint {
                display: block;
            }

            table {
                min-width: 520px;
                font-size: calc(12px * var(--font-scale));
            }

            .icon-button,
            .nav-button {
                font-size: calc(14px * var(--font-scale));
            }

            .reader-nav {
                bottom: 5vh;
                gap: 5px;
            }

            .reader-nav .nav-button {
                min-width: 48px;
                min-height: 48px;
                padding: 7px 10px;
            }

            .reader-nav .list-button {
                min-width: 112px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .item {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main id="listScreen">
    <div class="header">
        <h1><span class="full-title">Бухгалтерский финансовый учет</span><span class="compact-title">БФО · 13 вопросов</span></h1>
        <div class="toolbar">
            <button class="icon-button" id="searchToggle" type="button" aria-expanded="false" aria-controls="searchPanel">Поиск</button>
            <button class="icon-button" id="fontToggle" type="button" aria-expanded="false" aria-controls="fontPanel" aria-label="Настроить размер текста">Aa</button>
        </div>
        <div class="search-panel hidden" id="searchPanel">
            <input type="search" class="search-box" id="searchBox" placeholder="Найти вопрос..." autocomplete="off">
            <button class="icon-button" id="searchClear" type="button" aria-label="Очистить поиск">×</button>
        </div>
        <div class="font-panel hidden" id="fontPanel">
            <div class="font-controls">
                <button class="icon-button" id="fontDecrease" type="button" aria-label="Уменьшить размер текста">−</button>
                <div class="scale-value" id="fontScaleValue" aria-live="polite">100%</div>
                <button class="icon-button" id="fontIncrease" type="button" aria-label="Увеличить размер текста">+</button>
                <button class="reset-button" id="fontReset" type="button" aria-label="Сбросить размер текста">100%</button>
            </div>
            <div class="font-preview">
                <div class="font-preview-label">Вопрос 1</div>
                <div class="font-preview-title">Внешнеэкономическая деятельность</div>
                <div class="font-preview-text">Пример текста ответа для проверки размера.</div>
            </div>
        </div>
    </div>

    <div class="result-count" id="resultCount"></div>
    <div class="item-list" id="itemContainer"></div>
    <div id="noResults" class="no-results hidden">Ничего не найдено</div>
    </main>

    <main class="reader hidden" id="readerScreen">
        <div class="reader-toolbar">
            <div class="reader-heading">
                <div class="reader-number" id="readerNumber"></div>
                <div class="reader-title" id="readerTitle"></div>
            </div>
        </div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        <article class="reader-content" id="readerContent"></article>
        <nav class="reader-nav" aria-label="Навигация между вопросами">
            <button class="nav-button" id="prevQuestion" type="button" aria-label="Предыдущий вопрос">←</button>
            <button class="nav-button list-button" id="readerBack" type="button">К списку</button>
            <button class="nav-button" id="nextQuestion" type="button" aria-label="Следующий вопрос">→</button>
        </nav>
    </main>

    <script>
        const questions = [
        {"number": 1, "title": "Бухгалтерская отчетность - информационное обеспечение финансового анализа.", "content": "<p>1.1 Бухгалтерская отчетность и возможности ее использования в финансовом анализе</p><p>Бухгалтерская отчетность — <em>единая система данных об имущественном и финансовом положении организации и о результате её хозяйственной деятельности, составляемая на основе данных бухгалтерского учета по установленным формам</em>.</p><p>Все организации обязаны составлять на основе данных синтетического и аналитического учета бухгалтерскую (финансовую) отчетность (промежуточную и годовую).</p><p>В состав годовой бухгалтерской отчетности коммерческой организации входят бухгалтерский баланс, отчет о финансовых результатах и приложения к ним.</p><p>Приложениями к бухгалтерской отчетности являются:</p><p>- отчет об изменениях капитала;</p><p>- отчет о движении денежных средств;</p><p>- пояснения в табличной и текстовой формах.</p><p>Для малых предприятий предусмотрены упрощенные формы бухгалтерского баланса и отчета о финансовых результатах. Эти формы отличаются от общепринятых (меньше строк).</p><p>Бухгалтерская отчетность в России представляет интерес для двух групп внешних и одной группы внутренних пользователей.</p><p>К первой группе внешних пользователей относятся:</p><p>а) государство, прежде всего в лице налоговых органов;</p><p>б) существующие и потенциальные кредиторы;</p><p>в) поставщики и покупатели;</p><p>г) существующие и потенциальные собственники средств организации.</p><p>Ко второй группе внешних пользователей бухгалтерской отчетности относятся:</p><p>-аудиторские службы;</p><p>-консультанты по финансовым вопросам,;</p><p>-биржи ценных бумаг;</p><p>-законодательные органы;</p><p>-юристы;</p><p>-государственные организации по статистике;</p><p>-профсоюзы.</p><p>К внутренним пользователям отчетности относятся:</p><p>- руководство организации;</p><p>- общее собрание участников;</p><p>- работники.</p><p>Для разных пользователей анализ бухгалтерской отчетности с точки зрения масштаба его проведения зависит от конкретно поставленной цели.</p><p>Анализ бухгалтерского баланса предполагает оценку активов организации, ее обязательств и собственного капитала.</p><p>Анализ отчета о финансовых результатах позволяет оценить объемы продаж, величины затрат, бухгалтерской прибыли и чистой прибыли организации.</p><p>Методика анализа бухгалтерской отчетности независимо от групп пользователей должна ориентироваться:</p><p>- на оценку качества формирования результативных показателей отчетности, в т. ч. финансового результата (прибыли или убытка);</p><p>-анализ финансового состояния;</p><p>-анализ финансовых результатов и деловой активности;</p><p>-анализ возможных перспектив развития организации.</p><p>В учебном пособии предлагается 3-уровневая система показателей оценки ресурсного потенциала:</p><p>1-й уровень - система обобщающих показателей;</p><p>2-й уровень - система частных показателей, предназначенных для выявления причинно-следственных связей;</p><p>3-й уровень - система частных показателей, предназначенных для выявления рисковых составляющих.</p><p>1.2 Требования цифровой экономики к формированию данных в бухгалтерской отчетности</p><p>Современные подходы к оценке состояния информационного обеспечения требуют разработки новых подходов и усовершенствования действующего инструментария.</p><p>Цифровая экономика - хозяйственная деятельность с использованием электронных средств в целях оптимизации производства, распределения, обмена, потребления и повышения уровня социально-экономического развития государств.</p><p>Значимость цифровой экономики - позволяет работать с огромным массивом информации, анализировать ее, делать выводы и принимать конкретные решения.</p><p>Для проверки качества формирования информационного обеспечения, прежде всего, следует обращать внимание на корректность представленной информации по отдельным статьям в бухгалтерской отчетности.</p><p>Типичные искажения в бух отчетности - погашение статей актива и пассива путем неправильного зачета требований; невключение отдельных объектов учета в состав имущества.</p><p>1.3 Основные приемы анализа бухгалтерской отчетности</p><p>Для анализа бухгалтерской отчетности используют общепринятые приемы:</p><p>-чтение отчетности,</p><p>-вертикальный анализ;</p><p>-горизонтальный анализ;</p><p>-трендовый анализ;</p><p>-анализ с помощью коэффициентов,</p><p>-сравнительный анализ;</p><p>-факторный анализ.</p><p>Чтение отчетности - информационное ознакомление с финансовым положением субъекта анализа по данным бухгалтерского баланса, отчета о финансовых результатах и приложений к ним.</p><p>Читая бухгалтерский баланс, можно отметить:</p><p>-размеры организации (уставный капитал);</p><p>-перечислить, чем представлены активы;</p><p>-отметить изменения нематериальных активов;</p><p>-рассмотреть состав оборотных средств;</p><p>-определить, что является основным источником финансирования активов организации.</p><p>На начальном этапе анализа бухгалтерской отчетности (чтении отчетности) аналитик может определить ликвидность баланса по существующим балансовым пропорциям:</p><p>- быстрореализуемые активы должны обеспечивать равенство с наиболее срочными обязательствами или превышать их (А1 ≥П1);</p><p>- среднереализуемые активы должны уравновешиваться с краткосрочными обязательствами или превышать их (А2 ≥ П2);</p><p>- медленнореализуемые активы должны быть уравновешены с величиной долгосрочных обязательств или превышать их (A3 ≥ П3);</p><p>- труднореализуемые активы должны финансироваться собственными источниками финансирования и не превышать их (A4 ≤ П4).</p><p>Вертикальный (структурный) анализ - это представление бухгалтерской отчетности в виде относительных величин, которые характеризуют структуру итоговых показателей.</p><p>При вертикальном анализе все статьи бухгалтерского баланса приводятся в процентах к его итогу. Вертикальный анализ бухгалтерского баланса позволяет рассматривать соотношение оборотных и внеоборотных активов организации, определять удельный вес собственного и заемного капитала в общей структуре.</p><p>При помощи горизонтального анализа можно изучить динамику изменения отдельных отчетных показателей во времени. На основании бухгалтерской отчетности можно проследить изменение балансовых статей, а также изменение показателей доходов и расходов за прошедший год, предыдущий и предшествующий предыдущему году, но без установления причин произошедших изменений.</p><p>Горизонтальный и вертикальный анализ дополняют друг друга и могут применяться одновременно.</p><p>Трендовый анализ позволяет провести расчет относительных отклонений какой-либо статьи отчетности за ряд лет от уровня базового года, для которого значения всех статей принимаются за 100%.</p><p>Построение трендов позволяет:</p><p>- определить среднюю прибыль за 5-10 лет, выравнивающую неустойчивые факторы, а также цикличность их воздействия;</p><p>-выявить минимальную прибыль в исследуемом периоде;</p><p>-дать важные характеристики в управлении организации.</p><p>Анализ бухгалтерской отчетности с помощью коэффициентов позволяет изучить взаимосвязи между различными элементами отчетности. В настоящее время этот метод является наиболее используемым в финансовом анализе. Получить финансовый коэффициент можно делением одной или нескольких статей отчетности на другую.</p><p>Использование финансовых коэффициентов позволяет руководству контролировать деятельность организации и вносить изменения в ее работу.</p><p>Сравнительный анализ основан на сопоставлении абсолютных и относительных показателей бухгалтерской отчетности с аналогичными показателями предшествующего года.</p><p>Внимание должно быть уделено тем статьям отчетности, которые значительно изменились в течение года.</p><p>Под факторным анализом понимается методика комплексного и системного изучения и измерения воздействия факторов на результативную величину показателей.</p><p>В общем случае можно выделить следующие этапы факторного анализа:</p><p>-отбор факторов;</p><p>-определение формы зависимости между факторами и результативными показателями;</p><p>-моделирование взаимосвязей между результативными и факторными показателями;</p><p>-расчет влияния факторов и оценка роли каждого из них в изменении величины результативного показателя;</p><p>-работа с факторной моделью (практические расчеты).</p><p>Важным в факторном анализе является определение зависимости между факторами и результативными показателями.</p><p>Два основных вида факторного анализа - детерминированный и стохастический.</p><p>Детерминированный факторный анализ представляет собой методику исследования влияния факторов, связь которых с результативным показателем носит функциональный характер.</p><p>Стохастический анализ представляет собой методику исследования факторов, связь которых с результативным показателем является неполной, вероятностной (корреляционной).</p><p>1.4 Экспресс-анализ бухгалтерской отчетности</p><p>Целью экспресс-анализа является наглядная и несложная оценка финансового-хозяйственной деятельности и динамики развития коммерческой организации, в основе которого лежит метод «чтение отчетности».</p><p>Он может быть выполнен в три этапа: подготовительный этап, предварительный обзор бухгалтерской (финансовой) отчетности, экономическое чтение и анализ бухгалтерского баланса и отчета о финансовых результатах и приложений к ним.</p><p>Цель первого этапа — <em>убедиться в том, что отчетность готова к анализу методом чтения</em>. Проводится визуальная и простейшая счетная проверка показателей форм отчетности по формальным признакам и по существу.</p><p>На втором этапе знакомятся с аудиторским заключением, учетной политикой организации, с содержательной частью годового отчета.</p><p>Третий этап - считается основным в экспресс-анализе. На данном этапе выполняются расчеты необходимых аналитических коэффициентов, логика отбора которых обосновывается целями и задачами выполнения экспресс-анализа.</p>"},
        {"number": 2, "title": "Содержание и концепция анализа формы «бухгалтерский баланс»", "content": "<p>2.1 Содержание формы «Бухгалтерский баланс»</p><p>Показатели в бухгалтерском балансе формируются на отчетную дату отчетного периода, отражается предыдущий год и год, предшествующий предыдущему.</p><p>Актив бухгалтерского баланса</p><p>Состав и содержание 1-го раздела бухгалтерского баланса - внеоборотные активы.</p><p>1 Нематериальные активы</p><p>По данной строке отражаются остатки по счету 04 «Нематериальные активы» и остатки по сч. 05 «Амортизация нематериальных активов». Имеются особенности признания объекта учета, отвечающего критериям нематериального актива. Они связаны с моментом появления у организации права на создаваемый или приобретаемый объект. До оформления акта приемки он продолжает оставаться в незавершенных вложениях во внеоборотные активы.</p><p>В бухгалтерском балансе нематериальные активы отражаются по остаточной стоимости (первоначальная стоимость - амортизация). Определение нормы амортизации каждого из способов связано со сроком полезного использования объектов нематериальных активов. Если срок установить нельзя, то амортизация начисляется в течение 20 лет.</p><p>2 Основные средства</p><p>Отражаются остатки по счетам 01 «Основные средства», 02 «Амортизация основных средств».</p><p>Основным критерием, которому должно отвечать имущество, включенное в состав основных средств - срок его полезного использования в качестве средств труда. Этот срок должен быть не менее года.</p><p>По статье «Основные средства» приводятся показатели по основным средствам, как действующим, так и находящимся на реконструкции, модернизации, восстановлении консервации или в запасе, по остаточной стоимости. Основным элементом, определяющим правильность формирования показателя по этой статье, является первоначальная стоимость и сумма начисленной амортизации.</p><p>3 «Инвестиционная недвижимость»</p><p>Инвестиционная недвижимость отражается в бухгалтерском учёте и отчётности как отдельная группа основных средств, предназначенная для получения дохода от предоставления за плату во временное пользование или от прироста её стоимости.</p><p>4 «Финансовые вложения»</p><p>Отражаются паи и акции, долговые ценные бумаги, займы, вклады, если срок обращения таких вложений составляет более 12 месяцев после отчетной даты.</p><p>Если срок составляет менее 12 месяцев, то финансовые вложения считаются краткосрочными и отражаются в разделе «Оборотные активы» как краткосрочные финансовые вложения.</p><p>5 Отложенные налоговые активы</p><p>По статье отражаются остатки по счету 09 «отложенные налоговые активы».</p><p>6 Прочие внеоборотные активы</p><p>Отражаются остатки по счетам:</p><p>04 «Нематериальные активы»;</p><p>07 «Оборудование к установке»;</p><p>08 «Вложения во внеоборотные активы»;</p><p>97 «Расходы будущих периодов».</p><p>Состав и содержание 2-го раздела бухгалтерского баланса – оборотные активы.</p><p>1 «Запасы»</p><p>Показываются остатки материально-производственных запасов, предназначенных для использования:</p><p>- при производстве продукции,</p><p>- выполнения работ,</p><p>- оказания услуг.</p><p>2 Долгосрочные активы к продаже</p><p>ДАП — <em>это внеоборотные активы (основные средства, нематериальные активы и т</em>.п., кроме финансовых вложений), использование которых прекращено в связи с решением о их продаже, и есть подтверждение, что возобновление использования не планируется.</p><p>3 «Налог на добавленную стоимость по приобретенным ценностям»</p><p>Отражается сумма налога на добавленную стоимость по приобретенным материально-производственным запасам, которые организации оплачивают контрагентам по договорам купли-продажи, подряда и т. д. до момента их списания в уменьшение задолженности бюджету по таким расчетам.</p><p>4 «Дебиторская задолженность»</p><p>Данные по счетам расчетов организации с другими организациями и гражданами в бухгалтерском балансе приводятся в развернутом виде по данным счетов аналитического учета.</p><p>5 «Финансовые вложения (за исключением денежных эквивалентов)»</p><p>Отражаются фактические затраты организации по инвестициям в ценные бумаги других организаций, государственные ценные бумаги и т. п., предоставленные другим организациям займы на срок до 12 месяцев.</p><p>6. Денежные средства и денежные эквиваленты</p><p>Эта строка показывает остатки на отчётную дату:</p><p>наличных денег в кассе (счёт 50);</p><p>средств на расчётных счетах в банках (счёт 51);</p><p>средств на валютных счетах (счёт 52, пересчитанных в рубли по курсу ЦБ на отчётную дату);</p><p>средств на специальных счетах (аккредитивы, чековые книжки, счёт 55);</p><p>средств в пути (счёте 57)</p><p>Пассив бухгалтерского баланса</p><p>Состав и содержание 3-го раздела бухгалтерского баланса «Капитал»</p><p>1 «Уставный капитал»</p><p>Показывается величина уставного капитала в соответствии с Уставом организации, зарегистрированного в установленном законодательством порядке.</p><p>2 «Собственные акции, выкупленные у акционеров»</p><p>Акционерные общества отражают стоимость собственных акций, выкупленных им у акционеров для их последующей перепродажи или аннулирования.</p><p>3 «Накопленная дооценка внеоборотных активов»</p><p>Отражается сумма переоценки внеоборотных активов.</p><p>4 «Добавочный капитал (без переоценки)»</p><p>Показывается сумма разницы между продажной и номинальной ценой акций, вырученной в процессе формирования уставного капитала акционерного общества.</p><p>5 «Резервный капитал»</p><p>Показываются отчисления от прибыли текущего года и прошлых лет на создание резервного капитала.</p><p>6 «Нераспределенная прибыль (непокрытый убыток)»</p><p>Показывается «свернутый» финансовый результат организации за все годы его деятельности, включая отчетный год.</p><p>Состав и содержание 4-го раздела бухгалтерского баланса «долгосрочные обязательства»</p><p>1 «Заемные средства»</p><p>Показываются непогашенные суммы полученных кредитов и займов, подлежащие погашению в соответствии с договорами более чем через 12 месяцев после отчетной даты. Отражаются остатки по счету 67 «Расчеты по долгосрочным кредитам и займам».</p><p>2 «Отложенные налоговые обязательства»</p><p>Отражаются отложенные налоговые обязательства, которые принимаются к бухгалтерскому учету в размере величины, определяемой, как произведение необлагаемых временных разниц, возникших в отчетном периоде, и ставки налога на прибыль, действующей на отчетную дату.</p><p>3 «Оценочные обязательства»</p><p>По данной статье должны быть отражены остатки на конец отчетного периода по долгосрочным (свыше 12 месяцев) оценочным обязательствам.</p><p>Оценочное обязательство - это обязательство с неопределенной величиной и (или) сроком исполнения.</p><p>4 «Прочие обязательства»</p><p>Отражаются другие долгосрочные обязательства, в том числе долгосрочные обязательства по лизингу, а также отсроченная на 12 и более месяцев кредиторская задолженность.</p><p>Состав и содержание 5-го раздела бухгалтерского баланса «Краткосрочные обязательства».</p><p>1 «Заемные средства»</p><p>Отражаются остатки по сч. бб «Расчеты по краткосрочным кредитам и займам».</p><p>2 «Кредиторская задолженность»</p><p>Отражаются суммы кредиторской задолженности, подлежащие погашению в течение 12 месяцев после отчетной даты.</p><p>3 «Оценочные обязательства»</p><p>Показываются остатки по краткосрочным оценочным обязательствам. К ним можно отнести резерв под отпуска.</p><p>4 «Прочие обязательства»</p><p>Показываются суммы краткосрочных обязательств, не нашедшие отражения по другим группам статей раздела «Краткосрочные обязательства».</p><p>2.2 Концепция анализа формы «бухгалтерский баланс»</p><p>2.2.1. Анализ бухгалтерского баланса при помощи аналитического баланса и относительных показателей</p><p>Анализ бухгалтерского баланса предполагает оценку активов предприятия и обязательств. Базовую структуру баланса можно представить простым уравнением:</p><p>Активы = Задолженность + Собственный капитал</p><p>Анализ бухгалтерского баланса заключается в оценке каждой статьи активов с точки зрения их ценности и ликвидности. В целом высокая ликвидность уменьшает риск неплатежеспособности, неспособности оплачивать счета по мере наступления сроков оплаты.</p><p>Исследовать структуру бухгалтерского баланса и финансовое состояние организации можно при помощи агрегированного аналитического баланса.</p><p>Активы группируются по степени ликвидности, и формируются в следующие группы:</p><p>А1 - наиболее ликвидные активы (денежные средства и денежные эквиваленты и ценные бумаги);</p><p>А2 - быстро реализуемые активы (дебиторская задолженность сроком погашения до 12 месяцев и прочие оборотные активы);</p><p>А3 - медленно реализуемые активы (запасы и НДС по приобретенным ценностям);</p><p>А4 - труднореализуемые активы (итог первого раздела «Внеоборотные активы» и долгосрочная дебиторская задолженность).</p><p>Пассивы бухгалтерского баланса группируются по степени срочности их оплаты:</p><p>П1 - наиболее срочные активы (краткосрочная кредиторская задолженность и задолженность перед учредителями);</p><p>П2- краткосрочные пассивы (итог раздела 5 бухгалтерского баланса «Краткосрочные обязательства», кроме статей, приведенных в П1);</p><p>П3 - долгосрочные пассивы (долгосрочные обязательства);</p><p>П4 - постоянные пассивы (итог 3 раздела бухгалтерского баланса).</p><p>2.2.2 Анализ ликвидности бухгалтерского баланса</p><p>На основе аналитического баланса можно дать оценку его ликвидности, сформировав в таблицу по группам активы и источники их финансирования.</p><p>Анализ ликвидности баланса заключается в сравнении средств по активу с обязательствами по пассиву. Баланс считается абсолютно ликвидным при выполнении следующих условий:</p><p>A1&gt;=П1</p><p>A2&gt;=П2</p><p>A3&gt;=П3</p><p>A4&lt;=П4</p><p>На основе аналитического баланса можно рассчитать следующие показатели, характеризующие ликвидность бухгалтерского баланса:</p><p>- текущую ликвидность ТЛ = (A1+A2) - (П1+П2);</p><p>- перспективную ликвидность ПЛ = А3-П3.</p><p>2.2.3 Анализ финансового состояния на основе аналитического баланса</p><p>На основе аналитического баланса можно дать оценку финансового состояния организации, при этом ответив на вопросы:</p><p>-насколько организация независима от внешних источников финансирования;</p><p>- растет или снижается уровень этой независимости;</p><p>- способно ли состояние ее активов и пассивов отвечать по своим обязательствам в условиях нестабильности;</p><p>-способна ли организация инвестировать собственные средства в инвестиционные проекты и др.</p><p>Показатели, характеризующие финансовое состояние: коэффициент абсолютной, срочной, текущей ликвидности, чистые оборотные активы, собственный оборотный капитал.</p><p>2.3 Концептуальные особенности анализа результативных показателей бухгалтерского баланса</p><p>1 Анализ динамики валюты баланса</p><p>В ходе анализа сопоставляются данные по валюте баланса на начало и конец отчетного периода. Выявляется тенденция изменения. Определяется характер изменения: уменьшение либо увеличение.</p><p>Уменьшение - сокращение организацией хозяйственного оборота, что может повлечь ее неплатежеспособность.</p><p>Увеличение - сопровождается влиянием переоценки основных фондов, когда увеличение их стоимости не связано с развитием производственной деятельности, либо данное увеличение является следствием инфляции.</p><p>2 Анализ структуры активов бухгалтерского баланса</p><p>Структура активов имеет свойство изменяться, поэтому важно выяснить причины изменений.</p><p>Важно провести детальный анализ разделов и отдельных статей актива бухгалтерского баланса, чтобы сделать выводы о причинах изменения.</p><p>а) анализ основных средств и прочих необоротных активов</p><p>Здесь очень важно учесть тот факт, что удельный вес основных средств в структуре внеоборотных активов может изменяться вследствие воздействия внешних факторов.</p><p>б) анализ структуры оборотных средств</p><p>Рост оборотных средств может свидетельствовать не только о расширении производства или действии фактора инфляции, но и о замедлении их оборота.</p><p>Для определения тенденций оборачиваемости оборотных средств рекомендуется рассчитать коэффициент оборачиваемости.</p><p>3. Анализ структуры пассива бухгалтерского баланса</p><p>Исследование структуры пассива баланса позволяет установить возможные причины финансовой неустойчивости организации.</p>"},
        {"number": 3, "title": "Содержание и концепция анализа формы «Отчет о финансовых результатах»", "content": "<p>3.1 Содержание формы «Отчет о финансовых результатах»</p><p>Современный отчет представляет информацию о формировании финансовых результатов по разнообразным видам деятельности, а также итоги различных фактов хозяйственной деятельности за отчетный период, способных повлиять на величину конечного финансового результата.</p><p>Информация в отчете о финансовых результатах имеет логическое построение, которая предусматривает последовательное отражение доходов, расходов и разницы между ними.</p><p>Действующая форма отчета имеет 5 граф: пояснения, наименование показателя, код, отчетный период и период предыдущего года.</p><p>По статье «Выручка» от продажи товаров, продукции, работ, услуг показывается выручка от продажи продукции и товаров, поступления, связанные с выполнением работ и оказанием услуг, осуществлением хозяйственных операций.</p><p>По статье «Себестоимость продаж» отражаются учтенные затраты на производство продукции, работ, услуг.</p><p>Данные статьи «Валовая прибыль (убыток)» определяются как разница между данными статей «Выручка» и «Себестоимость продаж».</p><p>«Коммерческие расходы» представляют собой расходы на маркетинг, рекламу, заработную плату сотрудников системы сбыта, доставку продукции потребителю.</p><p>«Управленческие расходы» - к ним относятся расходы по управлению организацией и расходы общего характера не связанные с производством конкретных видов продукции.</p><p>«Прибыль (убыток) от продаж» - промежуточный итог, качественно характеризует, как валовая прибыль, обычную деятельность организации. Этот показатель представляет собой разность между доходами от обычных видов деятельности и всеми перечисленными видами расходов.</p><p>«Доходы от участия в других организациях» отражаются доходы и расходы, признанные организацией в бухгалтерском учете как прочие.</p><p>По статье «Проценты к получению» отражаются операционные доходы в сумме причитающихся в соответствии с договорами процентов по облигациям.</p><p>По статье «Проценты к уплате» отражаются операционные расходы в сумме начисленных в соответствии с договорами к уплате процентов по облигациям.</p><p>По статье «Прочие доходы» отражается прибыль, полученная организацией в результате совместной деятельности (по договору простого товарищества).</p><p>По статье «Прочие расходы» отражаются штрафы, пени, неустойки за нарушение условий договоров, по которым получены решения суда об их взыскании.</p><p>По строке «Налог на прибыль организации» отражают сумму текущего налога на прибыль.</p><p>Прибыль (убыток) от прекращаемой деятельности — <em>это финансовый результат, который компания получает при прекращении части своей деятельности</em>.</p><p>Чистая прибыль (убыток) — <em>это итоговый финансовый результат деятельности организации за определённый отчётный период</em></p><p>3.2 Концепция анализа формы «Отчет о финансовых результатах»</p><p>3.2.1 Диагностика качества формирования показателей</p><p>Приступая к анализу отчета о финансовых результатах, необходимо выявить в соответствии ли с установленным порядком рассчитаны показатели:</p><p>-экономическая прибыль, прибыль от обычной деятельности, нераспределенная прибыль (убыток);</p><p>-себестоимость продаж,</p><p>- коммерческие и управленческие расходы;</p><p>- доходы от участия в других организациях.</p><p>Кроме того, необходимо:</p><p>- исследовать методы, применяемые организацией при отражении доходов и расходов;</p><p>-выявить достоверность формирования показателей в отчетности;</p><p>-исследовать характеристики рынков.</p><p>Методика анализа отчета о финансовых результатах предполагает два направления:</p><p>-анализ поступления средств;</p><p>-анализ их расходования.</p><p>Доходами организации признается увеличение экономических выгод в результате поступления активов.</p><p>Расходами организации признается уменьшение экономических выгод в результате выбытия активов.</p><p>3.2.2 Методика анализа отчета о финансовых результатах</p><p>Методика анализа отчета о финансовых результатах предполагает следующие этапы:</p><p>Предварительный этап.</p><p>Предусматривает формирование таблиц:</p><p>- с необходимыми данными для анализа финансовых результатов деятельности организации, их изменения за отчетный период и темп прироста;</p><p>- с исходной информацией для расчета влияния факторов на изменение прибыли от продаж.</p><p>1 этап.</p><p>Расчет прироста прибыли от продаж (прибыль от продаж отчетного года - прибыль от продаж предыдущего года).</p><p>2 этап.</p><p>Расчет темпа роста объема продаж (выручка от продаж по ценам и затратам предыдущего года / выручка от продаж предыдущего года * 100%).</p><p>3 этап.</p><p>Расчет прироста прибыли при увеличении объема продаж ((темп роста</p><p>объема продаж * прибыль в предыдущем периоде) / 100%).</p><p>4 этап.</p><p>Расчет изменения себестоимости проданной продукции (себестоимость проданной продукции в отчетном году - себестоимость проданной продукции по ценам и затратам предыдущего года).</p><p>5 этап.</p><p>Расчет изменения коммерческих расходов при неизменном объеме продаж (коммерческие расходы отчетного года - коммерческие расходы по ценам и затратам предыдущего года).</p><p>6 этап.</p><p>Расчет изменений управленческих расходов при неизменном объеме продаж (управленческие расходы отчетного года - управленческие расходы по ценам и затратам предыдущего года).</p><p>7 этап.</p><p>Расчет влияния на изменение прибыли от продаж увеличения цен на продукцию, услуги (выручка от продаж отчетного года - выручка от продаж отчетного года по ценам и затратам предыдущего года).</p><p>8 этап.</p><p>Расчет влияния изменения структурных изменений в реализации продукции на изменение прибыли от продаж ( прибыль отчетного года по ценам и затратам предыдущего года - прибыль от продаж предыдущего года * темп роста объема продаж).</p><p>3.2.3 Анализ «качества» формирования прибыли в отчете о финансовых результатах</p><p>Используя данные формы «Отчет о финансовых результатах» можно рассчитать ряд показателей, характеризующих «качество» формирования финансовых результатов организации. Основными из них являются:</p><p>-маржинальный доход;</p><p>-операционный рычаг;</p><p>-финансовый рычаг;</p><p>-точка критического объема продаж;</p><p>-запас финансовой прочности.</p><p>Маржинальный доход - это разность между выручкой от продаж и переменными затратами.</p><p>Маржинальный доход характеризует доходность субъекта хозяйствования только при сопоставлении объема продаж и себестоимости проданных товаров или оказанных услуг. Он показывает долю каждого рубля продажи, которую можно использовать для нивелирования других операционных расходов.</p><p>Коэффициент зависимости маржинального дохода от операционной прибыли - определяется отношением маржинального дохода к операционной прибыли.</p><p>Такое соотношение отражает величину изменения прибыли от основной деятельности при изменении объема продаж.</p><p>Операционный рычаг - отношение маржинального дохода к операционной прибыли предприятия.</p><p>Показатель отражает величину изменения операционной прибыли при изменении объема реализации. Эффект операционного рычага основан на соотношении постоянных и переменных расходов организации.</p><p>Финансовый рычаг взаимосвязан с таким понятием, как финансовый риск. Финансовый риск - это риск, связанный с возможным недостатком средств для выплаты по кредитам и займам. Финансовый рычаг определяется степенью использования заемных средств для финансирования активов.</p><p>Сходство между операционным рычагом и финансовым рычагом заключается в том, что оба они представляют возможность выиграть от постоянной величины затрат, не меняющейся при изменении масштаба производственной деятельности.</p><p>Точка критического объема продаж характеризует ситуацию, когда затраты на производство и реализацию продукции будут равны выручке, а следовательно и рентабельность продаж равна 0.</p><p>Рассчитывается как отношение величины условно-постоянных затрат к доле маржинального дохода в выручке от продаж.</p>"},
        {"number": 4, "title": "Содержание и концепция анализа отчета о движении денежных средств - приложения к формам бухгалтерской отчетности", "content": "<p>4.1 Содержание формы «Отчет о движении денежных средств»</p><p>Отчет о движении денежных средств является одной из обязательных форм годовой бухгалтерской (финансовой) отчетности.</p><p>Цель его составления - представить пользователям финансовой отчетности возможность оценки источников финансирования предприятия и его способности обеспечить выплаты по обязательствам.</p><p>Отчет содержит четыре графы: наименование показателя, код с нумерацией по строкам с 4110 - 4490. В графе 3 и 4 указывается отчетный период и период предыдущего года.</p><p>Составление отчета о движении денежных средств заключается в распределении всех поступлений (притоков) денежных средств и их расходов (оттоков) по видам деятельности: текущей, инвестиционной и финансовой деятельности.</p><p>В примечаниях к финансовой отчетности необходимо раскрывать положения учетной политики, относящиеся к составлению отчета о движении денежных средств. Организация должна раскрыть информацию о возможности дополнительно привлечь в будущем денежные средства.</p><p>Особенностью отчета о движении денежных средств является то, что остаток денежных средств на начало и конец периода в целом по организации отражается без разбивки по видам деятельности, в то время как движение денежных средств, следует отражать отдельно по каждому виду деятельности.</p><p>4.2 Концепция анализа отчета о движении денежных средств</p><p>Анализ отчета о движении денежных средств предполагает следующие этапы:</p><p>Предварительный этап.</p><p>Изучение достоверности и качества формирования денежных потоков по видам деятельности.</p><p>Текущая деятельность.</p><p>Важно выявить качество поступлений, политику управления оборотными активами и текущими обязательствами:</p><p>1. Качество поступлений денежных средств определяется надежностью предоставленных данных о прибыли, как эти данные получены и каковы методы учета.</p><p>2. Политика управления оборотными активами. Если, отчет о движении денежных средств свидетельствует о приросте оборотных активов (расходовании денежных средств), аналитику следует выяснить, пропорционален ли такой прирост увеличению выручки.</p><p>3. Политика управления текущими обязательствами. Если отчет о движении денежных средств показывает увеличение суммы счетов к оплате или других начисленных сумм (источник денежных средств), следует определить, является ли такой прирост реакцией на увеличение продаж или же субъект хозяйствования опаздывает с погашением кредита.</p><p>Инвестиционная деятельность</p><p>Данная группа потоков включает движение, связанное с приобретением или продажей внеоборотных активов, от продажи акций других организаций, предоставление займов.</p><p>Финансовая деятельность</p><p>Эта группа включает потоки денежных средств, непосредственно связанных с внешним финансированием организации.</p><p>1 этап - изучается динамика объема формирования положительного денежного потока организации.</p><p>2 этап - изучение динамики объема отрицательного денежного потока организации.</p><p>3 этап - анализируется сбалансированность положительного и отрицательного денежных потоков по общему объему. Определястся достаточность создаваемого организацией чистого денежного потока.</p><p>Для 3 этапа могут быть рассчитаны коэффициенты:</p><p>-коэффициент достаточности чистого денежного потока (чистый денежный поток/ (выплаты по кредитам и займам+прирост остатков материальных оборотных активов+дивиденды);</p><p>-коэффициент эффективности денежных потоков (чистый денежный поток/отток денежных средств).</p><p>4 этап - определяется роль показателя чистой прибыли в формировании чистого денежного потока. Изучается влияние на него различных факторов: изменения за анализируемый период величин остатков производственных запасов, дебиторской и кредиторской задолженности.</p><p>Одним из показателей, характеризующих качество формирования положительного денежного потока является коэффициент рентабельности положительного денежного потока (прибыль от продаж/положительный денежный поток).</p><p>5 этап - анализ эффективности использования денежных средств по всем видам деятельности. Прежде всего, необходимо определить остаток денежных средств по видам деятельности. Для оценки эффективности использования денежных средств денежные потоки необходимо сопоставить с полученным финансовым результатом, т. е. определить их рентабельность (рентабельность остатка денежных средств/финансовый результат).</p><p>Анализируя результативные значения вышеперечисленных коэффициентов следует учитывать следующее:</p><p>1 .Нельзя рассматривать как отрицательный момент в текущей деятельности организации снижение рентабельности израсходованных денежных средств, если оно вызвано увеличением выплат, которые обеспечат прибыль в будущем;</p><p>2.Не является отрицательным снижение рентабельности поступивших денежных средств, если оно обеспечено увеличением поступления денежных средств от мероприятий, финансовый результат по которым был выявлен в предыдущем периоде.</p>"},
        {"number": 5, "title": "Содержание и концепция анализа отчета об изменениях капитала - приложения к формам бухгалтерской отчетности.", "content": "<p>5.1 Содержание отчета об изменениях капитала</p><p>Отчет об изменениях капитала характеризует изменение финансового положения организации за период. В отчете по горизонтали отражается структура капитала, а по вертикали - операции с капиталом. Отчет об изменениях капитала состоит из трех разделов.</p><p>Первый раздел «Движение капитала» посвящен движению капитала в отчетном периоде, а также в двух предыдущих периодах.</p><p>Второй раздел называется «Корректировки в связи с изменениями учетной политики и исправлением ошибок». Здесь отражается информация о корректировках и исправлениях за год, предшествующий отчетному периоду.</p><p>Третий раздел «Чистые активы» - состоит из трех граф, где необходимо указать чистые активы по состоянию на 31 декабря текущего года, прошлого года, и года, предшествующего прошлому.</p><p>5.2 Концепция анализа отчета об изменениях капитала</p><p>Капитал - это средства, которыми располагает хозяйствующий субъект для осуществления своей деятельности с целью получения прибыли.</p><p>Формируется капитал за счет собственных и заемных источников.</p><p>Источники пополнения собственного капитала классифицируются на внутрени внешние.</p><p>Внутренние - чистая прибыль, амортизационные поступления, фонд переоценки имущества, прочие источники.</p><p>Внешние - выпуск акций, безвозмездная финансовая помощь, прочие внешние источники.</p><p>Основным источником пополнения собственного капитала является прибыль предприятия. Если предприятие убыточное, то собственный капитал уменьшается на сумму полученных убытков.</p><p>Заемный капитал - это кредиты банков и финансовых компаний, займы, кредиторская задолженность, лизинг и др. Он подразделяется на долгосрочный (более года) и краткосрочный (до года).</p><p>По форме привлечения заемные средства могут быть в денежной форме, товарной форме, в форме оборудования (лизинг) и др.</p><p>Концепция анализа отчета об изменениях капитала предполагает четыре этапа.</p><p>На 1 этапе исследуют динамику и структуру источников капитала (собственный и заемный).</p><p>На 2 этапе выполняют детализированный анализ формирования структуры капитала. Более подробно изучают динамику и структуру собственного и заемного капитала, выясняют причины изменения отдельных слагаемых и дают оценку этим изменениям. На данном этапе оценивают изменения суммы и доли собственного капитала в валюте баланса, выясняют, за счет каких факторов произошли эти изменения.</p><p>3 этап. Оценить и выявить предпосылки возникновения финансовых рисков при помощи коэффициентов:</p><p>-Коэффициент независимости (собственный капитал/валюта баланса *100%);</p><p>-Коэффициент финансовой устойчивости (собственный капитал + долгосрочные заемные средства/валюта баланса)</p><p>-Коэффициент финансирования(собственный капитал/заемный капитал).</p><p>4 этап. Выявление факторов, влияющих на формирование структуры капитала.</p><p>Основными из них являются:</p><p>-способ размещения источников финансирования в активе баланса;</p><p>-доля собственных источников;</p><p>-период оборота средств;</p><p>-соотношение длительности производственно-коммерческого цикла и срока погашения кредиторской задолженности;</p><p>-структура затрат предприятия.</p>"},
        {"number": 6, "title": "Пояснения к бухгалтерскому балансу и отчету о финансовых результатах", "content": "<p>6.1. Аналитическая ценность пояснительной информации</p><p>Современные тенденции развития бухгалтерской отчетности, как в международной, так и в российской практике учета таковы, что все больший акцент делается на раскрытие пояснительной информации.</p><p>Чем обусловлена необходимость раскрытия информации отдельных аспектов для целей анализа бухгалтерской отчетности:</p><p>Раскрытие фактов изменения учетной политики. В настоящее время предприятия обладают значительным набором вариантов учетной политики. Последствия изменения учетной политики отражаются посредством корректировки данных в бухгалтерской отчетности за отчетный период.</p><p>Раскрытие выявленных в отчетном периоде ошибок в учете, допущенных в более ранние периоды. Они приводят к искажению показателей реального финансового состояния организации.</p><p>Раскрытие информации о сегментах бизнеса. Распространяя свою деятельность на различные географические регионы, или товарные рынки, предприятия стремятся ограничить предпринимательские риски и обеспечить финансовую устойчивость в условиях меняющейся конъюнктуры рынка.</p><p>Объяснение тенденций изменения основных финансовых показателей. Может иметь место неоднозначная оценка тенденций отдельных аспектов деятельности с общей оценкой результативных показателей.</p><p>Раскрытие событий, имевших место после отчетной даты, но до даты представления отчета. Такие события предполагают, что с января по март (т. с. до даты подписания отчетности) следующего года может быть получена информация, уточняющая факты хозяйственной жизни, которые были отражены в бухгалтерском балансе.</p><p>6.2 Раскрытие пояснительной информации в формах бухгалтерской отчетности</p><p>С 2011 года организации обязаны предоставлять к бухгалтерской отчетности дополнительные пояснения, отражающие различные аспекты финансово-хозяйственной деятельности, которые расшифровывают отчетные данные.</p><p>Пояснения разрешено оформлять как в табличном, так и в текстовом виде. Табличная форма предназначена для количественных данных, а в текстовой форме отражается информация описательного характера.</p><p>Примерное содержание информации в рекомендуемых формах пояснений должно быть следующим:</p><p>1 Информация по наличию и движению НИОКР по объектам (группам объектов) объединена в одном разделе 1 «нематериальные активы и расходы на НИОКР». Здесь должна быть раскрыта информация о первоначальной стоимости нематериальных активов, созданных самой организацией, нематериальных активов с полностью погашенной стоимостью.</p><p>2. В разделе 2 «Основные средства» Пояснений отражается наличие и движение основных средств с информацией по их переоценке. В данном разделе содержится подраздел «Незавершенные капитальные вложения», где раскрывается информация о понесенных затратах, их списания и принятием капитальных вложений к учету.</p><p>3. В разделе 3 «Финансовые вложения» необходимо указать дополнительную информацию: изменения финансовых вложений за период (выбытие, начисление процентов и т. д.), их иное использование: находящиеся в залоге, переданные третьим лицам.</p><p>4. В разделе 4 «Запасы» должна раскрываться информация по группам запасов: остатки на начало и конец года, изменения за период (поступило, выбыло).</p><p>5. В разделе 5 «Дебиторская задолженность» необходимо раскрывать информацию в разрезе изменений за период и отдельно выделить просроченную дебиторскую и кредиторскую задолженности.</p><p>6. В разделе 6 «Затраты на производство» расшифровываются материальные затраты, расходы на оплату труда.</p><p>7. В разделе 7 «Оценочные обязательства» расшифровывается информация по видам оценочных обязательств признанных, погашеных и списанных.</p><p>8. В разделе 8 «Обеспечения обязательств» отражается информация за три периода по полученным и выданным обязательствам в разрезе их вида.</p><p>9. Раздел 9 «Государственная помощь» содержит информацию о полученных на конкретные цели и возвращенных бюджетных средствах за два периода.</p><p>6.3 Раскрытие информации о риске ликвидности в бухгалтерской отчетности</p><p>В годовой бухгалтерской отчетности рекомендуется раскрывать показатели и пояснения о потенциально существенных рисках хозяйственной деятельности, которым подвержена организация.</p><p>Согласно МСФО 7 риск ликвидности - это риск того, что у предприятия возникнут сложности при выполнении обязанностей, связанных с финансовыми обязательствами, расчет по которым производится денежными средствами или иными финансовыми активами.</p><p>Минфин России и МСФО 7 предлагают выделять временные интервалы.</p><p>Временные интервалы для анализа финансовых обязательств, рекомендуемые российскими стандартами предполагают следующие ограничения:</p><p>- не более одного месяца;</p><p>- от одного месяца до трех месяцев,</p><p>- от трех месяцев до одного года;</p><p>- от одного года до трех лет;</p><p>- свыше трех лет.</p><p>МСФО 7 требует, чтобы «предприятие описало, каким образом оно управляет риском ликвидности, присущим статьям, количественная информация о которых раскрывается в отчетности.</p><p>Временные интервалы, необходимые к представлению в отчетности для определения риска ликвидности, призваны более детально раскрывать активы, удерживаемым предприятием для управления риском ликвидности, или обязательствам по срокам их погашения.</p>"},
        {"number": 7, "title": "Анализ платежеспособности", "content": "<p>7.1 Качественные характеристики аналитических инструментов анализа платежеспособности</p><p>Анализ платежеспособности организации является одним из этапов анализа финансового состояния.</p><p>Платежеспособность организации характеризует возможность наличными денежными ресурсами своевременно погашать свои платежные обязательства.</p><p>Оценка платежеспособности осуществляется на основе характеристики ликвидности.</p><p>1.Коэффициент общей (текущей) ликвидности характеризует способность предприятия выполнять краткосрочные обязательства за счет всех текущих активов.</p><p>Он показывает степень, в которой текущие активы покрывают текущие пассивы. Превышение текущих активов над текущими пассивами обеспечивает резервный запас для компенсации убытков. Рекомендуемоерасчетное значение коэф-та должно быть от 1 до 2.</p><p>2. Коэффициент промежуточной ликвидности. Это отношение ликвидных средств к общей сумме краткосрочных долгов предприятия.</p><p>Его рекомендуемое значение в интервале от 0,5 до 0,7. Данный коэффициент характеризует способность организации выполнять краткосрочные обязательства за счет ликвидной части текущих активов. Он отражает прогнозируемые платежные возможности при условии своевременного проведения расчетов с дебиторами.</p><p>3.Коэффициент абсолютной ликвидности. Он определяется отношением ликвидных средств к сумме краткосрочных обязательств.</p><p>Коэффициент отражает способность организации выполнять краткосрочные обязательства за счет свободных денежных средств и краткосрочных финансовых вложений. Он показывает, какую часть краткосрочной задолженности может погасить организация в ближайшее время. Его рекомендуемое значение 1 и выше.</p><p>7.2 Аналитический инструментарий и методика анализа платежеспособности</p><p>Цель: определить текущее состояние платёжеспособности и прогнозируемые платежные возможности</p><p>Задачи (= этапы):</p><p>1. Оценить достаточность оборотных средств для погашения краткосрочных обязательств</p><p>2. Оценить степень зависимости платёжеспособности от затрат и запасов</p><p>3. Выполнить диагностику риска ликвидности</p><p>На 1 этапе: три коэффициента ликвидности</p><p>· Коэффициент текущей (общей) ликвидности = Оборотные активы / Краткосрочные обязательства</p><p>· Коэффициент промежуточной ликвидности = (Денежные средства + Финансовые вложения + Дебиторская задолженность) / Краткосрочные обязательства</p><p>· Коэффициент абсолютной ликвидности = (Денежные средства + Финансовые вложения) / Краткосрочные обязательства</p><p>На 2 этапе: факторы, повлекшие за собой изменения в результативных значениях показателей платежеспособности. В качестве факторов первого порядка можно рассматривать элементы оборотных активов: запасы, дебиторскую задолженность, финансовые вложения, денежные средства.</p><p>Анализируя состояние платежеспособности организации, необходимо рассматривать причины финансовых затруднений. Ими могут быть:</p><p>-повышение себестоимости продукции;</p><p>-производство неконкурентоспособной продукции;</p><p>-недостаток собственных источников финансирования;</p><p>- высокий процент налогообложения.</p><p>На 3 этапе: Для диагностики риска ликвидности проводится оценка эффективности использования оборотных активов. Используется следующий аналитический инструментарий:</p><p>· Коэффициент обеспеченности запасов = Собственные оборотные средства / Запасы</p><p>· Коэффициент оборачиваемости запасов = Выручка / Средняя величина запасов</p><p>(либо Себестоимость проданной продукции / Средняя величина запасов — <em>уточняется по методике)</em></p><p>· Коэффициент оборачиваемости краткосрочных кредитов и займов = Выручка / Средняя величина краткосрочных кредитов и займов</p><p>· Коэффициент оборачиваемости кредиторской задолженности = Выручка / Средняя величина кредиторской задолженности</p><p>· Длительность оборота запасов за период в днях = (Средняя величина запасов × Длительность периода в днях) / Себестоимость проданной продукции</p><p>(или: Длительность периода / Коэффициент оборачиваемости запасов)</p><p>· Длительность оборота краткосрочных кредитов и займов = (Средняя величина краткосрочных кредитов и займов × Длительность периода в днях) / Выручка</p><p>(или: Длительность периода / Коэффициент оборачиваемости краткосрочных кредитов и займов)</p><p>· Длительность оборота кредиторской задолженности = (Средняя величина кредиторской задолженности × Длительность периода в днях) / Выручка</p><p>(или: Длительность периода / Коэффициент оборачиваемости кредиторской задолженности)</p><p>· Материалоотдача = Выручка / Материальные затраты</p><p>· Материалоёмкость = Материальные затраты / Выручка</p>"},
        {"number": 8, "title": "Анализ финансовой устойчивости", "content": "<p>8.1 Качественные характеристики аналитических инструментов анализа финансовой устойчивости</p><p>Финансовая устойчивость определяется уровнем зависимости организации от внешних источников финансирования и характеризуется долгосрочной стабильностью.</p><p>Финансово устойчивым является такой хозяйствующий субъект, который не допускает неоправданной дебиторской и кредиторской задолженности и расплачивается в срок по своим обязательствам.</p><p>Устойчивость финансового состояния можно определить по группе показателей актива бухгалтерского баланса:</p><p>-основные средства и вложения;</p><p>-запасы и затраты;</p><p>-денежные средства и денежные эквиваленты, расчеты и прочие активы.</p><p>По группе показателей пассива бухгалтерского баланса:</p><p>-источники собственных средств;</p><p>-расчеты и прочие пассивы;</p><p>-кредиты и другие заемные средства.</p><p>Выделяют четыре типа финансовой устойчивости, которые характеризуются следующими неравенствами:</p><p>Абсолютная (ИСС ≥ ЗЗ). Все запасы предприятия могут быть покрыты собственными оборотными средствами. Встречается редко.</p><p>Нормальная (ИСС &lt; ЗЗ ≤ ИСОС + БКЗ + КЗ). Предполагает наличие небольшой доли долгосрочных заёмных инвестиций для покрытия собственных запасов.</p><p>Неустойчивое финансовое положение (ЗЗ &gt; ИСОС + БКЗ + КЗ). Наблюдаются закредитование компании, задержки в поступлении денежных средств, невыполнение плана по прибыли.</p><p>Кризисное (критическое) (ДЗ + ЦБ &lt; КЗ + ПСЗ). Предприятие неплатёжеспособно, находится на грани банкротства.</p><p>ИСС - источники собственных средств, ЗЗ - запасы и затраты, ИСОС -источник собственного оборотных средств, БКЗ - банковские кредиты и займы, КЗ - кредиторская задолженность, ПСЗ - просроченные ссуды и займы.</p><p>Аналитическим инструментарием являются следующие взаимосвязанные группы показателей:</p><p>Первая группа. Общая величина неплатежей.</p><p>Вторая группа. Причины неплатежей.</p><p>Третья группа. Источники, снижающие риск финансовой несостоятельности.</p><p>В методике анализа финансовой устойчивости, качестве основных показателей предлагаются: коэффициент автономии (соотношение заемных и собственных средств), коэффициент обеспеченности собственными оборотными средствами, коэффициент маневренности собственных оборотных средств).</p><p>8.2 Аналитический инструментарий и методика анализа финансовой устойчивости</p><p>Цель: Оценить уровень финансовой устойчивости в целях недопущения кредитного риска.</p><p>Задачи:</p><p>1. Оценить сбалансированность и постоянство источников финансирования деятельности хозяйствующего субъекта;</p><p>2. Оценить уровень финансовой зависимости от заемных источников финансирования.</p><p>Методика анализа предполагает три этапа</p><p>На 1 этапе выполняются расчеты показателей финансовой устойчивости:</p><p>- коэффициент обеспеченности собственными средствами;</p><p>- коэффициент маневренности собственных оборотных средств;</p><p>- коэффициент автономии.</p><p>На 2 этапе исследуются факторы, повлекшие за собой изменения в результативных значениях показателей финансовой устойчивости.</p><p>Факторы первого порядка: ОС, запасы, дебиторская задолженность, финансовые вложения, денежные средства и денежные эквиваленты, собственные источники финансирования, долгосрочные заемные средства, краткосрочные заемные средства,  кредиторская задолженность.</p><p>Используя методы факторного анализа (цепных подстановок; абсолютных разниц при составлении детерминированной факторной модели) выявляется влияние факторов на уровень финансовой устойчивости.</p><p>На 3 этапе: уровень финансовой зависимости от заемных источников.</p><p>Коэффициент обеспеченности запасами = (СК + ДО) / Запасы</p><p>Коэффициент манёвренности собственного капитала =  (СК + ДО) / СК</p><p>Коэффициент постоянного актива = (ВА - ДО) / СК</p><p>Коэффициент финансовой устойчивости = (СК + ДО) / валюта баланса</p><p>Коэффициент концентрации привлеченных средств = (ДО + КО) / валюта баланса</p><p>Коэффициент финансовой зависимости = Валюта баланса / СК</p>"},
        {"number": 9, "title": "Анализ деловой активности", "content": "<p>9.1 Качественные характеристики аналитических инструментов анализа деловой активности</p><p>Уровень деловой активности, позволяет сформировать целостное, системное представление о хозяйственной деятельности любого экономического субъекта, так как, затрагивает практически все виды и направления деятельности организации.</p><p>Уровень деловой активности — <em>это комплексная характеристика, которая отражает эффективность использования ресурсов предприятия, качество управления, способность адаптироваться к рыночным условиям и динамику развития организации</em>.</p><p>Анализ деловой активности заключается в исследовании уровней и динамики разнообразных финансовых коэффициентов — <em>показателей оборачиваемости</em>.</p><p>В оценке уровня деловой активности существенная практическая значимость отведена оборотным активам.</p><p>Оборотные активы - это мобильные активы предприятия, которые являются денежными средствами или могут быть обращены в них в течение года или одного производственного цикла.</p><p>Объем и структура оборотных средств определяется отраслевой принадлежностью. Однако их величина зависит и от случайных факторов. Поэтому оборотный капитал принято подразделять на постоянный и переменный.</p><p>Постоянный оборотный капитал - представляет собой ту часть денежных средств, дебиторской задолженности и производственных запасов, потребность в которых относительно постоянна в течение всего операционного цикла.</p><p>Переменный оборотный капитал - отражает дополнительные текущие активы, необходимые в напряженные периоды организации или в качестве страхового запаса.</p><p>При низком уровне оборотного капитала - возможны: потеря ликвидности, сбои в работе и низкая прибыль.</p><p>9.2 Аналитический инструментарий и методика анализа деловой активности</p><p>Цель: Поддержание уровня деловой активности организации в текущем временном периоде и на перспективу.</p><p>Задачи:</p><p>1. Контроль над величиной финансовых показателей, обеспечивающих уровень деловой активности.</p><p>2. Контроль над скоростью оборачиваемости активов и обязательств.</p><p>1 этап анализа - контроль над величиной финансовых показателей, определяющих уровень деловой активности, предполагает исследование при помощи горизонтального метода анализа тенденции поведения показателей (прибыль, выручка, себестоимость).</p><p>2 этап анализа - контроль над скоростью оборачиваемости активов и обязательств организации реализуется через показатели оборачиваемости активов и обязательств, которые исследуются в динамике горизонтальным методом анализа.</p><p>Аналитический инструментарий для контроля над скоростью оборота ресурсов - коэффициент оборачиваемости активов, фондоотдача, коэффициент оборачиваемости запасов.</p><p>3 этап анализа. Контроль над степенью влияния рисковых составляющих на уровень деловой активности.</p><p>Показателями общей рисковой составляющей уровня деловой активности могут быть - высокая концентрация активов в отдельных элементах структуры имущества организации, резкое увеличение или сокращение остатков на счетах запасов, денежных средств и дебиторской задолженности, замедление оборачиваемости текущих активов.</p><p>Контроль над соотношением рисковых составляющих уровня деловой активности - материальные ресурсы через показатели эффективности их использования рекомендуется соотнести с результативными величинами показателей - изменение выручки под влиянием стоимости материальных ресурсов; изменение выручки под влиянием материалоотдачи; изменение выручки под влиянием стоимости оборотных активов.</p>"},
        {"number": 10, "title": "Анализ кредитоспособности", "content": "<p>10.1 Качественные характеристики аналитических инструментов анализа кредитоспособности</p><p>Кредитоспособность отражает состояние организации, при котором обеспечивается стабильное его функционирование при воздействии как внутренних, так и внешних угроз. Это, прежде всего, такое состояние финансовых ресурсов, при котором организация способна эффективно их использовать, обеспечивая тем самым бесперебойный процесс производства и успешную реализацию продукции.</p><p>Высокая степень кредитоспособности характеризуется:</p><p>-ликвидным состоянием материальных ресурсов;</p><p>-бесперебойным процессом производства;</p><p>- платежеспособностью.</p><p>Под аналитическим инструментарием оценки кредитоспособности субъекта понимается совокупность взаимосвязанных систем показателей, предназначенных для оценки:</p><p>а) качества формирования финансового результата;</p><p>б) уровня финансовой зависимости от заемных источников;</p><p>в) рентабельности ресурсов и источников их финансирования.</p><p>10.2 Аналитический инструментарий и методика анализа кредитоспособности</p><p>Цель: Обеспеченность возвратности кредитных ресурсов предприятия.</p><p>Задачи:</p><p>1. Динамика показателей, обеспечивающих уровень кредитоспособности;</p><p>2. Оценка структуры источников финансирования организации;</p><p>3. Оценка уровня деловой активности</p><p>4. Рентабельность ресурсов</p><p>5. Прогнозирование перспектив развития бизнеса.</p><p>Методика анализа кредитоспособности, согласно цели исследования предполагает пять этапов.</p><p>Аналитический инструментарий: прибыль валовая, прибыль от продаж, прибыль до налогообложения, чистая прибыль.</p><p>Модель аналитического инструментария в оценке кредитоспособности заемщика позволит получить детализированную информацию о финансовом состоянии потенциального заемщика и оценить риски.</p>"},
        {"number": 11, "title": "Анализ движения денежных средств", "content": "<p>11.1 Качественные характеристики инструментов анализа движения денежных средств</p><p>Анализ движения денежных средств можно выполнить прямым или косвенным методом. По данным бухгалтерской отчетности предпочтительно выполнять анализ прямым методом.</p><p>Прямой метод состоит в группировке и анализе данных бухгалтерского учета, отражающих движение денежных средств, в контексте трех сфер деятельности и основывается на исчислении притока денежных средств.</p><p>Достоинство прямого метода состоит в том, что он позволяет оценить общие суммы поступлений (притока) и расходования (оттока) денежных средств, по видам и направлениям деятельности.</p><p>От текущей деятельности приток денежных средств формируется за счет:</p><p>-выручки от продажи продукции;</p><p>-арендных платежей.</p><p>-прочих поступлений</p><p>Отток денежных средств формируется за счет:</p><p>-платежей по счетам поставщиков и подрядчиков на оплату товаров, работ и услуг;</p><p>-оплату труда;</p><p>- на выплату процентов по долговым обязательствам;</p><p>-на расчеты по налогам и сборам.</p><p>От инвестиционной деятельности денежный поток может быть сформирован за счет поступлений:</p><p>-от продажи объектов основных средств и иного имущества;</p><p>-дивидендов.</p><p>За счет выбытия:</p><p>- на приобретение объектов основных средств и нематериальных активов;</p><p>- на финансовые вложения.</p><p>От финансовой деятельности может быть сформирован денежный поток за счет поступлений:</p><p>-кредитов и займов;</p><p>-вкладов участников.</p><p>За счет выбытия:</p><p>- на погашение кредитов и займов;</p><p>- на выплату дивидендов.</p><p>11.2 Аналитический инструментарий и методика анализа движения денежных средств</p><p>Цель: Анализ эффективности использования денежных потоков.</p><p>Задачи:</p><p>1. Анализ динамики показателей притока и оттока денежных средств;</p><p>2. Анализ рентабельности денежных средств.</p><p>На 1 этапе анализа выявляется общее денежных средств за анализируемый период путем суммирования результатов притока и оттока денежных средств.</p><p>На 2 этапе выполняется анализ рентабельности денежных средств.</p><p>Выделяют три группы показателей рентабельности денежных средств:</p><p>-рентабельность остатка денежных средств (финансовый результат/средний остаток *100%);</p><p>-рентабельность израсходованных денежных средств (финансовый результат/сумма израсходованных денежных средств*100%);</p><p>-рентабельность поступивших денежных средств (финансовый результат/сумма поступивших денежных средств*100%).</p><p>В систему показателей эффективности использования денежных потоков можно включить коэффициенты рентабельности:</p><p>-коэффициент рентабельности положительного денежного потока (чистая прибыль/положительный денежный поток*100%);</p><p>-коэффициент рентабельности чистого денежного потока (чистая прибыль/чистый денежный поток *100%).</p><p>3 этап. Факторный анализ денежных потоков с использованием различных приемов моделирования факторных систем.</p><p>Осуществляется расчет влияния факторов на изменение величины положительного денежного потока. Данную взаимосвязь можно определить по валовой прибыли от продаж (выручки) и коэффициенту рентабельности положительного денежного потока, используя формулу:</p><p>прибыль от продаж/положительный денежный поток*100%).</p><p>В основе построения аналитического инструментария движения денежных средств лежит система показателей (факторов), влияющих на эффективность денежных потоков: фондоемкость, материалоемкость, зарплатоемкость.</p>"},
        {"number": 12, "title": "Анализ финансовых результатов", "content": "<p>12.1 Качественные характеристики инструментов анализа финансовых результатов</p><p>Финансовый результат оценивается системой показателей и отражается в форме «Отчет о финансовых результатах» и в приложениях к бухгалтерской отчетности - «Отчет о движении капитала».</p><p>Показатели величины финансового результата (прибыль) составляют основу экономической деятельности хозяйствующего субъекта.</p><p>Прибыль предприятия получают главным образом от продаж, а также от других видов деятельности (сдача в аренду основных фондов, коммерческая деятельность на фондовых и валютных биржах и т. д.).</p><p>Только после продажи продукции чистый доход принимает форму прибыли.</p><p>Финансовые результаты деятельности организации характеризуются уровнем рентабельности. Их значимость обоснована тем, что чем выше уровень рентабельности, тем выше эффективность предпринимательской деятельности.</p><p>12.2 Аналитический инструментарий и методика анализа финансовых результатов</p><p>Цель: Анализ финансовых результатов, обеспечивающих самофинансирование деятельности хозяйствующего субъекта.</p><p>Задачи:</p><p>1.Анализ динамики показателей прибыли;</p><p>2. Анализ структуры балансовой прибыли;</p><p>3. Факторный анализ.</p><p>Методика анализа предполагает три этапа.</p><p>На 1 этапе выполняют анализ динамики и структуры видов прибыли (валовая, чистая, от продаж, до налогообложения).</p><p>На 2 этапе пристально изучается состав балансовой прибыли, ее структура, динамика.</p><p>При изучении динамики балансовой прибыли следует учитывать инфляционные факторы изменения ее величины. Для этого сумму выручки корректируют на средневзвешенный индекс роста цен на продукцию предприятия в среднем по отрасли.</p><p>На 3 этапе выполняется факторный анализ. Исследуются факторы, повлекшие изменения общей суммы прибыли.</p><p>В качестве основных факторов, можно рассматривать:</p><p>-объем продаж;</p><p>-отпускные цены на реализованную продукцию;</p><p>-цены на сырье, материалы и услуги.</p><p>Следует помнить, что расчет общего изменения прибыли от реализации продукции основывается на определении отклонений прибыли между отчетным периодом и базисным.</p>"},
