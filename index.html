<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Аудит: 73 вопроса</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --bg: #000;
            --panel: #101114;
            --panel-active: #1b1d22;
            --line: #292c33;
            --muted: #a6abb6;
            --accent: #9ac7ff;
            --font-scale: 1;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            padding: 12px;
            background: var(--bg);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            font-size: calc(14px * var(--font-scale));
            line-height: 1.45;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding-bottom: 10px;
            background: linear-gradient(#000 82%, transparent);
        }

        h1 {
            padding: 4px 2px 10px;
            font-size: calc(17px * var(--font-scale));
            line-height: 1.25;
        }

        .compact-title {
            display: none;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 1px solid var(--line);
            color: #fff;
            background: var(--panel);
            cursor: pointer;
            touch-action: manipulation;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .toolbar,
        .reader-toolbar,
        .reader-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-button,
        .nav-button {
            min-width: 44px;
            min-height: 44px;
            padding: 8px 11px;
            border-radius: 22px;
            font-weight: 700;
        }

        .search-panel {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .font-panel {
            margin-top: 8px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--panel);
        }

        .font-controls {
            display: flex;
            gap: 7px;
            align-items: center;
            justify-content: center;
        }

        .scale-value {
            min-width: 58px;
            color: var(--accent);
            text-align: center;
            font-size: calc(14px * var(--font-scale));
            font-weight: 700;
        }

        .reset-button {
            min-height: 44px;
            padding: 7px 11px;
            border-radius: 22px;
            color: var(--muted);
            font-size: calc(12px * var(--font-scale));
            font-weight: 700;
        }

        .font-preview {
            margin-top: 9px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #090a0c;
        }

        .font-preview-label {
            color: var(--accent);
            font-size: calc(12px * var(--font-scale));
            font-weight: 700;
        }

        .font-preview-title {
            margin-top: 3px;
            font-size: calc(14px * var(--font-scale));
            font-weight: 700;
        }

        .font-preview-text {
            margin-top: 5px;
            color: var(--muted);
            font-size: calc(13px * var(--font-scale));
            line-height: 1.35;
        }

        .search-box {
            min-width: 0;
            width: 100%;
            min-height: 44px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--panel);
            color: #fff;
            font-size: calc(14px * var(--font-scale));
        }

        .result-count {
            padding: 0 4px 7px;
            color: var(--muted);
            font-size: calc(12px * var(--font-scale));
        }

        .item-list {
            padding-bottom: 16px;
        }

        .item {
            display: block;
            width: 100%;
            margin-bottom: 8px;
            padding: 13px 14px;
            border-radius: 18px;
            text-align: left;
            transition: background 160ms ease, border-color 160ms ease, opacity 160ms ease, transform 160ms ease;
        }

        .item:active {
            background: var(--panel-active);
        }

        .item-header {
            margin-bottom: 4px;
            color: var(--accent);
            font-size: calc(12px * var(--font-scale));
            font-weight: 600;
        }

        .item-title {
            font-size: calc(14px * var(--font-scale));
            font-weight: 600;
            line-height: 1.25;
        }

        .reader {
            max-width: 760px;
            margin: 0 auto;
        }

        .reader-toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 8px 0 12px;
            background: linear-gradient(#000 84%, transparent);
        }

        .reader-heading {
            min-width: 0;
            flex: 1;
        }

        .reader-number {
            color: var(--accent);
            font-size: calc(12px * var(--font-scale));
            font-weight: 700;
        }

        .reader-title {
            overflow: hidden;
            margin-top: 2px;
            font-size: calc(15px * var(--font-scale));
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .progress-track {
            position: sticky;
            top: 62px;
            z-index: 99;
            height: 3px;
            margin-bottom: 10px;
            border-radius: 3px;
            background: #20232a;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: var(--accent);
        }

        .reader-content {
            font-size: calc(15px * var(--font-scale));
            line-height: 1.58;
        }

        .reader-content p {
            margin: 10px 0;
        }

        .reader-nav {
            position: fixed;
            left: 50%;
            bottom: 12px;
            z-index: 110;
            justify-content: center;
            padding: 5px;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: rgba(16, 17, 20, 0.96);
            box-shadow: 0 4px 16px #000;
            transform: translateX(-50%);
        }

        .nav-button {
            min-width: 44px;
            color: var(--accent);
            white-space: nowrap;
        }

        .nav-button:disabled {
            visibility: hidden;
        }

        .reader-content {
            padding-bottom: 76px;
        }

        .table-scroll {
            position: relative;
            margin: 10px 0;
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: inset -18px 0 14px -14px var(--accent);
            -webkit-overflow-scrolling: touch;
        }

        .table-hint {
            display: none;
            margin: 4px 0;
            color: var(--accent);
            font-size: calc(11px * var(--font-scale));
        }

        table {
            width: 100%;
            min-width: 420px;
            border-collapse: collapse;
        }

        td {
            padding: 4px 6px;
            border: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        td p {
            margin: 0;
        }

        tr:first-child td {
            background: var(--panel-active);
            font-weight: 600;
        }

        .highlight {
            padding: 1px 2px;
            border-radius: 2px;
            background: #ffd600;
            color: #000;
            font-weight: 600;
        }

        .no-results {
            padding: 20px;
            text-align: center;
            font-size: calc(13px * var(--font-scale));
            opacity: 0.6;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) and (max-height: 480px) {
            body {
                padding: 7vh 4vw 9vh;
            }

            .header {
                margin: -4vh 0 0;
                padding: 0 0 8px;
            }

            .toolbar {
                justify-content: center;
            }

            h1 {
                padding: 0 3px 6px;
                font-size: calc(15px * var(--font-scale));
            }

            .full-title {
                display: none;
            }

            .compact-title {
                display: inline;
            }

            .item {
                min-height: 62px;
                margin-bottom: 7px;
                padding: 12px 14px;
                opacity: 0.82;
            }

            .item.watch-focus {
                border-color: #4b5d73;
                background: var(--panel-active);
                box-shadow: 0 0 0 1px rgba(154, 199, 255, 0.2);
                opacity: 1;
            }

            .item-header {
                font-size: calc(13px * var(--font-scale));
            }

            .item-title {
                font-size: calc(15px * var(--font-scale));
            }

            .reader {
                margin: -4vh 0 0;
            }

            .reader-toolbar {
                padding-top: 0;
            }

            .reader-content {
                padding: 0 1vw 78px;
                font-size: calc(16px * var(--font-scale));
                line-height: 1.58;
            }

            .reader-title {
                font-size: calc(14px * var(--font-scale));
            }

            .progress-track {
                top: 54px;
            }

            .table-hint {
                display: block;
            }

            table {
                min-width: 520px;
                font-size: calc(12px * var(--font-scale));
            }

            .icon-button,
            .nav-button {
                font-size: calc(14px * var(--font-scale));
            }

            .reader-nav {
                bottom: 5vh;
                gap: 5px;
            }

            .reader-nav .nav-button {
                min-width: 48px;
                min-height: 48px;
                padding: 7px 10px;
            }

            .reader-nav .list-button {
                min-width: 112px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .item {
                transition: none;
            }
        }
    </style>
</head>

  {
    "number": 1.1,
    "title": "Аудит учредительных документов",
    "content": "<p><strong>1.1. Аудит учредительных документов</strong> (вроде такого вопроса нет, но пусть инф будет)</p>\n<p><strong>Цель аудита учредительных документов:</strong> Подтверждение законных оснований деятельности хозяйствующего субъекта на протяжении всего периода его функционирования — от момента регистрации до фактической реорганизации или ликвидации.</p>\n<p><strong>Основные направления проверки учредительных документов:</strong></p>\n<p>1. Подтверждение юридических оснований на право функционирования хозяйствующего субъекта.</p>\n<p>2. Проверка наличия и формы учредительных документов.</p>\n<p>3. Соответствие содержания учредительных документов требованиям законодательных и нормативных актов.</p>\n<p>4. Проверка законности видов деятельности.</p>\n<p><strong>Что должен выяснить аудитор при ознакомлении с учредительными документами:</strong></p>\n<p>· Организационно-правовую форму (ООО, АО и др.).</p>\n<p>· Форму собственности (государственная, частная и др.).</p>\n<p>· Принадлежность (российская, иностранная организация).</p>\n<p>· Юридический статус хозяйствующего субъекта.</p>\n<p>· Виды деятельности, предусмотренные учредительными документами.</p>\n<p>· Территорию функционирования.</p>\n<p>· Соответствие осуществляемых видов деятельности учредительным документам.</p>\n<p>· Виды деятельности, подлежащие лицензированию.</p>\n<p><strong>Источники информации для аудита учредительных документов:</strong></p>\n<p>· Устав.</p>\n<p>· Учредительный договор.</p>\n<p>· Зарегистрированные изменения к учредительным документам.</p>\n<p>· Свидетельство о государственной регистрации.</p>\n<p>· Приказы и распоряжения.</p>\n<p>· Лицензии на определенные виды деятельности.</p>\n<p>· Реестр акционеров.</p>\n<p>· Регистры синтетического и аналитического учета уставного капитала (счет 80 «Уставный капитал»).</p>\n<p>· Главная книга.</p>\n<p>· Оборотно-сальдовая ведомость.</p>\n<p>· Бухгалтерская (финансовая) отчетность.</p>\n<p>· Отчетность на дату ликвидации или реорганизации.</p>\n<p><strong>Этапы аудита учредительных документов:</strong></p>\n<p>1. Ознакомительный этап — проверка соответствия учредительных документов требованиям действующего законодательства.</p>\n<p>2. Основной этап — установление соответствия осуществляемых видов деятельности тем видам, которые закреплены в уставе. Аудитор запрашивает лицензии, проверяет правомерность изменений уставного капитала.</p>\n<p>3. Заключительный этап — формирование пакета рабочих документов, составление аудиторского отчета и его представление совместно с рабочей документацией руководителю аудиторской группы.</p>\n<p><strong>Типичные ошибки и нарушения:</strong></p>\n<p>· Деятельность без наличия лицензии.</p>\n<p>· Отсутствие подлинников или заверенных в соответствии с действующим законодательством документов.</p>"
  },
  {
    "number": 2,
    "title": "Аудит учетной политики",
    "content": "<p><strong>Цель</strong></p><p>аудита учетной политики : Установить соответствие учетной политики (УП) хозяйствующего субъекта требованиям действующего законодательства и особенностям деятельности хозяйствующего субъекта.</p><p><strong>Аудит учетной политики должен предшествовать всем остальным этапам</strong></p><p>аудиторской проверки в рамках классического аудиторского цикла.</p><p><strong>Задачи</strong></p><p>аудита УП:</p><p>1. Установление соответствия</p><p>применяемой методики БУ действующим нормативным документам.</p>"
  },
  {
    "number": 3,
    "title": "Источники информации для аудиторской проверки учетной политики",
    "content": "<p>Перечень источников информации:</p><p>1. Устав юридического лица.</p><p>2. Приказ (распоряжение) об учетной политике проверяемой организации.</p>"
  },
  {
    "number": 4,
    "title": "Перечень аудиторских процедур при аудите учетной политики.",
    "content": "<p><strong>Основные процедуры:</strong></p><p>. Изучение и анализ УП — исследование организационно-технических и методологических аспектов.</p><p>2. Заполнение</p><p>рабочих тест-таблиц — каждый элемент УП сопровождается ответами на поставленные вопросы и примечаниями аудитора.</p><p>3. Применение типового варианта УП</p><p>— разрабатывается методологами аудиторской фирмы для независимой экспертизы УП на соответствие требованиям нормативных документов.</p>"
  },
  {
    "number": 5,
    "title": "Аудит системы документирования операций",
    "content": "<p>. Аудит системы документирования операций</p><p><strong>Цель</strong></p><p>аудита системы документирования операций: Проверка подлинности первичных учетных документов , оценка объема документооборота, проверка наличия и соблюдения графика документооборота , проверка порядка соблюдения требований к номенклатуре дел .</p><p><strong>Классификация документов по юридической силе:</strong></p><p>· Подлинные документы.</p><p>· Подложные документы.</p><p>Основная задача аудитора:</p><p><strong>Определение подлинности первичных учетных документов.</strong></p><p>Влияние объема документооборота на аудит:</p><p>· Трудоемкость аудиторской проверки существенно зависит от объема документооборота.</p><p>· В зависимости от категории хозяйствующего субъекта формируются стоимость аудита, трудоемкость проверки, а также объем выборки.</p><p>· Качественная сторона системы документооборота (наличие графика документооборота) также влияет на трудоемкость.</p><p><strong>Классификация хозяйствующих субъектов по объему документооборота:</strong></p><p>· Мелкие организации — до 10 тыс. документов в год.</p><p>· Небольшие организации — от 10 тыс. до 25 тыс. документов в год.</p><p>· Средние организации — от 25 тыс. до 100 тыс. документов в год.</p><p>· Крупные организации — свыше 100 тыс. документов в год.</p><p><strong>Этапы</strong></p><p>1. Проверка наличия и соблюдения графика документооборота:</p><p>· График оформляется в виде схемы или перечня работ по созданию, проверке и обработке документов.</p><p>· Определяет оптимальное число подразделений и исполнителей для прохождения документов.</p><p>· Основные задачи графика: определение оптимального числа подразделений и исполнителей, обеспечение минимального срока нахождения документа в подразделении, усиление контрольных функций учета.</p><p>2. Проверка порядка соблюдения требований к номенклатуре дел:</p><p>· Номенклатура дел — систематизация первичных документов с указанием сроков хранения.</p><p>· Проверяется: наличие специалиста, ответственного за работу с документами; приказ руководителя; должностные инструкции.</p><p>·</p><p>Проверяются реквизиты : название номенклатуры, название организации, адресат, краткое содержание, даты, указание на подлинность.</p><p>·</p><p>Проверяются признаки заведения дел : номинальный, предметно-вопросный, авторский, корреспондентский, географический, хронологический.</p><p>· Проверяются</p><p>нормативные требования хранения : документы постоянного и временного сроков хранения группируются раздельно; подлинники отдельно от копий; приложения к документам хранятся в одной папке с основными документами.</p><p><strong>Нормативная база:</strong></p><p>ФСБУ 27/2021 «Документы и документооборот в бухгалтерском учете ». Типичные ошибки и нарушения: Несоблюдение положений, закрепленных в ФСБУ 27/2021 «Документы и документооборот в бухгалтерском учете».</p>"
  },
  {

    "content": "<p>аудита капитальных вложений Капитальные вложения – з атраты хозяйствующего субъекта на приобретение, создание, улучшение объектов основных средств, объектов нематериальных активов, а также восстановление объектов основных средств.</p><p><strong>Цель</strong></p><p>аудита капитальных вложений: Формирование мнения о достоверности и полноте отражения в бухгалтерской (финансовой) отчетности информации о капитальных вложениях.</p><p><strong>Задачи</strong></p><p>аудита капитальных вложений:</p><p>1. Проверка</p><p>правильности классификации капитальных вложений в бухгалтерском учете.</p><p>2. Проверка</p><p>правильности оценки капитальных вложений в бухгалтерском учете.</p><p>3. Проверка</p><p>оформления и отражения в бухгалтерском учете операций с капитальными вложениями.</p><p><strong>Нормативная база:</strong></p><p>ФСБУ 26/2020 «Капитальные вложения».</p><p><strong>Источники информации:</strong></p><p>1. Учетная политика (в части КВ):</p><p>· Классификация объектов КВ.</p><p>· Объект учета незавершенных КВ.</p><p>· Методика учета КВ.</p><p>· Организация аналитического учета.</p><p>· Оценка объектов КВ.</p><p>· Учет процентов по займам и кредитам.</p><p>· Выбытие объектов КВ.</p><p>· Отражение КВ в БФО.</p><p>2. Формы финансовой отчетности:</p><p>· Бухгалтерский баланс — строка «Прочие внеоборотные активы» (незавершенные КВ).</p><p>· Отчет о финансовых результатах — себестоимость продаж, прочие доходы, прочие расходы.</p><p>· Отчет о движении денежных средств — поступления от продажи ВА, платежи в связи с приобретением ВА.</p><p>· Пояснения к ББ и ОФР — разделы 1 и 2 (НМА и расходы на НИОКР, ОС, незаконченные КВ).</p><p>· Пояснительная записка — основные положения УП в части КВ.</p><p>3. Регистры учета — счет 08 «Вложения во внеоборотные активы», Главная книга, ОСВ.</p><p>4. Первичная документация:</p><p>· Акт о приемке выполненных работ (КС-2).</p><p>· Справка о стоимости выполненных работ и затрат (КС-3).</p><p>· Общий журнал работ.</p><p>· Журнал учета выполненных работ.</p><p>· Акты о сдаче в эксплуатацию и разборке временных сооружений.</p><p>· Акты приемки законченного строительством объекта.</p><p>· Инвентаризационная опись КВ.</p><p>· Сличительные ведомости результатов инвентаризации КВ.</p><p>5. Правоустанавливающие документы и договоры — договор купли-продажи, подряда, дарения, учредительные документы.</p>"

ументация — договоры купли-продажи, подряда, дарения, учредительные документы.</p><p>. Общая стратегия аудита основных средств</p><p><strong>Основные этапы общей стратегии:</strong></p><p>. Аудит состава основных средств.</p><p>2. Аудит поступления</p><p>основных средств:</p><p>· за плату (</p><p>Дт</p><p>08.4</p><p>Кт 60);</p><p>· по договору мены;</p><p>· созданных хозяйственным способом (</p><p>Дт</p><p>08.3</p><p>Кт 10, 70, 69);</p><p>· созданных подрядным способом (</p><p>Дт</p><p>08.3</p><p>Кт 60);</p><p>· по договору дарения (</p><p>Дт</p><p>08.4</p><p>Кт</p><p>98.2);</p><p>· в качестве вклада в уставный капитал (</p><p>Дт</p><p>08.4</p><p>Кт</p><p>75.1).</p><p>3. Аудит выбытия</p><p>основных средств:</p><p>· продажа (</p><p>Дт Кт</p><p>91.1,</p><p>Дт</p><p>01.выб</p><p>Кт 01, Дт Кт</p><p>01.выб,</p><p>Дт</p><p>91.2</p><p>Кт</p><p>01.выб);</p><p>· внесение в качестве вклада в УК других организаций;</p><p>· передача по договору мены;</p><p>· передача по договору дарения;</p><p>· списание вследствие прекращения срока полезного использования;</p><p>· списание при ликвидации.</p><p>4. Аудит прочих операций</p><p>с основными средствами:</p><p>· начисление амортизации (</p><p>Дт 20, 23, 25, 26, 44 Кт 02);</p><p>· расходы на содержание основных средств.</p><p>5. Оформление результатов</p><p>аудита. . План аудита основных средств</p><p><strong>Основные аудиторские процедуры:</strong></p><p>1. Нормативная проверка учетной политики</p><p>:</p><p>· наличие предела стоимости активов для принятия к учету;</p><p>· правомерность применения ускоренной амортизации;</p><p>· методика учета затрат на ремонт;</p><p>· выбранный способ начисления амортизации.</p><p>2. Инспектирование</p><p>договоров о полной материальной ответственности с работниками.</p><p>3. Изучение</p><p>состава комиссии, назначенной для контроля за движением и ликвидацией ОС.</p><p>4. Проверка</p><p>правильности определения первоначальной стоимости ОС.</p><p>5. Проверка</p><p>наличия инвентарных номеров .</p><     "content": "<p>. План аудита основных средств</p><p><strong>Основные аудиторские процедуры:</strong></p><p>1. Нормативная проверка учетной политики</p><p>:</p><p>· наличие предела стоимости активов для принятия к учету;</p><p>· правомерность применения ускоренной амортизации;</p><p>· методика учета затрат на ремонт;</p><p>· выбранный способ начисления амортизации.</p><p>2. Инспектирование</p><p>договоров о полной материальной ответственности с работниками.</p><p>3. Изучение</p><p>состава комиссии, назначенной для контроля за движением и ликвидацией ОС.</p><p>4. Проверка</p><p>правильности определения первоначальной стоимости ОС.</p><p>5. Проверка</p><p>наличия инвентарных номеров .</p><p>6. Синтаксическая и нормативная проверка оформления документов</p><p>и корреспонденции счетов при поступлении ОС.</p><p>7. Проверка</p><p>правильности начисления амортизации (соответствие способу в УП).</p><p>8. Проверка</p><p>правильности оформления операций по выбытию ОС.</p><p>9. Проверка</p><p>правильности формирования затрат на ремонт ОС.</p><p>10. Проверка</p><p>результатов переоценки объектов ОС.</p><p>11. Сверка показателей</p><p>бухгалтерского баланса и приложений с данными Главной книги и инвентарными карточками. Применяемые приемы и процедуры:</p><p>· Нормативная проверка.</p><p>· Аналитические процедуры.</p><p>· Прослеживание.</p><p>· Инспектирование.</p><p>· Арифметическая проверка.</p><p>. Типичные ошибки и нарушения</p><p>1. Несвоевременное оприходование объектов в бухгалтерском учете.</p><p>2. Неправильное исчисление первоначальной, балансовой, ликвидационной стоимости поступивших объектов ОС.</p><p>3. Некорректная корреспонденция счетов при отражении операций по движению ОС.</p><p>4. Неоприходование</p><p>материальных ресурсов, остающихся при ликвидации ОС ( Дт Кт</p><p>91.1).</p><p>5. Отсутствие аналитического учета ОС.</p><p>6. Отсутствие забалансового учета (счет 001 «Арендованные основные средства») и инвентарных карточек по арендованным объектам ОС.</p><p>7. Отсутствие начисления НДС по справедливой стоимости объекта при безвозмездной передаче ОС.</p><p>Детализированные ошибки:</p><p>1. Неправильная квалификация объектов ОС:</p><p>· Критерии признания не выполняются, но объект отнесен к ОС.</p><p>· Активы стоимостью менее установленного в УП лимита отражены в составе ОС.</p><p>· Активы стоимостью выше лимита отражены в составе средств в обороте.</p><p>· Имущество, приобретенное для сдачи в аренду, отражено в составе ОС (должно быть в составе доходных вложений).</p><p>2. Нарушен порядок документального оформления и своевременности:</p><p>· Первичные документы не оформлены или заполнены не все реквизиты.</p><p>· Дата документов не соответствует дате отражения в учете.</p><p>3. Нарушен порядок формирования первоначальной стоимости — не все фактические затраты включены.</p><p>4. Учет переоценки ОС:</p><p>· Нерегулярная переоценка.</p><p>· Некорректное отражение результатов.</p><p>· Амортизация начисляется без учета переоцененной стоимости.</p><p>5. Некорректное начисление амортизации:</p><p>· Начисление по имуществу, которое не является амортизируемым.</p><p>· Неверное определение СПИ.</p><p>· Несоблюдение способов начисления.</p><p>6. Неправильное отражение расходов на ремонт, модернизацию, реконструкцию — неверная квалификация произведенных расходов.</p><p>7. Не приходуются материалы, возникающие при выбытии ОС.</p><p>8. ОС не введены в эксплуатацию (не приняты к учету).</p><p>9. Не проводится инвентаризация ОС либо нарушен порядок оформления результатов.</p>"

p><p>· начисление амортизации (</p><p>Дт 20, 23, 25, 26, 44 Кт 05).</p><p>5. Оформление</p><p>результатов аудита . . План аудита нематериальных активов Особенность: Количество операций с НМА незначительно, поэтому аудит проводится сплошным способом.</p><p><strong>Основные аудиторские процедуры:</strong></p><p>1. Аудит</p><p>состава НМА:</p><p>· анализ обоснованности отнесения объектов к НМА;</p><p>· анализ УП в части учета НМА.</p><p>2. Аналитические процедуры</p><p>:</p><p>· установление полноты отражения информации о НМА в отчетности;</p><p>· проверка классификации и описания НМА в соответствии с требованиями к раскрытию.</p><p>3. Правовая экспертиза</p><p>правоустанавливающих документов:</p><p>· анализ договоров, патентов, свидетельств о регистрации права собственности.</p><p>4. Проверка</p><p>документов инвентаризации НМА по формальным признакам.</p><p>5. Проверка поступления</p><p>НМА:</p><p>· нормативная проверка момента перехода права собственности.</p><p>. Арифметическая проверка правильности формирования первоначальной стоимости НМА.</p><p>7. Аудит выбытия</p><p>НМА (аналогичен процедурам по поступлению).</p><p>8. Аудит</p><p>начисления амортизации :</p><p>· нормативная проверка состава НМА, подлежащих амортизации.</p><p>9. Оценка собранных доказательств</p><p>:</p><p>· анализ ошибок и нарушений;</p><p>· группировка ошибок по категориям;</p><p>· составление сводного отчета с указанием величины влияния на искажение показателей отчетности.</p>"

    "content": "<p><strong>Определение запасов (сырья и материалов):</strong></p><p>Активы, потребляемые или продаваемые в рамках обычного операционного цикла организации либо используемые в течение периода не более 12 месяцев.</p><p><strong>Цель:</strong></p><p>Выражение мнения о достоверности и полноте отражения в бухгалтерской (финансовой) отчетности информации о сырье и материалах.</p><p><strong>Задачи</strong></p><p>:</p><p>1. Проверка</p><p>состояния учета, хранения и эффективности использования материальных ресурсов.</p><p>2. Проверка</p><p>соответствия фактического наличия материальных ресурсов данным учета и потребностям субъекта. . Выявление непригодных для использования ценностей с определением суммы ущерба и виновных лиц.</p><p>4. Проверка</p><p>полноты и своевременности оприходования материальных ресурсов, законности и целесообразности расходования и их списания.</p><p>5. Проверка</p><p>качества инвентаризаций .</p><p><strong>Нормативная база:</strong></p><p>ФСБУ 5/2019 «Запасы».</p><p><strong>Источники информации:</strong></p><p>1. Учетная политика (рабочий план счетов, графики инвентаризации, документооборота) (в части учета сырья и материалов).</p><p>2. Договоры на поставку материалов.</p><p>3. Договоры о полной материальной ответственности.</p><p>4. Приказы о проведении инвентаризации и документы по результатам (акты, сличительные описи).</p><p>5. Первичные документы, документы складского учета.</p><p>6. Регистры по счетам 10 «Материалы»,</p><p>14 «Резервы под снижение стоимости МЦ», 15 «Заготовление и приобретение МЦ», 16 «Отклонение в стоимости МЦ».</p><p>7. Главная книга, ОСВ.</p><p>8. Бухгалтерская (финансовая) отчетность — форма «Бухгалтерский баланс», пояснения в части статьи «Запасы».</p><p>. Общая стратегия аудита сырья и материалов</p><p><strong>Основные этапы общей стратегии:</strong></p><p>1. Аудит</p><p>состава и наличия сырья и материалов.</p><p>2. Аудит</p><p>поступления сырья и материалов:</p><p>· приобретение по различным видам договоров (</p><p>Дт</p><p>10.1</p><p>Кт 60);</p><p>· приобретение подотчетным лицом (</p><p>Дт</p><p>10.1</p><p>Кт 71);</p><p>· поступление вкладов в уставный капитал (</p><p>Дт</p><p>10.1</p><p>Кт</p><p>75.1);</p><p>· получение безвозмездно (</p><p>Дт</p><p>10.1</p><p>Кт</p><p>98.2);</p><p>· поступление отходов производства, брака, остатков от ликвидации ОС (</p><p>Дт</p><p>10.6</p><p>Кт 20, 28, 91.1).</p><p>3. Аудит</p><p>выбытия сырья и материалов:</p><p>· внутри субъекта (отпуск на производственные и управленческие нужды —</p><p>Дт 20, 23, 25, 26 Кт 10, недостача — Дт Кт 10, списание);</p><p>· с переходом права собственности (продажа —</p><p>Дт Кт</p><p>91.1,</p><p>Дт</p><p>91.2</p><p>Кт 10, передача в счет вклада в УК — Дт Кт 10, безвозмездная передача — Дт</p><p>91.2</p><p>Кт 10);</p><p>· без перехода права собственности (ответственное хранение — счет 002 «Товарно-материальные ценности, принятые на ответственное хранение», залог — счет 009 «Обеспечения обязательств и платежей выданные»).</p><p>4. Оформление</p><p>результатов аудита. . План аудита сырья и материалов</p><p><strong>Основные аудиторские процедуры:</strong></p><p>1. Аудит состава</p><p>сырья и материалов:</p><p>· Обоснованность отнесения активов к сырью и материалам (по ФСБУ 5/2019).</p><p>· Классификация, номенклатура.</p><p>· Наличие нормирования запасов.</p><p>· Обоснованность объема минимальных партий приобретения.</p><p>· Объективность инвентаризаций.</p><p>2. Анализ УП в части полноты раскрытия</p><p>, соответствия способов ведения учета и оценки материалов.</p><p>3. Прослеживание соответствия остатков</p><p>аналитического и синтетического учета и БФО (счета 10, 14, 15, 16, Главная книга).</p><p>4. Инспектирование наличия материалов по местам хранения</p><p>— доказательство по критерию «существование».</p><p>5. Аудит операций по движению</p><p>:</p><p>· Законность операций.</p><p>· Правильность документального оформления.</p><p>· Реальность оценки.</p><p>· Правильность формирования стоимости выбывающих материалов.</p><p>· Полнота и своевременность отражения в учете.</p><p>6. Нормативная</p><p>проверка инвентаризации :</p><p>· Полнота информации о сырье и материалах в БФО.</p><p>· Классификация и описание видов материалов в соответствии с требованиями к раскрытию.</p><p>7. Заключительный этап</p><p>:</p><p>· Обобщение аудиторских доказательств.</p><p>· Группировка нарушений и ошибок по категориям.</p><p>· Расчет влияния выявленных ошибок на искажение показателей БФО.</p>"

    "title": "Информационная база аудита затрат на производство.",
    "content": "<p><strong>Определение затрат:</strong> Ресурсы предприятия, потребленные при производстве продукции, выполнении работ, оказании услуг. Осуществление затрат — это уменьшение одних активов с приростом других или одновременный прирост активов и обязательств.</p><p><strong>Цель</strong></p><p>аудита затрат на производство: Выражение мнения о достоверности и полноте отражения информации о затратах в БУ и БФО.</p><p><strong>Задачи</strong></p><p>аудита затрат на производство:</p><p>1. Проверка</p><p>метода учета затрат .</p><p>2. Проверка</p><p>метода распределения общехозяйственных и общепроизводственных расходов .</p><p>3. Проверка</p><p>распределения прямых и косвенных затрат .</p><p><strong>Источники информации:</strong></p><p>1. Учетная политика (рабочий план счетов, графики инвентаризации, документооборота) (в части учета затрат на производство).</p><p>2. Приказы о проведении инвентаризации и документы по результатам (акты, сличительные описи).</p><p>3. Первичные документы.</p><p>4. Регистры БУ по счетам 20 «Основное производство», 23 «Вспомогательные производства», 25 «Общепроизводственные расходы», 26 «Общехозяйственные расходы», 28 «Брак в производстве», 29 «Обслуживающие производства и хозяйства».</p><p>5. Главная книга, ОСВ.</p><p>6. Бухгалтерская (финансовая) отчетность — форма «Бухгалтерский баланс», пояснения в части статьи «Запасы».</p><p>2. Общая стратегия аудита затрат на производство</p><p><strong>Основные этапы общей стратегии:</strong></p><p>1. Аудит</p><p>метода учета затрат (цели, задачи).</p><p>2. Аудит</p><p>формирования затрат на производство.</p><p>3. Аудит</p><p>остатков незавершенного производства .</p><p>4. Оформление</p><p>результатов.</p><p><strong>Последовательность учета затрат на производство:</strong></p><p>1. На основании первичных документов собираются основные затраты в разрезе статей калькуляции (материалы —</p><p>Дт Кт 10, оплата труда — Дт Кт 70, социальные начисления — Дт Кт 69 и т.д.).</p><p>2. На основании справок-расчетов в затраты включается часть расходов будущих периодов (</p><p>Дт Кт 97), начисляются оценочные резервы, списываются затраты вспомогательных производств ( Дт Кт 23).</p><p>3. Суммируются общепроизводственные расходы (</p><p>Дт Кт 10, 70, 69, 02) и распределяются между объектами калькулирования ( Дт Кт 25).</p><p>4. Аналогичные действия производятся с общехозяйственными расходами (</p><p>Дт Кт 10, 70, 69, 02), если предусмотрено УП ( Дт Кт 26).</p><p>5. Определяются и списываются на основное производство потери от брака (</p><p>Дт Кт 28).</p><p>6. Производится оценка незавершенного производства на основании акта инвентаризации НЗП.</p><p>7. Рассчитывается фактическая себестоимость выпущенной продукции (</p><p>Дт Кт 20).</p><p>3. План аудита затрат на производство</p><p>Разделы плана:</p><p>1. Аудит метода учета затрат</p><p>:</p><p>· Обоснованность классификации затрат.</p><p>· Обоснованность объектов учета затрат и объектов калькулирования.</p><p>· Обоснованность способов калькулирования себестоимости.</p><p>· Объективность инвентаризаций и отражения их результатов.</p><p>2. Аудит формирования затрат:</p><p>· Общая схема (последовательность) учета затрат.</p><p>· Реальность операций и соответствие УП.</p><p>· Постатейный учет затрат.</p><p>· Оценка и включение в состав затрат производственного брака.</p><p>· Порядок распределения накладных и косвенных расходов.</p><p>· Выявление нетипичных операций.</p><p>3. Аудит</p><p>остатков НЗП:</p><p>· Соответствие способа оценки НЗП законодательству и УП.</p><p>· Соответствие остатков аналитического, синтетического учета и данных БФО.</p><p>4. Оформление результатов:</p><p>· Обобщение доказательств, группировка нарушений.</p><p>· Расчет влияния ошибок на искажение показателей БФО.</p><p><strong>Основные аудиторские процедуры:</strong></p><p>1. Нормативная проверка полноты УП в части учета затрат — соответствие действующему законодательству.</p><p>2. Нормативная проверка правильности выбора носителей затрат — изучение метода учета затрат, особенностей технологического процесса, выпускаемой продукции. Подтверждение оптимальности выбранного метода.</p><p>3. Проверка обоснованности норм потребления ресурсов — обусловленность конструкторскими, технологическими особенностями, разработка на основе отраслевых справочников, экспертного или экспериментального пути.</p><p>4. Инспектирование наличия незавершенного производства — желательно присутствие аудитора на инвентаризации НЗП.</p><p>5. Арифметическая проверка оценки НЗП.</p><p>6. Проверка затрат по элементам:</p><p>· правильность документального оформления;</p><p>· подтверждение оценки затрат;</p><p>· своевременность списания на себестоимость;</p><p>· полнота и своевременность отражения в учете и отчетности.</p><p>7. Оценка собранных доказательств:</p><p>· анализ ошибок и нарушений;</p><p>· группировка по категориям;</p><p>· составление сводного документа с указанием величины влияния на искажение показателей отчетности.</p>"

    "number": 26,
    "title": "Информационная база аудита готовой продукции.",
    "content": "<p><strong>Цель</strong></p><p>аудита готовой продукции: Формирование мнения о достоверности и полноте отражения в бухгалтерском учете и отчетности информации об операциях с готовой продукцией.</p><p><strong>Задачи</strong></p><p>аудита готовой продукции:</p><p>1. Проверка</p><p>правильности документального оформления операций по выпуску и продаже готовой продукции.</p><p>2. Проверка</p><p>полноты, своевременности и достоверности оприходования ГП на склад, отпуска и продажи ее покупателям.</p><p>3. Проверка</p><p>правильности и законности организации синтетического и аналитического учета операций , связанных с движением ГП.</p><p><strong>Нормативная база:</strong></p><p>ФСБУ 5/2019 «Запасы».</p><p><strong>Источники информации:</strong></p><p>1. Учетная политика (в части учета ГП).</p><p>2. Договоры о полной материальной ответственности.</p><p>3. Приказы о проведении инвентаризации и документы по результатам.</p><p>4. Документы складского учета.</p><p>5. Первичные документы.</p><p>6. Регистры по счетам 40 «Выпуск продукции», 43 «Готовая продукция», 45 «Товары отгруженные», 20 «Основное производство».</p><p>7. Главная книга, ОСВ.</p><p>8. Бухгалтерский баланс, пояснения к статье «Запасы».</p><p>. Общая стратегия аудита готовой продукции</p><p><strong>Основные этапы общей стратегии:</strong></p><p>1. Аудит</p><p>состава и наличия готовой продукции.</p><p>2. Аудит</p><p>выпуска готовой продукции ( Дт Кт 20).</p><p>3. Аудит</p><p>выбытия готовой продукции (продажа, использование внутри организации) ( Дт</p><p>90.2</p><p>Кт 43, Дт Кт</p><p>90.1)</p><p>4. Аудит</p><p>прочих операций с готовой продукцией.</p><p>5. Оформление результатов.</p><p>. План аудита готовой продукции</p><p>1. Аудит состава и наличия ГП:</p><p>· Обоснованность отнесения активов к ГП (прохождение всех стадий, приемка</p><p>техконтролем ).</p><p>· Классификация, номенклатура.</p><p>· Объективность инвентаризаций.</p><p>2. Аудит выпуска ГП:</p><p>· Общая схема движения из производства на склад.</p><p>· Полнота оприходования.</p><p>· Достоверность документального отражения.</p><p>· Объективность оценки.</p><p>· Объективность расчета отклонений фактической себестоимости от нормативной (при использовании счета 40).</p><p>3. Аудит выбытия ГП:</p><p>· Схема движения со склада к отгрузке.</p><p>· Объем и документальное отражение выбывающей на продажу (счет 45) и проданной.</p><p>· Объективность формирования информации об остатках в местах хранения.</p><p>· Соответствие остатков аналитического, синтетического учета и БФО.</p><p>4. Аудит прочих операций:</p><p>· Прочее поступление (например, после исправления брака).</p><p>· Прочее выбытие (неликвид, порча).</p><p>· Выявление нетипичных операций.</p><p>5. Оформление результатов</p><p>— как в других разделах. . Типичные ошибки и нарушения</p><p>1. Отсутствие готовой продукции, числящейся в бухгалтерском учете, на складе и в прочих подразделениях.</p><p>2. Несоблюдение периодичности, сроков проведения инвентаризации ГП и порядка ее оформления.</p><p>3. Неверное оформление договоров и первичных учетных документов по операциям с ГП.</p><p>4. Несоответствие оценки ГП ее фактическому состоянию.</p>"

    "title": "Информационная база аудита товаров.",
    "content": "<p><strong>Цель</strong></p><p>аудита товаров: Формирование мнения о достоверности и полноте отражения в бухгалтерской (финансовой) отчетности информации о товарах.</p><p><strong>Задачи</strong></p><p>аудита товаров:</p><p>1. Проверка</p><p>правильности отнесения активов к товарам.</p><p>2. Проверка</p><p>правильности оценки товаров в бухгалтерском учете.</p><p>3. Проверка</p><p>оформления и отражения в бухгалтерском учете операций по движению товаров.</p><p><strong>Источники информации:</strong></p><p>1. Учетная политика (в части учета товаров).</p><p>2. Бухгалтерская (финансовая) отчетность.</p><p>3. Главная книга.</p><p>4. Регистры по счетам 41 «Товары», 42 «Торговая наценка».</p><p>5. Первичная документация, правоустанавливающие документы и договоры.</p><p>. Общая стратегия аудита товаров</p><p><strong>Основные этапы общей стратегии:</strong></p><p>1. Аудит</p><p>состава и наличия товаров.</p><p>2. Аудит</p><p>поступления товаров:</p><p>· приобретение по договорам купли-продажи (</p><p>Дт</p><p>41.1</p><p>Кт 60);</p><p>· приобретение по договору мены;</p><p>· вклад в уставный капитал (</p><p>Дт</p><p>41.1</p><p>Кт</p><p>75.1);</p><p>· получение безвозмездно (</p><p>Дт</p><p>41.1</p><p>Кт</p><p>98.2);</p><p>· возврат товаров покупателями (</p><p>Дт</p><p>41.1</p><p>Кт 62);</p><p>· приобретение через подотчетное лицо (</p><p>Дт</p><p>41.1</p><p>Кт 71);</p><p>· поступление без перехода права собственности (залог — счет 009, ответственное хранение — счет 002).</p><p>3. Аудит</p><p>выбытия товаров:</p><p>· с переходом права собственности (продажа —</p><p>Дт Кт</p><p>90.1,</p><p>Дт</p><p>90.2</p><p>Кт</p><p>41.1; мена; вклад в УК —</p><p>Дт Кт</p><p>41.1; безвозмездная передача —</p><p>Дт</p><p>91.2</p><p>Кт</p><p>41.1; недостача —</p><p>Дт Кт</p><p>41.1);</p><p>· без перехода права собственности (ответственное хранение, залог).</p><p>4. Оформление результатов</p><p>аудита. . План аудита товаров</p><p><strong>Основные аудиторские процедуры:</strong></p><p>1. Анализ УП в части полноты раскрытия</p><p>и соответствия способов ведения учета товаров действующему законодательству.</p><p>2. Нормативная</p><p>проверка обоснованности отнесения имущества к товарам — руководствуясь условиями принятия к учету активов в качестве товара.</p><p>3. Классификация товаров</p><p>— на основе перечня субсчетов к счету 41 в рабочем плане счетов.</p><p>4. Прослеживание</p><p>соответствия остатков синтетического и аналитического учета и отчетности:</p><p>· сверка показателей отчетности с данными регистров по счетам 41, 42 и Главной книги.</p><p>5. Инспектирование наличия товаров по местам хранения</p><p>— подтверждение по критерию «существование».</p><p>6. Подтверждение принадлежности товаров субъекту</p><p>— анализ права собственности и соблюдения условий договоров о переходе права собственности.</p><p>7. Проверка операций по движению товаров</p><p>:</p><p>· законность операций по приобретению и выбытию;</p><p>· правильность документального оформления;</p><p>· реальность оценки;</p><p>· правильность формирования стоимости выбывающих товаров;</p><p>· полнота и своевременность отражения в учете и отчетности.</p><p>8. Нормативная</p><p>проверка инвентаризации товаров и отражения ее результатов в учете.</p><p>9. Оформление</p><p>результатов аудита. . Типичные ошибки и нарушения</p><p>1. Отсутствие товаров, зарегистрированных в учете, на складе и в торговых подразделениях.</p><p>2. Несоблюдение периодичности, сроков инвентаризации и порядка оформления.</p><p>3. Несоответствие оценки товаров их фактическому состоянию.</p><p>4. Наличие операций с товарами, несвоевременно отраженных в учете.</p>"

енности и соблюдения условий договоров о переходе права собственности.</p><p>7. Проверка операций по движению товаров</p><p>:</p><p>· законность операций по приобретению и выбытию;</p><p>· правильность документального оформления;</p><p>· реальность оценки;</p><p>· правильность формирования стоимости выбывающих товаров;</p><p>· полнота и своевременность отражения в учете и отчетности.</p><p>8. Нормативная</p><p>проверка инвентаризации товаров и отражения ее результатов в учете.</p><p>9. Оформление</p><p>результатов аудита. . Типичные ошибки и нарушения</p><p>1. Отсутствие товаров, зарегистрированных в учете, на складе и в торговых подразделениях.</p><p>2. Несоблюдение периодичности, сроков инвентаризации и порядка оформления.</p><p>3. Несоответствие оценки товаров их фактическому состоянию.</p><p>4. Наличие операций с товарами, несвоевременно отраженных в учете.</p>"

    "content": "<p>Формы денежных средств: наличные в кассе, безналичные на расчетных и спецсчетах , валютные средства, денежные документы.</p><p><strong>Цель</strong></p><p>: Мнение о достоверности и полноте раскрытия информации о ДС и соответствии операций законодательству.</p><p><strong>Задачи:</strong></p><p>1. Проверка</p><p>полного и объективного отражения операций с ДС.</p><p>2. Проверка</p><p>документального оформления по нормативным актам.</p><p>3. Проверка</p><p>целевого использования и сохранности .</p><p><strong>Нормативная база:</strong></p><p>ПБУ 23/2011 «Отчет о движении денежных средств».</p><p><strong>Источники информации:</strong></p><p>1. Учетная политика (в части ДС).</p><p>2. Бухгалтерская (финансовая) отчетность.</p><p>3. Главная книга.</p><p>4. Регистры по счетам 50 «Касса», 51 «Расчетные счета», 52 «Валютные счета», 55 «Специальные счета в банках», 57 «Переводы в пути».</p><p>5. Первичные документы (кассовые, банковские выписки, платежные поручения).</p><p>. Общая стратегия аудита денежных средств</p><p><strong>Основные этапы общей стратегии:</strong></p><p>1. Аудит операций по кассе (наличные деньги):</p><p>Поступление наличных денег:</p><p>· получение со счетов в банках (</p><p>Дт Кт 51);</p><p>· получение от покупателей (</p><p>Дт Кт 62);</p><p>· возврат неиспользованных подотчетных сумм (</p><p>Дт Кт 71);</p><p>· погашение выданных работникам ссуд (</p><p>Дт Кт</p><p>73.1);</p><p>· поступление вклада в уставный капитал (</p><p>Дт Кт</p><p>75.1);</p><p>· оприходование излишков наличных денег (</p><p>Дт Кт</p><p>91.1);</p><p>· поступление в погашение недостач (</p><p>Дт Кт</p><p>73.2).</p><p>Выплата наличных денег:</p><p>· сдача на счета в банках (</p><p>Дт Кт 50);</p><p>· выдача под авансовый отчет (</p><p>Дт Кт 50);</p><p>· выплата поставщикам (</p><p>Дт Кт 50);</p><p>· возврат денег покупателям (</p><p>Дт Кт 50);</p><p>· выдача ссуд работникам (</p><p>Дт</p><p>73.1</p><p>Кт 50);</p><p>· выдача заработной платы (</p><p>Дт Кт 50);</p><p>· выплата дивидендов (</p><p>Дт</p><p>75.2</p><p>Кт 50).</p><p>2. Аудит операций по расчетному счету (безналичные деньги):</p><p>Поступление на расчетный счет:</p><p>· сдача денег из кассы (</p><p>Дт Кт 50);</p><p>· оплата задолженности покупателями (</p><p>Дт Кт 62);</p><p>· возврат авансов поставщикам (</p><p>Дт Кт 60);</p><p>· получение займов и кредитов (</p><p>Дт Кт 66, 67);</p><p>· поступление вклада в уставный капитал (</p><p>Дт Кт</p><p>75.1).</p><p>Списание с расчетного счета:</p><p>· выдача денег в кассу (</p><p>Дт Кт 51);</p><p>· оплата поставщикам (</p><p>Дт Кт 51);</p><p>· перечисление налогов и сборов (</p><p>Дт Кт 51);</p><p>· выдача заработной платы (</p><p>Дт Кт 51);</p><p>· возврат кредитов и займов (</p><p>Дт 66, 67 Кт 51).</p><p>3. Оформление результатов аудита.</p><p>. План аудита денежных средств</p><p><strong>Основные аудиторские процедуры:</strong></p><p>1. Проверка</p><p>состава и наличия денежных средств:</p><p>· сверка показателей отчетности с данными регистров по счетам 50, 51, 52, 55, 57 и Главной книги.</p><p>2. Проверка инвентаризации</p><p>денежных средств:</p><p>· проверка соответствия времени проведения инвентаризации утвержденному плану;</p><p>· проверка частоты внезапных инвентаризаций;</p><p>· проверка наличия договора о полной материальной ответственности кассира;</p><p>· проверка обеспечения сохранности денежных средств в кассе;</p><p>· проверка правильности составления документов по результатам инвентаризации.</p><p>3. Нормативная и синтаксическая</p><p>проверка кассовых документов:</p><p>· подтверждение наличия первичных документов по кассовым операциям;</p><p>· проверка заполнения обязательных реквизитов;</p><p>· проверка законности кассовых операций.</p><p>4. Нормативная проверка</p><p>правильности отражения операций по кассе на счетах :</p><p>· установление соответствия рабочего плана счетов Инструкции по применению Плана счетов;</p><p>· прослеживание переноса данных из первичных документов в регистры учета;</p><p>· проверка правильности переноса остатков в отчетность.</p><p>5. Аудит операций по счетам в банках</p><p>:</p><p>· проверка законности совершения операций по банковским счетам;</p><p>· проверка наличия документов, подтверждающих операции;</p><p>· проверка правильности определения сумм по операциям в иностранной валюте;</p><p>· проверка полноты и своевременности отражения операций в учете.</p><p>6. Оформление результатов</p><p>аудита.</p>"

    "content": "<p><strong>Определение:</strong> Отношения с поставщиками (поставка имущества) и подрядчиками (выполнение работ, оказание услуг) закрепляются юридически договорами.</p><p><strong>Цель</strong></p><p>: Формирование мнения о достоверности и полноте отражения информации о расчетах с поставщиками и подрядчиками в БФО.</p><p><strong>Задачи:</strong></p><p>1. Проверка</p><p>правильности оформления первичных документов по приобретению ТМЦ и получению услуг.</p><p>2. Проверка</p><p>своевременности погашения и правильности отражения на счетах кредиторской задолженности .</p><p>3. Проверка</p><p>правильности оформления и отражения в учете предъявленных претензий .</p><p><strong>Источники информации:</strong></p><p>1. Учетная политика (в части учета расчетов с поставщиками и подрядчиками).</p><p>2. Бухгалтерская (финансовая) отчетность.</p><p>3. Главная книга.</p><p>4. Регистры по счетам 60 «Расчеты с поставщиками и подрядчиками», 63 «Резервы по сомнительным долгам».</p><p>5. Первичная документация — договоры, накладные, счета-фактуры, акты выполненных работ.</p><p><strong>Вопросы тестирования СВК:</strong></p><p>1. Организация договорной работы и оптимальность договорной политики.</p><p>2. Организация аналитического учета расчетов.</p><p>3. Соответствие положений УП нормам действующего законодательства.</p><p>4. Выполнение контрольных процедур для определения надежности контрагента.</p><p>5. Выполнение контрольных процедур для отслеживания выполнения договорных условий (соблюдение сроков оплаты, разрешение претензий).</p><p>6. Проведение инвентаризации состояния расчетов.</p><p>7. Проведение инвентаризации дебиторской задолженности для формирования резерва по сомнительным долгам.</p><p>. Общая стратегия аудита расчетов с поставщиками и подрядчиками</p><p><strong>Основные этапы общей стратегии:</strong></p><p>1. Аудит</p><p>возникновения расчетов с поставщиками и подрядчиками: Возникновение кредиторской задолженности :</p><p>· поступление ТМЦ с расчетными документами (</p><p>Дт 10, 41 Кт 60);</p><p>· поставки, под обеспечение которых выданы векселя (</p><p>Дт Кт</p><p>60.векселя выданные).</p><p>Возникновение дебиторской задолженности :</p><p>· выданные авансы (</p><p>Дт</p><p>60.2</p><p>Кт 51).</p><p>2. Аудит погашения задолженности:</p><p>Погашение кредиторской задолженности :</p><p>· наличными денежными средствами (</p><p>Дт Кт 50);</p><p>· безналичными денежными средствами (</p><p>Дт Кт 51);</p><p>· неденежными формами расчетов (</p><p>Дт Кт 62, 76);</p><p>· возврат ТМЦ поставщику (</p><p>Дт Кт 10, 41);</p><p>· выставление претензии (</p><p>Дт</p><p>76.2</p><p>Кт 60);</p><p>· списание кредиторской задолженности по истечении срока исковой давности (</p><p>Дт Кт</p><p>91.1).</p><p>Погашение дебиторской задолженности :</p><p>· зачет авансовых платежей (</p><p>Дт Кт</p><p>60.2);</p><p>· списание дебиторской задолженности (</p><p>Дт</p><p>91.2</p><p>Кт</p><p>60.2);</p><p>· возврат полученного аванса (</p><p>Дт</p><p>60.2</p><p>Кт 51).</p><p>3. Оформление результатов аудита.</p><p>. План аудита расчетов с поставщиками и подрядчиками</p><p><strong>Основные аудиторские процедуры:</strong></p><p>1. Проверка</p><p>состава и наличия задолженности:</p><p>· сверка показателей отчетности с данными регистров по счетам 60, 63 и Главной книги.</p><p>2. Нормативная</p><p>проверка правильности отражения задолженности в отчетности:</p><p>· подтверждение правильности отражения дебиторской и кредиторской задолженности в бухгалтерском балансе.</p><p>3. Подтверждение</p><p>реальности задолженности :</p><p>· встречная проверка (прослеживание) и нормативная проверка оснований возникновения задолженности;</p><p>· убедиться, что все операции проводились на основании договоров;</p><p>· сделать запросы контрагентам-должникам, по которым истекает срок исковой давности;</p><p>· убедиться в реальности поставок ТМЦ, работ, услуг.</p><p>4. Нормативная</p><p>проверка полноты УП в части учета расчетов:</p><p>· изучение субсчетов к счету 60 в рабочем плане счетов;</p><p>· изучение графика документооборота;</p><p>· проверка разработанных форм первичных документов.</p><p>5. Проверка</p><p>операций по возникновению задолженности :</p><p>· законность операций;</p><p>· правильность документального оформления;</p><p>· реальность суммы задолженности;</p><p>· полнота и своевременность отражения в учете.</p><p>6. Правовая</p><p>проверка договоров :</p><p>· наличие заключенных договоров;</p><p>· соответствие условий договора требованиям ГК РФ;</p><p>· наличие обязательных реквизитов.</p><p>7. Проверка операций</p><p>по погашению задолженности :</p><p>· соответствие формы погашения условиям договоров.</p><p>8. Нормативная</p><p>проверка инвентаризации расчетов и отражения ее результатов в учете.</p><p>9. Оформление результатов аудита.</p>"

    "content": "<p><strong>Цель</strong></p><p>: Формирование мнения о достоверности и полноте раскрытия информации в БФО о состоянии расчетов по оплате труда и социальному страхованию.</p><p><strong>Задачи</strong></p><p>:</p><p>1. Проверка</p><p>достоверности начислений и выплат работникам.</p><p>2. Проверка</p><p>законности и полноты удержаний из заработной платы.</p><p>3. Проверка</p><p>организации аналитического учета расчетов с персоналом.</p><p>4. Проверка</p><p>соблюдения налогового законодательства по операциям с оплатой труда.</p><p>5. Проверка</p><p>соблюдения законодательства по социальному страхованию .</p><p><strong>Источники информации:</strong></p><p>1. Учетная политика (в части учета расчетов по оплате труда).</p><p>2. Бухгалтерская (финансовая) отчетность.</p><p>3. Главная книга.</p><p>4. Регистры по счетам 69 «Расчеты по социальному страхованию и обеспечению», 70 «Расчеты с персоналом по оплате труда», 73 «Расчеты с персоналом по прочим операциям», 76 «Расчеты с разными дебиторами и кредиторами».</p><p>5. Первичные документы — табели учета рабочего времени, расчетные ведомости, больничные листы, исполнительные листы.</p><p><strong>Вопросы тестирования СВК:</strong></p><p>1. Организация оплаты труда (формы, системы, основания).</p><p>2. Система локального регулирования оплаты труда.</p><p>3. Организация аналитического учета расчетов.</p><p>4. Соответствие положений УП и локальных актов нормам законодательства.</p><p>5. Проведение контрольных процедур на соответствие нормам исчисления НДФЛ, страховых взносов.</p><p>6. Проведение инвентаризации расчетов с персоналом.</p><p>7. Применение компьютерной обработки экономической информации.</p><p>. Общая стратегия аудита расчетов по оплате труда</p><p><strong>Основные этапы общей стратегии:</strong></p><p>1. Аудит соблюдения требований ТК РФ:</p><p>· проверка наличия коллективного договора, положения об оплате труда, положения о премировании, правил внутреннего трудового распорядка, штатного расписания, трудовых договоров.</p><p>2. Аудит начислений оплаты труда:</p><p>· проверка начислений повременной и сдельной заработной платы (Дт 20, 23, 25, 26, 44 Кт 70);</p><p>· проверка начислений за работу в условиях, отклоняющихся от нормальных;</p><p>· проверка начислений гарантий и компенсаций;</p><p>· проверка резервирования средств на оплату труда (Дт 20, 23, 25, 26, 44 Кт 96).</p><p>. Аудит резерва на оплату отпусков.</p><p>4. Аудит удержаний из заработной платы:</p><p>· проверка обязательных удержаний (НДФЛ — Дт 70 Кт 68.НДФЛ);</p><p>· проверка удержаний по инициативе администрации (Дт 70 Кт 73.2);</p><p>· проверка удержаний по согласованию между работником и администрацией.</p><p>. Аудит операций по выплате заработной платы (денежная и натуральная форма):</p><p>· проверка выплаты наличными (Дт 70 Кт 50);</p><p>· проверка выплаты на банковские карты (Дт 70 Кт 51).</p><p>6. Аудит расчетов по социальному страхованию и обеспечению.</p><p>7. Аудит расчетов с персоналом по прочим операциям.</p><p>8. Оформление результатов аудита.</p><p>. План аудита расчетов по оплате труда</p><p><strong>Основные аудиторские процедуры:</strong></p><p>1. Аудит состава и среднесписочной численности персонала:</p><p>· Изучение штатного расписания и расстановки штатов.</p><p>· Проверка правильности расчета среднесписочной и средней численности работников (необходима для формата отчетности в ФНС, ЕРСВ, налога на прибыль, льгот).</p><p>2. Аудит соблюдения требований ТК РФ:</p><p>· Выборочный контроль расчетов с персоналом.</p><p>· Проверка документального оформления перемещений, командировок, сверхурочных.</p><p>· Проверка оформления трудовых отношений договорами гражданско-правового характера.</p><p>3. Аудит фонда оплаты труда:</p><p>· Проверка начислений (основная зарплата, премии, надбавки, доплаты).</p><p>· Установление выплат в локальных актах.</p><p>· Проверка начислений на базе среднего заработка.</p><p>4. Аудит резерва на оплату отпусков:</p><p>· Проверка нормы УП по методике расчета резерва.</p><p>· Проверка автоматического расчета в программе и документального отражения.</p><p>5. Аудит удержаний из заработной платы:</p><p>· Формирование совокупного дохода для НДФЛ.</p><p>· Проверка правомерности стандартных налоговых вычетов.</p><p>· Проверка состояния расчетов по НДФЛ (6-НДФЛ, аналитика по счету 68).</p><p>6. Аудит выплаты заработной платы:</p><p>· Проверка сроков и полноты выплаты.</p><p>7. Аудит расчетов по социальному страхованию:</p><p>· База для начисления страховых взносов — фонд оплаты труда.</p><p>· Разница между 6-НДФЛ и РСВ (выплаты, не облагаемые страховыми взносами: дарение, аренда, займы, материальная помощь).</p><p>8. Аудит расчетов с персоналом по прочим операциям:</p><p>· Проверка договоров займа (начисление процентов, НДФЛ с материальной выгоды).</p><p>· Проверка расчетов по возмещению материального ущерба (законность привлечения, договор о полной материальной ответственности, инвентаризация).</p><p>· Проверка расчетов за форменную одежду (источник финансирования, возмещение работником).</p>"

дтверждение, что расходы по обычным видам деятельности отвечают условиям признания;</p><p>· проверка правильности оценки и раскрытия в отчетности;</p><p>· установление законности отнесения расходов к обычным видам деятельности.</p><p>3. Аудит формирования прибыли от продаж:</p><p>· проверка достоверности прибыли по основным видам деятельности;</p><p>· арифметическая проверка правильности формирования прибыли от продаж (пересчет).</p><p>4. Аудит формирования прочих доходов и расходов:</p><p>· процедуры аналогичны аудиту доходов и расходов по обычным видам деятельности.</p><p>5. Аудит формирования чистой прибыли:</p><p>· проверка достоверности отражения финансового результата в отчетности.</p><p>6. Оформление результатов аудита.</p>"

    "title": "Задачи аудита бухгалтерской (финансовой) отчетности",
    "content": "<p><strong>Определение БФО:</strong> Единая система данных об имущественном и финансовом положении субъекта, о результатах его деятельности, составленная на основе данных БУ.</p><p><strong>Цель</strong></p><p>аудита: Выражение мнения о достоверности БФО аудируемого лица. Достоверность — степень точности данных, позволяющая пользователям делать правильные выводы и принимать обоснованные решения.</p><p><strong>Задачи аудита БФО:</strong></p><p>1. Получить</p><p>при проведении аудита независимую и достоверную исходную информацию о деятельности аудируемого лица.</p><p>2. Сформировать на основе полученных аудиторских доказательств выводы о достоверности БФО.</p><p>3. Изложить</p><p>в отдельном документе выявленные замечания и рекомендации по их исправлению.</p><p>4. Сформулировать аудиторское заключение</p><p>, соответствующее фактическому уровню достоверности проверенной отчетности.</p><p>5. Другие задачи, обозначенные в договоре и задании на аудит.</p><p><strong>Принципиальное отличие:</strong> Жесткая нормативная регламентация. Качество проверки оценивается степенью соблюдения требований МСА.</p><p>Классический аудиторский цикл: Комплекс мероприятий, которые аудиторская организация обязана осуществить с момента получения предложения на проведение проверки до даты представления аудиторского заключения. . Аудит достоверности бухгалтерского баланса</p><p><strong>Этапы проверки бухгалтерского баланса:</strong></p><p>1 этап: Установление тождественности показателей статей бухгалтерского баланса и сальдо по соответствующим счетам Главной книги.</p><p>· Аудитор должен располагать информацией о соответствии оборотов и остатков по синтетическим и аналитическим счетам, а также</p><p>подтверждении статей баланса результатами инвентаризации . 2 этап:</p><p><strong>Определение правильности оценки статей</strong></p><p>и составления бухгалтерского баланса в соответствии с нормативными документами и УП. При выявлении искажений:</p><p>· Аудитор</p><p>оценивает их влияние на достоверность баланса.</p><p>· Отражает информацию в рабочей документации и в аудиторском заключении.</p><p>. Аудит достоверности отчета о финансовых результатах</p><p><strong>Последовательность проверки:</strong></p><p>1. Проверка</p><p>достоверности информации по счетам, на основании которых заполняется отчет о финансовых результатах:</p><p>· Счет 90 «Продажи» — доходы и расходы по обычным видам деятельности.</p><p>· Счет 91 «Прочие доходы и расходы» — прочие доходы и расходы.</p><p>· Счет 99 «Прибыли и убытки» — финансовый результат до налогообложения.</p><p>2. Проверка правильности формирования каждой строки отчета о финансовых результатах.</p><p>. Аудит приложений к бухгалтерскому балансу и отчету о финансовых результатах</p><p><strong>В приложения входя</strong></p><p>т: Отчет о движении денежных средств , Отчет об изменениях капитала , пояснения . Задача аудитора:</p><p>·</p><p>Привлечь внимание пользователей отчетности к информации, содержащейся в пояснениях , касающейся проблемы, связанной с соблюдением принципа непрерывности деятельности или со значительной неопределенностью.</p><p>· Некоторые</p><p>дополнительные данные могут быть необходимы пользователям для реальной оценки финансового положения, финансовых результатов и изменений в финансовом положении . МСА 706 (пересмотренный) «Разделы «Важные обстоятельства» и «Прочие сведения» в аудиторском заключении»:</p><p>· Аудитор может</p><p>привлечь внимание пользователей к вопросам , которые представлены или раскрыты в отчетности и настолько важны, что имеют первостепенное значение для понимания отчетности пользователями.</p><p>· Аудитор может привлечь внимание пользователей к вопросам, которые</p><p>не представлены или не раскрыты в отчетности, но имеют значение для понимания пользователями процесса и результатов аудита , обязанностей аудитора или содержания аудиторского заключения. Типичные ошибки и нарушения (общие для всей отчетности)</p><p>1. Искажения в бухгалтерской (финансовой) отчетности вследствие недобросовестных действий или ошибок (МСА 240).</p><p>2. Неполное раскрытие информации в приложениях к отчетности.</p><p>3. Нарушение принципа непрерывности деятельности.</p><p>4. Отсутствие подтверждения статей отчетности результатами инвентаризации.</p><p>5. Несоответствие данных отчетности данным Главной книги и регистров учета.</p>"

    "content": "<p>. Аудит приложений к бухгалтерскому балансу и отчету о финансовых результатах</p><p><strong>В приложения входя</strong></p><p>т: Отчет о движении денежных средств , Отчет об изменениях капитала , пояснения . Задача аудитора:</p><p>·</p><p>Привлечь внимание пользователей отчетности к информации, содержащейся в пояснениях , касающейся проблемы, связанной с соблюдением принципа непрерывности деятельности или со значительной неопределенностью.</p><p>· Некоторые</p><p>дополнительные данные могут быть необходимы пользователям для реальной оценки финансового положения, финансовых результатов и изменений в финансовом положении . МСА 706 (пересмотренный) «Разделы «Важные обстоятельства» и «Прочие сведения» в аудиторском заключении»:</p><p>· Аудитор может</p><p>привлечь внимание пользователей к вопросам , которые представлены или раскрыты в отчетности и настолько важны, что имеют первостепенное значение для понимания отчетности пользователями.</p><p>· Аудитор может привлечь внимание пользователей к вопросам, которые</p><p>не представлены или не раскрыты в отчетности, но имеют значение для понимания пользователями процесса и результатов аудита , обязанностей аудитора или содержания аудиторского заключения. Типичные ошибки и нарушения (общие для всей отчетности)</p><p>1. Искажения в бухгалтерской (финансовой) отчетности вследствие недобросовестных действий или ошибок (МСА 240).</p><p>2. Неполное раскрытие информации в приложениях к отчетности.</p><p>3. Нарушение принципа непрерывности деятельности.</p><p>4. Отсутствие подтверждения статей отчетности результатами инвентаризации.</p><p>5. Несоответствие данных отчетности данным Главной книги и регистров учета.</p>"
  }
];;

        function escapeRegex(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        function highlightNode(node, query) {
            if (node.nodeType === Node.TEXT_NODE) {
                const regex = new RegExp(`(${escapeRegex(query)})`, "gi");
                const parts = node.textContent.split(regex);
                if (parts.length === 1) return;
                const fragment = document.createDocumentFragment();
                parts.forEach((part, index) => {
                    if (!part) return;
                    if (index % 2 === 0) {
                        fragment.appendChild(document.createTextNode(part));
                    } else {
                        const span = document.createElement("span");
                        span.className = "highlight";
                        span.textContent = part;
                        fragment.appendChild(span);
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                Array.from(node.childNodes).forEach(child => highlightNode(child, query));
            }
        }

        function highlightHtml(value, query) {
            if (!query) return value;
            const wrapper = document.createElement("div");
            wrapper.innerHTML = value;
            highlightNode(wrapper, query);
            return wrapper.innerHTML;
        }

        const listScreen = document.getElementById("listScreen");
        const readerScreen = document.getElementById("readerScreen");
        const searchBox = document.getElementById("searchBox");
        const searchPanel = document.getElementById("searchPanel");
        const searchToggle = document.getElementById("searchToggle");
        const fontPanel = document.getElementById("fontPanel");
        const fontToggle = document.getElementById("fontToggle");
        const fontDecrease = document.getElementById("fontDecrease");
        const fontIncrease = document.getElementById("fontIncrease");
        const fontScaleValue = document.getElementById("fontScaleValue");
        const FONT_SCALE_KEY = "ved-font-scale";
        const MIN_FONT_SCALE = 80;
        const MAX_FONT_SCALE = 140;
        const FONT_SCALE_STEP = 10;
        let listScrollPosition = 0;
        let fontScale = 100;

        function renderItems(items, query) {
            const container = document.getElementById("itemContainer");
            const noResults = document.getElementById("noResults");
            container.innerHTML = "";
            noResults.classList.toggle("hidden", items.length > 0);
            document.getElementById("resultCount").textContent = query
                ? `Найдено: ${items.length}`
                : `${questions.length} вопросов`;

            items.forEach(item => {
                const element = document.createElement("button");
                element.type = "button";
                element.className = "item";
                element.dataset.question = item.number;
                element.setAttribute("aria-label", `Открыть вопрос ${item.number}: ${item.title}`);
                element.innerHTML = `
                    <div class="item-header">Вопрос ${item.number}</div>
                    <div class="item-title">${highlightHtml(item.title, query)}</div>
                `;
                element.addEventListener("click", () => openQuestion(item.number));
                container.appendChild(element);
            });
            updateWatchFocus();
        }

        function searchItems() {
            const query = searchBox.value.trim().toLowerCase();
            const items = query
                ? questions.filter(item => item.number.toString().includes(query) || item.searchText.includes(query))
                : questions;
            renderItems(items, query);
        }

        function toggleSearch(forceOpen) {
            const shouldOpen = forceOpen ?? searchPanel.classList.contains("hidden");
            searchPanel.classList.toggle("hidden", !shouldOpen);
            searchToggle.setAttribute("aria-expanded", shouldOpen.toString());
            if (shouldOpen) searchBox.focus();
        }

        function setFontScale(value, persist = true) {
            const parsed = value === null || value === "" ? NaN : Number(value);
            fontScale = Number.isFinite(parsed)
                ? Math.min(MAX_FONT_SCALE, Math.max(MIN_FONT_SCALE, Math.round(parsed / FONT_SCALE_STEP) * FONT_SCALE_STEP))
                : 100;
            document.documentElement.style.setProperty("--font-scale", fontScale / 100);
            fontScaleValue.textContent = `${fontScale}%`;
            fontDecrease.disabled = fontScale === MIN_FONT_SCALE;
            fontIncrease.disabled = fontScale === MAX_FONT_SCALE;
            if (persist) {
                try {
                    localStorage.setItem(FONT_SCALE_KEY, fontScale.toString());
                } catch {}
            }
            updateWatchFocus();
        }

        function loadFontScale() {
            try {
                return localStorage.getItem(FONT_SCALE_KEY);
            } catch {
                return null;
            }
        }

        function changeFontScale(direction) {
            setFontScale(fontScale + direction * FONT_SCALE_STEP);
        }

        function toggleFontPanel(forceOpen) {
            const shouldOpen = forceOpen ?? fontPanel.classList.contains("hidden");
            fontPanel.classList.toggle("hidden", !shouldOpen);
            fontToggle.setAttribute("aria-expanded", shouldOpen.toString());
        }

        function addTableHints(container) {
            container.querySelectorAll(".table-scroll").forEach(table => {
                const hint = document.createElement("p");
                hint.className = "table-hint";
                hint.textContent = "Листайте таблицу влево →";
                table.before(hint);
            });
        }

        function openQuestion(number, updateHash = true) {
            const item = questions[number - 1];
            if (!item) return;
            if (!listScreen.classList.contains("hidden")) listScrollPosition = window.scrollY;
            document.getElementById("readerNumber").textContent = `Вопрос ${item.number} из ${questions.length}`;
            document.getElementById("readerTitle").textContent = item.title;
            const content = document.getElementById("readerContent");
            content.innerHTML = highlightHtml(item.content, searchBox.value.trim());
            addTableHints(content);
            document.getElementById("prevQuestion").disabled = item.number === 1;
            document.getElementById("nextQuestion").disabled = item.number === questions.length;
            document.getElementById("prevQuestion").dataset.question = item.number - 1;
            document.getElementById("nextQuestion").dataset.question = item.number + 1;
            listScreen.classList.add("hidden");
            readerScreen.classList.remove("hidden");
            document.body.dataset.screen = "reader";
            if (updateHash) history.pushState({ question: item.number }, "", `#question-${item.number}`);
            window.scrollTo(0, 0);
            updateReadingProgress();
        }

        function showList(updateHash = true) {
            readerScreen.classList.add("hidden");
            listScreen.classList.remove("hidden");
            document.body.dataset.screen = "list";
            if (updateHash) history.pushState({}, "", location.pathname + location.search);
            requestAnimationFrame(() => {
                window.scrollTo(0, listScrollPosition);
                updateWatchFocus();
            });
        }

        function routeFromHash() {
            const match = location.hash.match(/^#question-(\d+)$/);
            if (match) {
                openQuestion(Number(match[1]), false);
            } else {
                showList(false);
            }
        }

        function updateReadingProgress() {
            if (document.body.dataset.screen !== "reader") return;
            const scrollable = document.documentElement.scrollHeight - window.innerHeight;
            const progress = scrollable > 0 ? Math.min(100, window.scrollY / scrollable * 100) : 100;
            document.getElementById("progressBar").style.width = `${progress}%`;
        }

        function updateWatchFocus() {
            if (window.innerWidth > 480 || window.innerHeight > 480 || document.body.dataset.screen === "reader") return;
            const center = window.innerHeight / 2;
            let closest = null;
            let closestDistance = Infinity;
            document.querySelectorAll(".item").forEach(item => {
                item.classList.remove("watch-focus");
                const rect = item.getBoundingClientRect();
                const distance = Math.abs(rect.top + rect.height / 2 - center);
                if (distance < closestDistance) {
                    closest = item;
                    closestDistance = distance;
                }
            });
            if (closest) closest.classList.add("watch-focus");
        }

        questions.forEach(item => {
            const wrapper = document.createElement("div");
            wrapper.innerHTML = item.content;
            item.searchText = `${item.title} ${wrapper.textContent}`.toLowerCase();
        });

        searchToggle.addEventListener("click", () => toggleSearch());
        fontToggle.addEventListener("click", () => toggleFontPanel());
        fontDecrease.addEventListener("click", () => changeFontScale(-1));
        fontIncrease.addEventListener("click", () => changeFontScale(1));
        document.getElementById("fontReset").addEventListener("click", () => setFontScale(100));
        document.getElementById("searchClear").addEventListener("click", () => {
            searchBox.value = "";
            searchItems();
            searchBox.focus();
        });
        searchBox.addEventListener("input", searchItems);
        document.getElementById("readerBack").addEventListener("click", () => showList());
        document.getElementById("prevQuestion").addEventListener("click", event => openQuestion(Number(event.currentTarget.dataset.question)));
        document.getElementById("nextQuestion").addEventListener("click", event => openQuestion(Number(event.currentTarget.dataset.question)));
        window.addEventListener("scroll", () => {
            updateReadingProgress();
            updateWatchFocus();
        }, { passive: true });
        window.addEventListener("resize", updateWatchFocus);
        window.addEventListener("popstate", routeFromHash);

        setFontScale(loadFontScale(), false);
        document.body.dataset.screen = "list";
        renderItems(questions, "");
        routeFromHash();
    </script>
