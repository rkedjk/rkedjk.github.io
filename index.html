<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Зачет по БФО</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --bg: #000;
            --panel: #101114;
            --panel-active: #1b1d22;
            --line: #292c33;
            --muted: #a6abb6;
            --accent: #9ac7ff;
            --font-scale: 1;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            padding: 12px;
            background: var(--bg);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            font-size: calc(14px * var(--font-scale));
            line-height: 1.45;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding-bottom: 10px;
            background: linear-gradient(#000 82%, transparent);
        }

        h1 {
            padding: 4px 2px 10px;
            font-size: calc(17px * var(--font-scale));
            line-height: 1.25;
        }

        .compact-title {
            display: none;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 1px solid var(--line);
            color: #fff;
            background: var(--panel);
            cursor: pointer;
            touch-action: manipulation;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .toolbar,
        .reader-toolbar,
        .reader-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-button,
        .nav-button {
            min-width: 44px;
            min-height: 44px;
            padding: 8px 11px;
            border-radius: 22px;
            font-weight: 700;
        }

        .search-panel {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .font-panel {
            margin-top: 8px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--panel);
        }

        .font-controls {
            display: flex;
            gap: 7px;
            align-items: center;
            justify-content: center;
        }

        .scale-value {
            min-width: 58px;
            color: var(--accent);
            text-align: center;
            font-size: calc(14px * var(--font-scale));
            font-weight: 700;
        }

        .reset-button {
            min-height: 44px;
            padding: 7px 11px;
            border-radius: 22px;
            color: var(--muted);
            font-size: calc(12px * var(--font-scale));
            font-weight: 700;
        }

        .font-preview {
            margin-top: 9px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #090a0c;
        }

        .font-preview-label {
            color: var(--accent);
            font-size: calc(12px * var(--font-scale));
            font-weight: 700;
        }

        .font-preview-title {
            margin-top: 3px;
            font-size: calc(14px * var(--font-scale));
            font-weight: 700;
        }

        .font-preview-text {
            margin-top: 5px;
            color: var(--muted);
            font-size: calc(13px * var(--font-scale));
            line-height: 1.35;
        }

        .search-box {
            min-width: 0;
            width: 100%;
            min-height: 44px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--panel);
            color: #fff;
            font-size: calc(14px * var(--font-scale));
        }

        .result-count {
            padding: 0 4px 7px;
            color: var(--muted);
            font-size: calc(12px * var(--font-scale));
        }

        .item-list {
            padding-bottom: 16px;
        }

        .item {
            display: block;
            width: 100%;
            margin-bottom: 8px;
            padding: 13px 14px;
            border-radius: 18px;
            text-align: left;
            transition: background 160ms ease, border-color 160ms ease, opacity 160ms ease, transform 160ms ease;
        }

        .item:active {
            background: var(--panel-active);
        }

        .item-header {
            margin-bottom: 4px;
            color: var(--accent);
            font-size: calc(12px * var(--font-scale));
            font-weight: 600;
        }

        .item-title {
            font-size: calc(14px * var(--font-scale));
            font-weight: 600;
            line-height: 1.25;
        }

        .reader {
            max-width: 760px;
            margin: 0 auto;
        }

        .reader-toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 8px 0 12px;
            background: linear-gradient(#000 84%, transparent);
        }

        .reader-heading {
            min-width: 0;
            flex: 1;
        }

        .reader-number {
            color: var(--accent);
            font-size: calc(12px * var(--font-scale));
            font-weight: 700;
        }

        .reader-title {
            overflow: hidden;
            margin-top: 2px;
            font-size: calc(15px * var(--font-scale));
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .progress-track {
            position: sticky;
            top: 62px;
            z-index: 99;
            height: 3px;
            margin-bottom: 10px;
            border-radius: 3px;
            background: #20232a;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: var(--accent);
        }

        .reader-content {
            font-size: calc(15px * var(--font-scale));
            line-height: 1.58;
        }

        .reader-content p {
            margin: 10px 0;
        }

        .reader-nav {
            position: fixed;
            left: 50%;
            bottom: 12px;
            z-index: 110;
            justify-content: center;
            padding: 5px;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: rgba(16, 17, 20, 0.96);
            box-shadow: 0 4px 16px #000;
            transform: translateX(-50%);
        }

        .nav-button {
            min-width: 44px;
            color: var(--accent);
            white-space: nowrap;
        }

        .nav-button:disabled {
            visibility: hidden;
        }

        .reader-content {
            padding-bottom: 76px;
        }

        .table-scroll {
            position: relative;
            margin: 10px 0;
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: inset -18px 0 14px -14px var(--accent);
            -webkit-overflow-scrolling: touch;
        }

        .table-hint {
            display: none;
            margin: 4px 0;
            color: var(--accent);
            font-size: calc(11px * var(--font-scale));
        }

        table {
            width: 100%;
            min-width: 420px;
            border-collapse: collapse;
        }

        td {
            padding: 4px 6px;
            border: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        td p {
            margin: 0;
        }

        tr:first-child td {
            background: var(--panel-active);
            font-weight: 600;
        }

        .highlight {
            padding: 1px 2px;
            border-radius: 2px;
            background: #ffd600;
            color: #000;
            font-weight: 600;
        }

        .no-results {
            padding: 20px;
            text-align: center;
            font-size: calc(13px * var(--font-scale));
            opacity: 0.6;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) and (max-height: 480px) {
            body {
                padding: 7vh 4vw 9vh;
            }

            .header {
                margin: -4vh 0 0;
                padding: 0 0 8px;
            }

            .toolbar {
                justify-content: center;
            }

            h1 {
                padding: 0 3px 6px;
                font-size: calc(15px * var(--font-scale));
            }

            .full-title {
                display: none;
            }

            .compact-title {
                display: inline;
            }

            .item {
                min-height: 62px;
                margin-bottom: 7px;
                padding: 12px 14px;
                opacity: 0.82;
            }

            .item.watch-focus {
                border-color: #4b5d73;
                background: var(--panel-active);
                box-shadow: 0 0 0 1px rgba(154, 199, 255, 0.2);
                opacity: 1;
            }

            .item-header {
                font-size: calc(13px * var(--font-scale));
            }

            .item-title {
                font-size: calc(15px * var(--font-scale));
            }

            .reader {
                margin: -4vh 0 0;
            }

            .reader-toolbar {
                padding-top: 0;
            }

            .reader-content {
                padding: 0 1vw 78px;
                font-size: calc(16px * var(--font-scale));
                line-height: 1.58;
            }

            .reader-title {
                font-size: calc(14px * var(--font-scale));
            }

            .progress-track {
                top: 54px;
            }

            .table-hint {
                display: block;
            }

            table {
                min-width: 520px;
                font-size: calc(12px * var(--font-scale));
            }

            .icon-button,
            .nav-button {
                font-size: calc(14px * var(--font-scale));
            }

            .reader-nav {
                bottom: 5vh;
                gap: 5px;
            }

            .reader-nav .nav-button {
                min-width: 48px;
                min-height: 48px;
                padding: 7px 10px;
            }

            .reader-nav .list-button {
                min-width: 112px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .item {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main id="listScreen">
    <div class="header">
        <h1><span class="full-title">Управление рисками</span><span class="compact-title">Риски · 31 вопрос</span></h1>
        <div class="toolbar">
            <button class="icon-button" id="searchToggle" type="button" aria-expanded="false" aria-controls="searchPanel">Поиск</button>
            <button class="icon-button" id="fontToggle" type="button" aria-expanded="false" aria-controls="fontPanel" aria-label="Настроить размер текста">Aa</button>
        </div>
        <div class="search-panel hidden" id="searchPanel">
            <input type="search" class="search-box" id="searchBox" placeholder="Найти вопрос по рискам..." autocomplete="off">
            <button class="icon-button" id="searchClear" type="button" aria-label="Очистить поиск">×</button>
        </div>
        <div class="font-panel hidden" id="fontPanel">
            <div class="font-controls">
                <button class="icon-button" id="fontDecrease" type="button" aria-label="Уменьшить размер текста">−</button>
                <div class="scale-value" id="fontScaleValue" aria-live="polite">100%</div>
                <button class="icon-button" id="fontIncrease" type="button" aria-label="Увеличить размер текста">+</button>
                <button class="reset-button" id="fontReset" type="button" aria-label="Сбросить размер текста">100%</button>
            </div>
            <div class="font-preview">
                <div class="font-preview-label">Вопрос 1</div>
                <div class="font-preview-title">Появление и развитие категории «риск»</div>
                <div class="font-preview-text">Историю развития категории «риск» можно разделить на три этапа.</div>
            </div>
        </div>
    </div>

    <div class="result-count" id="resultCount"></div>
    <div class="item-list" id="itemContainer"></div>
    <div id="noResults" class="no-results hidden">Ничего не найдено</div>
    </main>

    <main class="reader hidden" id="readerScreen">
        <div class="reader-toolbar">
            <div class="reader-heading">
                <div class="reader-number" id="readerNumber"></div>
                <div class="reader-title" id="readerTitle"></div>
            </div>
        </div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        <article class="reader-content" id="readerContent"></article>
        <nav class="reader-nav" aria-label="Навигация между вопросами">
            <button class="nav-button" id="prevQuestion" type="button" aria-label="Предыдущий вопрос">←</button>
            <button class="nav-button list-button" id="readerBack" type="button">К списку</button>
            <button class="nav-button" id="nextQuestion" type="button" aria-label="Следующий вопрос">→</button>
        </nav>
    </main>

    <script>
        const questions = [{"number": 1, "title": "Появление и развитие категории «риск» в экономической науке", "content": "<p>Историю развития категории «риск» можно разделить на три этапа: 1. Донаучный этап - Термин «риск» упоминался Гомером как «опасность лавирования между скал». - В древности риск связывали со страхованием имущества: в Финикии за 3000 лет до н. э. заключали договоры о коллективной компенсации убытков при гибели судов; в «Законах Хаммурапи» закрепляли порядок возмещения убытков при нападении разбойников. - Первые попытки анализа вероятностей возникли в XIII веке — они были связаны с азартными играми. - В XVII веке Блез Паскаль и Пьер де Ферма заложили основы теории вероятностей для анализа риска (на примере деления выигрыша); в теории пока не учитывался субъективный фактор. - Адам Смит в работе «Исследование о природе и причинах богатства народов» сформулировал постулат о взаимосвязи доходности и риска: профессии с высоким уровнем риска гарантируют более высокую оплату, чем профессии с низким уровнем риска. Также на примере наёмных работников Смит показал, что при отсутствии гарантии трудоустройства они требуют повышения заработной платы. 2. Развитие и становление категории (вторая половина XIX — XX век) - Д. Бернулли заложил основы изучения поведения человека в условиях неопределённости. - В. Вебер и Г. Фехнер сформулировали «Закон Вебера—Фехнера»: выбор решений в условиях неопределённости зависит от субъективных оценок людей. - Иоганн фон Тюнен в работе «Изолированное государство» рассмотрел инновационные риски и пришёл к выводу, что вознаграждение предпринимателя — это доход за принятие рисков; также он отметил непредсказуемость предпринимательского риска и сложность (а порой невозможность) его страхования. - В 1921 году Фрэнк Найт в работе «Риск, неопределённость и прибыль» разделил ранее использовавшиеся как синонимы категории «риск» и «неопределённость»; он выделил «нестрахуемую неопределённость» как ключевой источник предпринимательского дохода и трактовал прибыль как плату за несение неопределённости. - В России в 1920‑х годах понятие «производственного риска» существовало в законодательстве, но в 1930‑х его стали относить к явлениям капиталистического хозяйства и исключили из словарей и энциклопедий. 3. Современный научный этап (середина XX века — настоящее время) - В последней трети ХХ века началась фаза «общества риска»: возникла потребность в механизмах адаптации человека к жизни в условиях неопределённости. - Разработана «теория перспектив» (Даниэль Канеман, Амос Тверски): она анализирует поведение людей при принятии решений, сопряжённых с рисками. Подход описывает, как потребители выбирают между исходами с известными вероятностями; каждый исход характеризуется не только вероятностью, но и субъективной ценностью для человека (она может быть положительной или отрицательной). - В рыночной экономике государство не несёт ответственности за обязательства организации — последствия риска ложатся на предпринимателя, поэтому теория риска остаётся практически востребованной и продолжает развиваться. - Сегодня управление риском — неотъемлемая часть системы управления любой организации.</p>"}, {"number": 2, "title": "Понятие риска, его основные элементы", "content": "<p>В экономической литературе нет единого подхода к определению риска. Например, Гражданский кодекс РФ (п. 2 ст. 947) определяет предпринимательский риск как риск убытков от предпринимательской деятельности. Риск — это возможность наступления как положительного, так и отрицательного события при влиянии различных факторов. Ситуация риска отличается от ситуации неопределенности тем, что в ней объективно существует возможность оценить вероятность событий. Ситуации риска сопутствуют три условия: 1) наличие неопределенности, 2) необходимость выбора альтернативы 3) возможность оценить вероятность осуществления выбираемых альтернатив. В явлении «риск» выделяют основные элементы, взаимосвязь которых составляет его сущность: возможность отклонения от предполагаемой цели, ради которой осуществлялась выбранная альтернатива; вероятность достижения желаемого результата; отсутствие уверенности в достижении поставленной цели; возможность материальных, нравственных и других потерь, связанных с осуществлением выбранной альтернативы. Также риску присущи три основные черты: 1) противоречивость — риск одновременно ориентирован на получение общественно значимых результатов новыми способами, но при этом объективные рискованные действия могут субъективно оцениваться разными людьми по-разному; 2) альтернативность — необходимость выбора из двух или нескольких возможных вариантов (где нет выбора, там нет риска); 3) неопределенность — неоднородность условий по форме проявления и содержанию.</p>"}, {"number": 3, "title": "Причины возникновения экономического риска", "content": "<p>Существование риска непосредственно связано с наличием неопределенности. В современной науке преобладает версия о субъективно-объективной природе риска. Субъективная сторона проявляется в том, что риск связан с выбором альтернатив и расчетом вероятностей их исхода, а также в том, что люди неодинаково воспринимают одну и ту же величину риска из-за психологических, нравственных и идеологических различий. Объективная сторона обусловлена тем, что риск отражает реально существующие в жизни явления и процессы независимо от того, осознают их наличие или нет. Основные источники (причины) неопределенности и, соответственно, риска: Спонтанность природных процессов и явлений, стихийные бедствия. Случайность — вероятностная сущность социально-экономических и технологических процессов. Наличие противоборствующих тенденций — от войн и межнациональных конфликтов до конкуренции и простого несовпадения интересов. Вероятностный характер НТП — последствия научных открытий и технических изобретений практически невозможно предвидеть во всей полноте, технический прогресс неосуществим без риска. Неполнота, недостаточность информации об объекте, ограниченность возможностей человека в сборе и переработке информации. Дополнительные источники: ограниченность материальных, финансовых и трудовых ресурсов; невозможность однозначного познания объекта при существующем уровне науки; относительная ограниченность сознательной деятельности человека, различия в установках, оценках и стереотипах поведения. Элементы риска и неопределенности также вносят необходимость выбора новых инструментов воздействия на экономику при переходе к интенсивным методам развития и несбалансированность основных компонентов хозяйственного механизма (планирования, ценообразования, снабжения, финансово-кредитных отношений).</p>"}, {"number": 4, "title": "Риск в предпринимательской деятельности", "content": "<p>Риск — неотъемлемая составляющая предпринимательской деятельности. Согласно ст. 2 ГК РФ, предпринимательская деятельность — это самостоятельная, осуществляемая на свой риск деятельность, направленная на систематическое получение прибыли. Из этого определения следует, что риск — это возможность получения прибыли, однако на практике риск чаще связывают с нежелательными событиями и убытками. Факторы риска могут оказывать на бизнес различное влияние: один и тот же фактор в одних организациях приводит к прибыли, в других — к убытку. Яркий пример — пандемия коронавирусной инфекции 2020 года. Она стала негативным фактором для многих субъектов МСП (транспорт, культура, спорт, туризм, гостиничный бизнес, общественное питание, сфера бытовых услуг и др. — перечень утвержден Постановлением Правительства РФ № 434), но в то же время оказала положительное влияние на фармакологические компании, сервисы онлайн-доставки, строительную и сельскохозяйственную отрасли. Можно ввести дополнительный классификационный признак — «по степени прогноза»: прогнозируемый риск — позволяет с большой вероятностью определить влияние факторов и их последствия; условно-прогнозируемый — позволяет определить влияние с малой или средней вероятностью; непрогнозируемый — не позволяет определить влияние факторов и последствия (пример — пандемия). Именно непрогнозируемый риск несет наибольшую опасность, так как к нему невозможно заблаговременно подготовить резервы ни на уровне бизнеса, ни на уровне государства. Поэтому государство при устранении последствий таких рисков направляет ресурсы в первую очередь на поддержку МСП, поскольку они создают рабочие места, выступают источником налогов и способствуют формированию среднего класса.</p><p>Дополнительно из Алисы: По сфере возникновения риски делят на: Внешние — на них невозможно повлиять. Например, изменения в законодательстве, геополитические факторы, природные или техногенные катастрофы, экономические кризисы, санкции. Внутренние — в определённой мере поддаются контролю. К ним относятся стратегия управления бизнесом, квалификация сотрудников, организация производственных процессов, маркетинг, финансовые решения. По временным факторам риски бывают: Кратковременные — длятся ограниченный период (например, риск неуплаты по договору с контрагентом). Долговременные — отличаются постоянным характером (например, риск природных катастроф в определённых географических зонах). Управление рисками Эффективное управление рисками — обязательное условие успешной организации бизнеса. Некоторые методы: Идентификация и анализ рисков — выявление возможных угроз, оценка их вероятности и степени влияния на бизнес. Минимизация (снижение) — разработка мер для уменьшения вероятности или последствий риска (например, регулярное техническое обслуживание оборудования). Передача — перенос ответственности за риск на третью сторону, например через страхование. Принятие — сознательное решение ничего не предпринимать, если затраты на управление риском превышают потенциальный ущерб. Избегание (отказ) — отказ от деятельности, которая несёт за собой неприемлемо высокий риск. Диверсификация — распределение ресурсов между разными активами, проектами, рынками и т. д.. Создание резервов — формирование собственных страховых фондов или резервных фондов денежных средств. Прогнозирование и мониторинг — непрерывная оценка рынка и потенциальных угроз. Страхование — один из распространённых способов передачи риска. По договору страхования предпринимательского риска может быть застрахован риск только самого страхователя и только в его пользу.</p>"}, {"number": 5, "title": "Общие принципы классификации рисков", "content": "<p>В процессе деятельности субъекты хозяйствования сталкиваются с совокупностью различных видов рисков. Как правило, все виды рисков взаимосвязаны и оказывают влияние на деятельность предприятия. Эти обстоятельства затрудняют принятие решение по оптимизации риска и требуют углубленного анализа состава конкретных рисков. Существует множество подходов к классификации рисков, которые определяются целями и задачами классификации. Можно выделить следующие виды рисков. По времени возникновения: ретроспективные, текущие, перспективные. По характеру последствий: чистые и спекулятивные. Чистые риски практически всегда несут в себе потери или нулевой результат. Спекулятивные риски характеризуются тем, что могут нести в себе как потери, так и дополнительную прибыль по отношению к ожидаемому результату. По источникам возникновения: риск, связанный с хозяйственной деятельностью; риск, связанный с личностью предпринимателя; риск, связанный с недостатком информации о состоянии внешней среды. По сфере возникновения: внешние и внутренние. Внешние – риски непосредственно не связанные с деятельностью предприятия, их источник – внешняя среда предприятия. Внутренние – риски, источником которых является само предприятие. По уровню принятия решений: глобальны (макроэкономический) и локальный (на уровне отдельных субъектов хозяйствования). По сфере деятельности: производственный, коммерческий, финансовый. Производственный риск связан с возможностью невыполнения планов предприятия по производственной деятельности, в результате неблагоприятного воздействия внешней среды, а также неадекватного использования производственных ресурсов. Коммерческий риск возникает в процессе реализации товаров, работ и услуг, как произведенных, так и закупленных. Финансовый риск связан с потерей или дополнительным получением дохода, обусловлен финансовой деятельностью предприятия. По возможности страхования: страхуемые риски и нестрахуемые риски. По проявлению во времени: постоянный риск, временный риск. Можно ввести дополнительный классификационный признак — «по степени прогноза»: прогнозируемый риск — позволяет с большой вероятностью определить влияние факторов и их последствия; условно-прогнозируемый — позволяет определить влияние с малой или средней вероятностью; непрогнозируемый — не позволяет определить влияние факторов и последствия (пример — пандемия).</p>"}, {"number": 6, "title": "Существующие подходы к классификации рисков", "content": "<p>Существует два основных принципа построения классификации рисков. 1) Построение классификации по конкретному содержанию каждого типа и вида рисков. Такая классификация является предметной. В предметных классификациях выделяют риски финансовые, производственные, инновационные и т.д. На общей предметной классификации обычно строятся детальные классификации рисков (специфические классификации), которые используются для управления рисками в определенных сферах хозяйственной деятельности: в страховании, банковской и биржевой деятельности, строительстве и т.д. В предметной классификации в зависимости от характера ожидаемого результата риски подразделяются на две основные группы: чистые и спекулятивные. В каждой группе, с учетом взаимосвязей рисков, идет дальнейшее дробление на группы, виды, разновидности. Предметная классификация необходима, прежде всего, на этапе идентификации рисков, поскольку она представляет широкий перечень рисков и дает основу для характеристики их возможных последствий (по характеру последствий, в зависимости от основной причины возникновения, по сфере возникновения и т.п.). Чистые риски практически всегда несут в себе потери для предпринимательской деятельности. Спекулятивные риски (динамические или коммерческие) – несут в себе либо потери, либо дополнительную прибыль для предпринимателя. Пример рисков по предметной классификации: финансовые риски (неплатёж контрагента, волатильность рынка), производственные (сбои оборудования, брак), инновационные (неудачный запуск нового продукта), экологические (загрязнение среды), политические (изменения в законодательстве, санкции). Однако, в предметной классификации, с какой бы степенью детализации она ни была составлена, невозможно выделить и охарактеризовать все существующие и потенциальные виды рисков, она не дает ориентиров в отношении выбора общего подхода и метода управления рисками. В связи с этим и возникает необходимость в использовании второго принципа классификации. 2) Разделение рисков на группы для целей управления рисками не по конкретному содержанию, а по источнику и этапу возникновения, возможности управления риском с помощью того или иного способа. Классификацию, составленную по данному принципу, можно назвать управленческой (в зависимости от этапа коммерческой деятельности, по масштабам, по роду опасности, по времени и т.п.). Управленческая классификация рисков используется, прежде всего, при выборе общей стратегии управления рисками, на этапе анализа рисков для оценки возможности воздействия на тот или иной риск на конкретном уровне управления, и, в наибольшей степени, на этапе анализа и выбора и конкретных способов управления рисками. Потребность в обеих классификациях столь же очевидна, как и необходимость разносторонности в раскрытии сущности риска, что обусловлено многоаспектностью самой категории риска и логикой управления рисками. Пример: по источнику — внешние (макроэкономические факторы, действия регуляторов) и внутренние (ошибки менеджмента, сбои процессов); по этапу — риски на стадии планирования, реализации, мониторинга; по возможности воздействия — управляемые (можно снизить вероятность или последствия) и неуправляемые (не зависят от действий компании); по масштабу — систематические (влияют на рынок в целом, диверсифицировать нельзя) и несистематические (специфичны для конкретного бизнеса, их можно нивелировать).</p>"}, {"number": 7, "title": "Характеристика рисков в различных сферах деятельности", "content": "<p>Внешние риски: 1. Страновой риск. Страновые риски непосредственно связаны с международной предпринимательской деятельностью. Они актуальны для всех участников внешнеэкономической деятельности и зависят от политико-экономической стабильности стран - импортеров, экспортеров. Причинами странового риска могут быть нестабильность государственной власти, особенности государственного устройства и законодательства, неэффективная экономическая политика, проводимая правительством, этнические и региональные проблемы, резкая поляризация интересов различных социальных групп и т.п. На результаты предпринимательской деятельности могут оказывать влияние проводимые государством торговое и валютное регулирование, квотирование, лицензирование, изменение таможенных пошлин и многое другое. В настоящее время существует ряд организаций, которые на основе систематизированных и четко нормируемых принципов, приемов и операций (методик) регулярно анализируют уровень странового риска. 2. Валютный риск состоит в возможности финансовых потерь субъектов валютного рынка в результате долгосрочных и краткосрочных колебаний валютных курсов, которые зависят от спроса и предложения на валюту на национальных и международных валютных рынках. Экспортёр несёт убытки при падении курса валюты платежа (получает меньше национальных денег), импортёр — при повышении курса (тратит больше на покупку валюты). Относится к спекулятивным рискам: проигрыш одной стороны оборачивается выигрышем другой. Удешевление национальной валюты стимулирует экспорт и сдерживает импорт, подорожание — наоборот. 3. Налоговый риск состоит в возможности финансовых потерь в результате изменения налоговой политики (появление новых налогов, ликвидация или сокращение налоговых льгот и т.п.), а также изменения величины налоговых ставок. Налоговые риски следует рассматривать с двух позиций - предпринимателя и государства.  Налоговый риск предпринимателя состоит в возможном появлении дополнительных расходов, а государства - в возможном сокращении поступлений в бюджет в результате изменения налоговой политики и величины налоговых ставок. 4. Риск форс-мажорных обстоятельств— обстоятельства непреодолимой силы (стихийные бедствия, войны, революции, забастовки), которые нельзя предотвратить или устранить. При их наступлении стороны освобождаются от ответственности по контрактам (ст. 79 Конвенции ООН о договорах купли-продажи). Потери возмещаются через страхование в специализированных компаниях. Внутренние риски: 1. Организационный риск обусловлен недостатками в организации работы. Включает ошибки планирования и проектирования, слабую координацию, неправильную стратегию снабжения, ошибки в подборе кадров. В сфере маркетинга — неправильный выбор продукции и рынка сбыта, неверное определение ёмкости рынка, ошибочная ценовая политика, ведущая к затовариванию. Результат: непроизводительные потери, дополнительные затраты, снижение прибыли. 2. Ресурсный риск состоит в возможности появления потерь в результате отсутствия запаса прочности по ресурсам в случае изменения ситуации, в которой осуществляется предпринимательская деятельность (изменение оплаты труда, изменения пошлин и налогов, хищения, повышенный брак, порча товаров и материалов, срывы поставок, изменение требований к ведению предпринимательской деятельности и др.). Под влиянием этих изменений может возникнуть: - нехватка финансовых средств; - нехватка рабочей силы; - нехватка материалов и продукции и т.п. 3. Портфельный риск — вероятность потерь по отдельным видам ценных бумаг и по всей категории ссуд. Возникает при инвестировании свободных средств. Снижается диверсификацией: вложение капитала в акции нескольких компаний уменьшает зависимость от колебаний курса каждой отдельной бумаги, так как разнонаправленные колебания взаимопогашаются. 4. Кредитный риск (риск невозврата долга) — неуплата заёмщиком основного долга и процентов в установленные сроки. Причины: недобросовестность заёмщика (намеренное банкротство, уклонение от обязательств, в том числе легальными способами) либо недостаточность обеспечения, когда расчёты заёмщика на доход не оправдались. 5. Инновационный риск связан с финансированием и применением научно-технических новшеств. Поскольку затраты и результаты научно-технического прогресса растянуты и отдалены во времени, они могут быть предвидены лишь в некоторых, обычно широких пределах. Инновационный риск состоит в возможности потерь, возникающих при финансировании хозяйствующим субъектом разработки новой техники и технологий, разработки новых товаров и услуг, а также других инноваций, которые не найдут предполагаемого спроса на рынке и не принесут ожидаемого эффекта. Инновационный риск воспринимается как объективная и неизбежная реальность.</p>"}, {"number": 8, "title": "Раскрытие содержания видов рисков", "content": "<p>По характеру последствий Чистые риски. Здесь возможен только отрицательный или нулевой результат — потери. Примеры: стихийные бедствия (землетрясение, наводнение), экологические катастрофы, несчастные случаи, недееспособность организации Спекулятивные риски. В этом случае есть шанс не только потерять, но и получить дополнительную прибыль. К ним относят, например, изменение рыночной конъюнктуры, колебания валютных курсов, налоговые изменения. По источнику возникновения Внешние риски. Возникают вне компании, их нельзя напрямую предотвратить действиями организации. Сюда относят экономические (инфляция, изменение ставок), политические (смена власти, санкции, национализация), рыночные (падение спроса, появление новых конкурентов) факторы. Внутренние риски. Их источник — сама организация: ошибки менеджмента, проблемы в процессах, квалификация персонала, сбои в технологиях. Примеры: ошибки в анализе спроса, выход оборудования из строя, утечка данных из-за слабой защиты. По сфере проявления (функциональные области) Производственные риски. Связаны с процессом создания продукции или услуг: остановка производства из-за поломки оборудования, брак, неэффективное использование ресурсов, внедрение новых технологий. Коммерческие риски. Возникают в процессе реализации товаров и услуг: задержка платежей, отказ покупателя от оплаты, недопоставка товара, рост закупочных цен. Финансовые риски. Обусловлены вероятностью потерь денежных ресурсов. Внутри этой группы выделяют: риски, связанные с покупательной способностью денег (инфляционный — обесценивание доходов, дефляционный — падение цен и доходов, валютный — потери при конвертации, риск ликвидности — невозможность быстро продать актив без потерь); инвестиционные риски (риск упущенной выгоды, снижения доходности, прямых финансовых потерь). Транспортные риски. Связаны с перевозкой грузов: повреждение, потеря, задержка доставки. Информационные риски. Возникают из-за неполной, недостоверной или искажённой информации, а также из-за сбоев в информационных системах, кибератак. Инновационные риски. Появляются при разработке и внедрении новых продуктов, технологий или бизнес-моделей: проект может не окупиться, технология окажется неэффективной. Репутационные риски. Связаны с реакцией общества: скандалы, негативные публикации в СМИ, ошибки в коммуникации могут серьёзно навредить имиджу компании Юридические риски. Возникают из-за несоблюдения законодательства: ошибки в документации, изменение законов в ходе сделки, споры с контрагентами. По масштабу воздействия Макрориски. Глобальные, влияют на всю экономику или большую группу компаний (экономический кризис, системный банковский кризис). Мезориски. Затрагивают определённый регион или отрасль. Микрориски. Влияют на деятельность конкретной организации или проекта.</p>"}, {"number": 9, "title": "Основные принципы управления риском", "content": "<p>Управление риском (риск‑менеджмент) — механизм, позволяющий наилучшим способом учитывать риск при принятии и реализации хозяйственных решений с точки зрения целей предпринимателя. Управление риском, как система, состоит из двух подсистем: управляемой подсистемы (объекта управления) и управляющей подсистемы (субъекта управления): объект управления — риск, рисковые вложения капитала и экономические отношения между хозяйствующими субъектами (предпринимателями‑партнёрами, конкурентами, заёмщиком и кредиторами, страхователем и страховщиком и т. п.); субъект управления — группа людей (предприниматель, финансовый менеджер, менеджер по риску, специалисты по страхованию и др.), воздействующая на объект управления. Главная задача предпринимателя — найти оптимальное сочетание риска и дохода: чем прибыльнее проект, тем выше степень риска. Управление риском в ряде случаев стало выступать в качестве самостоятельного вида профессиональной деятельности. Этот вид деятельности выполняют профессиональные институты специалистов, страховые компании, а также финансовые менеджеры, менеджеры по риску, специалисты по страхованию. Главные задачи специалистов по риску: обнаружение областей повышенного риска; оценка степени риска; анализ приемлемости уровня риска для организации; разработка мер по предупреждению или снижению риска; возмещение ущерба в случае наступления рискового события. Основные принципы управления риском: 1) Нельзя рисковать больше, чем это может позволить собственный капитал. Перед принятием решения нужно: определить максимально возможный объём убытков в случае рискового события; сопоставить его с объёмом вкладываемого капитала и всеми финансовыми ресурсами; оценить риск банкротства предприятия. 2) Необходимо думать о последствиях риска. Зная максимально возможную величину убытка, нужно: оценить вероятность риска; принять решение о принятии риска, его передаче (страховании) или отказе от мероприятия. 3) Нельзя рисковать многим ради малого. Перед внедрением рискового мероприятия нужно: соизмерить ожидаемый результат с возможными потерями; оценить соотношение сокращения убытков и дополнительных затрат на снижение или передачу риска. Приёмы управления риском (средства разрешения рисков): Избежание риска — отказ от реализации проекта, если потери или затраты на снижение/передачу риска неприемлемы, либо потери значительно превышают ожидаемую прибыль. Позволяет избежать потерь, но может привести к упущенной выгоде и возникновению других рисков. Снижение степени риска — уменьшение вероятности и объёма потерь. Включает разные способы в зависимости от вида риска и деятельности. Частный случай — передача риска (полностью или частично), например страховой компании. Принятие риска — оставление всего или части риска на ответственности предпринимателя с покрытием возможных потерь собственными средствами. Конечная цель управления риском — получение наибольшей прибыли при оптимальном соотношении прибыли и риска, соответствующем целевой функции предпринимательства.</p>"}, {"number": 10, "title": "Процесс управления риском (основные этапы)", "content": "<p>Управление риском рассматривается как часть общего управления бизнесом для достижения конкретного результата. Процесс управления рисками включает в себя следующие этапы: 1. Идентификация и анализ риска. Под идентификацией риска понимается выявление риска, их специфики, обусловленной природой и другими характерными чертами риска, выделение особенностей их реализации, определение возможности изменения рисков во времени. Анализ рисков подразумевает определение следующих моментов: - источников неопределенностей риска - последствия реализации риска - численное определение риска - возможное влияние рисков друг на друга (например, валютный оказывает на коммерческий). На данном этапе прежде всего создается информационная база для реализации дальнейшего процесса управления рисками. 2. Анализ альтернатив управления риском. На данном этапе анализируется возможность снижения риска и потерь в случае наступления рисковой ситуации, а также определяются возможные источники покрытия ущерба, связанного с риском. 3. Выбор методов управления рисками. На данном этапе формируется политика, направленная на снижение степени неопределенности в введении финансово-хозяйственной деятельности организации. Выбор метода управления рисками сводится к расчету экономико-математической модели, где критериями и ограничениями выступают экономические и вероятностные характеристики риска. Результатом данного этапа является программа управления рисками в организации. 4. Реализация выбранного метода управления риском. На данном этапе определяется: - конкретное мероприятие, которое необходимо реализовать - сроки реализации мероприятия - источники и состав ресурсов, необходимых для реализации мероприятия - определение ответственных лиц/исполнителей 5. Мониторинг результатов и совершенствование системы управления рисками Основная задача данного этапа заключается в определении общей эффективности функционирования системы управления рисками. Вторая основная задача – поиск проблем и их решений, которые могут повысить эффективность работы данной системы. Кроме того, на данном этапе происходит пополнение информационной базы о рисках.</p>"}, {"number": 11, "title": "Количественные и качественные методы оценки риска", "content": "<p>Качественный анализ представляет собой классификацию риска по различным признакам, определение причин возникновения риска и определение мер по минимизации негативных последствий событий, связанных с риском. К числу основных задач качественного подхода относят: Качественный анализ предполагает: -идентификацию рисков; - определение потенциальных зон риска; - выявление практических выгод и возможных негативных последствий, которые могут наступить при реализации, содержащего риск; - решения, выявление источников и причин рисков. Результаты качественного анализа служат важной исходной информацией для осуществления количественного анализа. Факторы, влияющие на рост степени риска можно условно разделить на объективные и субъективные. - Объективные факторы непосредственно не зависят от самого проекта (инфляция, уровень конкуренции, политические и экономические кризис, налоги и т.п.) - Субъективные факторы непосредственно характеризуют конкретный проект или организацию (производственный потенциал, уровень производительности, проводимая финансовая политика и т.п.) Количественная оценка помогает выделить наиболее вероятные и весомые по величине потерь риски — они становятся объектом дальнейшего анализа для принятия решения о целесообразности реализации проекта. Распространённые методы количественной оценки: Статистический метод: изучается статистика потерь и прибылей на данном или аналогичном производстве, устанавливается величина и частотность экономических результатов, составляется прогноз на будущее. Метод требует значительного массива данных; его достоверность приемлема при сохранении тенденций развития системы и её внешней среды. Метод экспертных оценок: количественные оценки риска получают на основании обработки мнений опытных специалистов. Эффективен в сложных неформализуемых ситуациях при неполноте и недостоверности информации. Недостатки — отсутствие гарантий достоверности оценок, трудности в проведении опроса и обработке данных. Достоверность можно повысить за счёт отбора экспертов по критериям и применения количественных методов обработки мнений. Количественный анализ предполагает: - численное определение рисков проекта в целом и отдельных рисков; - определение численного значения вероятности наступления рисковых событий и их последствий; - осуществление количественной оценки уровня риска; - определение допустимого в конкретной обстановке уровня риска и ущерба от него.</p>"}, {"number": 12, "title": "Характеристика экспертных процедур", "content": "<p>В практической деятельности применяют три вида экспертных процедур: 1. Открытое обсуждение поставленных вопросов; Опыт показал, что традиционные методы обсуждения вопросов, поставленных перед группой экспертов не всегда обеспечивают эффективное достижение цели — достоверность полученных оценок. У этого метода есть недостатки: влиятельные и напористые участники могут давить на остальных;  нежелание участников обсуждения отказываться от точек зрения, ранее высказанных публично. 2. Свободное высказывание без обсуждения и голосования (метод мозговой атаки); Предусматривает отсутствие любого вида критики, препятствующей формулировке идей, свободную интерпретацию идей в рамках поставленной проблемы. Такой метод обсуждения получил названия метода коллективной генерации идей (по американской терминологии — метод «мозговой атаки»). Он направлен на получение большого количества идей, в т.ч. и от лиц, которые, обладая достаточно высокой степенью эрудиции, обычно воздерживаются от высказываний. Процесс выдвижения идей протекает в определенном смысле лавинообразно: высказываемая одним из членов группы идея порождает творческую реакцию у других. С помощью этого метода может успешно решаться ряд задач управления риском: – выявление источников и причин риска, установление всех возможных рисков; – выбор направлений и путей снижение риска; – формирование полного набора и качественная оценка вариантов, использующих различные способы снижения риска или их комбинацию и др. 3. Закрытое обсуждение с последующим закрытым голосованием или заполнением анкет. Характеризуется анонимностью выводов членов экспертной группы и управляемой обратной связью. Метод предусматривает проведение нескольких туров опросов. Во время каждого тура эксперты сообщают свое мнение и дают оценку исследуемым явлениям. Экспертов, чьи оценки попадают в крайние интервалы просят анонимно обосновать свое мнение по поводу назначения ими оценок. С их обоснованием знакомят остальных экспертов. Эксперты уточняют свою оценку и во втором туре опять заполняют анкету с оценками. Т.о. через несколько туров несовпадение в оценках станет незначительным. Затем фиксируются расходящиеся точки зрения, и принимается решение.</p>"}, {"number": 13, "title": "Общая схема экспертизы", "content": "<p>Экспертные оценки — общий научный метод анализа сложных неформализированных проблем. Сущность метода — в рациональной организации экспертного анализа с количественной оценкой суждений и обработкой результатов; обобщённый вывод экспертов считается решением проблемы. Все задачи, решаемые с помощью экспертизы, сводятся к трём типам: 1) формирование объектов — определение событий и явлений, построение гипотез, формулировка целей, ограничений, вариантов решений, признаков и показателей и т. п.; 2) оценка характеристик — определение экспертами вероятности событий, важности целей, значений показателей, преимуществ решений; 3) формирование объектов и оценка их характеристик — комплексное решение первых двух типов: эксперт выступает и как генератор идей/решений, и как измеритель их характеристик. Решаемые проблемы делят на два класса: с достаточным информационным потенциалом: эксперты — точные источники и измерители информации; обобщённые выводы получают усреднением индивидуальных суждений, они близки к истине; с недостаточным информационным потенциалом: обработка результатов не может базироваться на методах усреднения. Достоверность оценок зависит от уровня знаний отдельных экспертов и их количества: при условии, что эксперты — достаточно точные измерители, рост их числа повышает общую достоверность экспертизы. При этом затраты (временные и финансовые) на экспертизу пропорциональны количеству экспертов: повышение достоверности связано с увеличением затрат. Характеристики группы экспертов определяются на базе индивидуальных характеристик экспертов: компетентность — степень квалификации в отрасли знаний; для количественной оценки используют коэффициент компетентности; креативность — способность решать творческие задачи (оценивается через суждения о способностях эксперта); конформизм — учёт влияния авторитетов; особенно заметен в открытых дискуссиях: мнение авторитетов может подавлять личную позицию экспертов с высокой степенью конформизма; отношение к экспертизе (негативное, пассивное, позитивное) существенно влияет на выполнение функций; участие следует рассматривать как плановую и обязательную работу; конструктивность мышления — прагматический аспект: предложения должны быть практичными и учитывать реальные возможности; коллективизм — важен при открытых дискуссиях (этика поведения, психологический климат и т. д.); самокритичность — проявляется при оценке собственной компетенции и при принятии решений по проблеме. Этапы и формы опроса экспертов Основной этап работы группы управления и экспертов включает: постановку организационно‑методических вопросов; постановку задачи и формулировку вопросов к экспертам; информационное обеспечение работы экспертов. Формы опроса: - анкетирование — письменный опрос с помощью анкет; - интервьюирование — устный опрос в форме беседы; вопросы разрабатывают специально, ответы должны быть быстрыми, время на обдумывание не дают. После отбора группы экспертов проводят интеллектуальный штурм (мозговую атаку): на общую работу отводят 40–45 минут, на выступление каждого эксперта — 2–3 минуты. Задача экспертов — выдвинуть максимум идей, даже самых нереальных; далее каждую идею аргументируют, обсуждают, принимают или отвергают в ходе дискуссии.</p>"}, {"number": 14, "title": "Принятие решений в условиях риска", "content": "<p>Почти все риски можно просчитать заранее, если грамотно подойти к принятию управленческих решений. Информационная база для анализа ситуации и принятия конкректного решения: данные о доходах и расходах, сведения о себестоимости, динамика роста цен, спроса и других факторов и т.д. Работа с управленческими решениями обычно систематизирована, но бизнес сам по себе не статичен. Многие факторы могут стать причинами рисков. Необходимо правильно оценивать факторы риска заранее. Риски измеряются в вероятности соотношений. Учет риска при принятии управленческих решений требует определить, с какой вероятностью бизнес понесет потери, если поступит определенным образом. Прежде чем принять решение, необходимо определить: • с какой вероятностью возникает тот или иной риск • какой уровень потерь понесет бизнес. Критерии принятия управленческих решений: 1. Вероятность наступления риска • Оценка вероятности возникновения негативного события по стат данным, экспертным оценкам и исторической аналитике 2. Финансовая значимость • Определение масштаба потенциального ущерба или дополнительных затрат, расчет стоимостного выражения риска 3. Влияние на ключевые показатели бизнеса • Воздействие на прибыль, рентабельность, ликвидность и прочее 4. Временной горизонт риска • Краткосрочные-среднесрочные-долгосрочные. Учёт инфляции, изменений рыночной конъюнктуры, макроэкономических факторов. 5. Управляемость и контролируемость • Возможность снижения риска за счёт внутренних мер. Наличие инструментов мониторинга и быстрого реагирования. 6. Взаимосвязь с другими рисками • Анализ корреляции между различными видами рисков, оценка системного влияния 7. Соответствие риск-возможностям компании • Сравнение допустимого уровня риска с установленными лимитами 8. Репутационные последствия • Влияние на имидж организации, доверие клиентов и партнеров, возможные убытки из-за потери деловой репутации 9. Альтернативные сценарии и гибкость реагирования • Разработка планов действий при наступление рискового события. Возможность быстрой адаптации к изменяющимся условиям.</p>"}, {"number": 15, "title": "Принятие решений в условиях неопределенности", "content": "<p>Для выбора оптимальной стратегии в условиях неопределённости и риска широко применяют методы дерева решений и платёжной матрицы. Они помогают определить, какая из альтернативных стратегий в наибольшей степени соответствует достижению целей. Преимущества методов 1. Заставляют учитывать все возможные варианты, включая неблагоприятные, снижая риск искажений из‑за психологических особенностей менеджера. 2. Формализуют оценку и выбор варианта даже при скудной информации — это предпочтительнее, чем принятие решения без методов. 3. Применимы на всех уровнях управления для разных задач. Методы относятся к теоретико‑игровым; могут дополняться аналитическими зависимостями и прогнозированием. Платёжная матрица Используется для решения простых задач. Это матричная запись денежных платежей/полезностей: строки — альтернативные стратегии поведения; столбцы — возможные состояния внешней среды; клетки матрицы — платежи (стоимостные оценки исходов) при выборе альтернативы и наступлении определённого состояния среды. Платежи могут отражать доходы (задача на максимизацию) или расходы (задача на минимизацию). Критерии принятия решений в условиях полной неопределённости 1. MAXIMAX (критерий оптимиста) — выбор альтернативы с максимальным значением в клетках матрицы. Ориентирован на максимально возможный доход, игнорируя потенциальные потери. 2. MAXIMIN (критерий Вальда, подход пессимиста) — выбор альтернативы, дающей максимальный результат при наихудшем состоянии среды. Обеспечивает гарантированный выигрыш. 3. MINIMAX — минимизация максимально возможных потерь. Для каждой альтернативы определяют максимальные потери, затем выбирают решение с наименьшим значением этих потерь. 4. Критерий Лапласа (равновесный подход) — выбор альтернативы с максимальным усреднённым по всем состояниям среды платежом. 5. Критерий Гурвича — компромисс между MAXIMIN и MAXIMAX. Принимающий решение субъективно задаёт веса оптимистичному и пессимистичному результатам, умножает на них соответствующие значения, суммирует и выбирает альтернативу с наибольшим итогом.</p>"}, {"number": 16, "title": "Основные методы снижения экономического риска и их характеристика", "content": "<p>Наиболее общими, широко используемыми и эффективными методами предупреждения и снижения риска являются: - страхование; - резервирование средств; - диверсификация; - лимитирование. 1. Страхование — соглашение, по которому страховщик за страховую премию обязуется возместить страхователю убытки (или их часть) при наступлении страхового случая, предусмотренного договором. Это совокупность экономических отношений по формированию целевого страхового фонда за счёт взносов и его использованию для возмещения ущерба и выплаты страховых сумм. 2. Резервирование средств — создание предпринимателем обособленных фондов для возмещения убытков за счёт части собственных оборотных средств. Метод выбирают, когда затраты на резервирование ниже стоимости страховых взносов. Резервы могут формироваться: в натуральной форме (семенной, фуражный фонды у сельхозпроизводителей; запасы сырья, материалов, товаров — для предотвращения остановки производства); в денежной форме (на покрытие непредвиденных расходов, кредиторской задолженности, ликвидации субъекта и др.). Ключевая задача при использовании метода — определить оптимальный (минимальный, но достаточный) размер резервов. Это сложная задача оптимизации, решаемая в рамках теории управления запасами. Источник возмещения потерь — прибыль: при наличии фондов — накопленная, при их отсутствии — недополученная. 3.  Диверсификация — распределение инвестируемых средств между различными, не связанными между собой объектами вложения. Её суть — снижение несистематического риска за счёт усреднения колебаний: рост показателей одних объектов может компенсировать спад других. Пример: вложение в акции нескольких компаний вместо одной либо хранение средств в разных банках. Важное условие эффективности диверсификации — независимость объектов вложения капитала, желательно с отрицательной (обратной) корреляцией спроса (когда рост спроса на один товар сопровождается падением спроса на другой). Диверсификация не снижает систематический риск, обусловленный общеэкономическими факторами (война, инфляция, изменения налогообложения и др.). Своеобразной формой диверсификации является аутсорсинг — передача сторонней организации определённых задач или бизнес‑процессов, не относящихся к основной деятельности компании. Например, строительная фирма передаёт ведение бухучёта внешней организации, экономя на содержании штата и высвобождая средства для развития бизнеса. 4. Лимитирование — установление системы ограничений (сверху и снизу) для уменьшения степени риска. Чаще всего применяется в отношении денежных средств: устанавливаются предельные суммы расходов, кредитов, инвестиций и т. п. Пример: ограничение размера кредита одному заёмщику для снижения потерь при невозврате долга. Другие виды лимитов: по срокам (заёмных средств, инвестиций); по структуре (доля отдельных затрат в общем объёме, доля каждого вида ценных бумаг в портфеле, доля льготных акций в выпуске); по уровню отдачи (минимальный уровень доходности проекта). Пример в страховании: установление лимита суммы, которую страховщик оставляет на собственном удержании; при превышении лимита используют сострахование или перестрахование.</p>"}, {"number": 17, "title": "Особенности оценки рисков инвестиционных проектов", "content": "<p>Под риском реального инвестиционного проекта (проектным риском) понимается вероятность возникновения неблагоприятных финансовых последствий в форме потери ожидаемого инвестиционного дохода в ситуации неопределенности условий его осуществления. Особенности оценки Интегрированный характер. Риск проекта — это не одна проблема, а совокупность разных рисков (финансовых, операционных, рыночных, технологических). Поэтому оценивают каждый вид отдельно, а потом выводят общий уровень. Объективность проявления. Сам по себе риск — объективное явление при инвестировании. Но на некоторые его параметры (например, вероятность наступления) влияют субъективные управленческие решения. Специфика на разных стадиях. На предынвестиционной, инвестиционной и операционной фазах доминируют разные риски. Поэтому оценку часто проводят поэтапно. Связь с коммерческим риском. Инвестиционный доход формируется в ходе операционной деятельности. Значит, успех проекта напрямую зависит от того, насколько эффективно работает компания. Зависимость от длительности проекта. Чем дольше жизненный цикл, тем выше неопределённость: сложно предсказать все будущие изменения внешней среды, стоимости ресурсов, спроса. Вариабельность даже у однотипных проектов. Даже проекты одного предприятия в одной отрасли могут по-разному подвергаться рискам из-за различий в деталях (клиентская база, технологии, рынок). Ограниченность информационной базы. У каждого проекта свои уникальные параметры. Из-за этого сложно накопить достаточно статистики для широкого применения экономико-статистических методов. Отсутствие надёжных рыночных индикаторов. В отличие от фондового рынка, где есть устоявшиеся индикаторы риска, в сфере реальных инвестиций таких маркеров часто нет. Два уровня анализа Качественный анализ. Проводится на стадии бизнес-планирования. Его задача — идентифицировать риски, выявить их причины, оценить потенциальный ущерб в стоимостном выражении и предложить меры по минимизации. Среди методов: экспертный (в том числе метод Дельфи для повышения объективности), анализ уместности затрат, метод аналогий (изучение похожих прошлых проектов). Количественный анализ. Направлен на численное выражение рисков и сравнение вариантов. Здесь применяют: анализ чувствительности (как изменится показатель эффективности, например NPV, при изменении одного параметра), анализ сценариев (пессимистичный, базовый, оптимистичный), деревья решений, имитационное моделирование (Монте-Карло), а также корректировку нормы дисконта (добавление премии за риск).</p>"}, {"number": 18, "title": "Методы оценки и учета рисков инвестиционных проектов", "content": "<p>Существует 2 метода оценки рисков инвестиционных проектов: 1. Качественные методы. Их задача — сначала выявить и описать риски, их факторы и возможные последствия, а уже потом переходить к численным оценкам. Включают следующее: Экспертные оценки. Аналитики привлекают специалистов, чтобы оценить вероятность рисковых событий и силу их влияния на проект. Разновидность — метод Дельфи: эксперты работают индивидуально, без обсуждения, что повышает объективность. Анализ уместности затрат. Помогает найти потенциальные зоны риска, связанные с перерасходом средств. Метод аналогий. Изучают данные по похожим завершённым проектам, чтобы выявить факторы риска для нового. Особенно полезен в повторяющихся сферах (например, в строительстве). Плюс: помогает собрать первичную информацию, когда данных мало. Минус: оценки субъективны. 2. Количественные методы. Цель — численно измерить степень влияния рисков на показатели эффективности проекта (например, NPV или IRR). Анализ чувствительности. Показывает, как изменятся итоговые показатели при сдвиге одного из входных параметров (цена сырья, объём продаж, ставка дисконта), при условии, что остальные взяты за базовые. Помогает выделить самые критические переменные. Метод сценариев. Предполагает разработку нескольких вариантов развития событий (обычно три: пессимистический, наиболее вероятный, оптимистический) и расчёт эффективности для каждого. Позволяет увидеть, как комбинация факторов влияет на результат. Метод корректировки нормы дисконта. К безрисковой ставке добавляют премию за риск, чтобы учесть неопределённость. Минус: метод не показывает, насколько именно отклонятся результаты, и может некорректно учитывать динамику риска во времени. Метод достоверных эквивалентов. Вместо корректировки ставки корректируют сами ожидаемые денежные потоки — заменяют рисковые потоки на «безрисковые эквиваленты» (величины, которые инвестор принял бы без риска), а затем дисконтируют их. Анализ дерева решений. Графически моделируют последовательность решений и возможных исходов, на ветвях указывают вероятности. Затем рассчитывают ожидаемую NPV: для каждого исхода умножают вероятность на соответствующий денежный поток и суммируют. Имитационное моделирование (метод Монте-Карло). Считается одним из самых строгих. Программа случайным образом подставляет значения параметров с учётом их распределения и корреляции, многократно рассчитывает NPV. В итоге получается распределение возможных результатов, по которому можно оценить риск (например, через стандартное отклонение или коэффициент вариации). Требует специального ПО. Статистический метод. Основан на изучении истории потерь и прибылей (например, на аналогичных производствах). Позволяет оценить вероятность события через частоту. Часто применяют в связке с экспертными оценками. Анализ предельного уровня устойчивости (точка безубыточности). Определяет, насколько можно снизить объём продаж, цену или издержки, чтобы проект остался рентабельным. Формула: BEP = FC / (P – VC), где FC — постоянные издержки, P — цена, VC — переменные затраты.</p>"}, {"number": 19, "title": "Оценка эффективности мер по снижению рисков инвестиционных проектов", "content": "<p>Эффективность мер по снижению рисков — это соотношение между достигнутым снижением уровня риска (или предотвращённым ущербом) и затратами на реализацию этих мер. Цель — получить максимальный эффект при минимальных расходах и без ухудшения ключевых показателей проекта (NPV, IRR и др.). NPV (Net Present Value) — это чистая приведённая стоимость. Это сумма дисконтированных (приведённых к текущему моменту) будущих денежных потоков проекта за вычетом первоначальных инвестиций. IRR (Internal Rate of Return) — это внутренняя норма доходности (рентабельности, ставки доходности). Это процентная ставка, при которой NPV проекта равна нулю. Показатели для оценки эффективности. Для оценки используют комбинацию качественных и количественных критериев: Изменение NPV проекта до и после внедрения мер. Если меры снижают риск, но «съедают» слишком много доходности, проект может стать экономически нецелесообразным. Изменение IRR и срока окупаемости. Часто меры по снижению риска ухудшают IRR, но делают проект более устойчивым. Показатель ожидаемых потерь (Expected Loss, EL): EL=P×L, где P — вероятность реализации риска, L — ожидаемый ущерб. Эффективность меры — это снижение EL. Коэффициент «затраты/эффект»: отношение стоимости мер к величине сниженного риска (в денежном выражении). Чем меньше коэффициент, тем эффективнее мера. Показатели чувствительности и устойчивости: насколько проект стал менее чувствителен к ключевым факторам (цена, спрос, курс валюты) после внедрения мер. VaR/CVaR (Value at Risk / Conditional VaR) — для проектов с выраженной рыночной составляющей: оценка максимального убытка с заданной вероятностью и «хвоста» убытков. Методы оценки эффективности мер Анализ чувствительности. Сравнивают ключевые показатели (NPV, IRR) при одних и тех же сценариях до и после применения мер. Если разброс результатов сужается, меры работают. Сценарный анализ. Рассматривают «пессимистичный», «базовый» и «оптимистичный» сценарии. Оценивают, насколько меры сглаживают потери в пессимистичном сценарии. Метод Монте-Карло. Имитационное моделирование множества сценариев с учётом вероятностных распределений факторов. Сравнивают распределение NPV до и после мер: если «левый хвост» (риск больших убытков) сокращается — меры эффективны. Дерево решений. Визуализируют варианты с мерами и без них, рассчитывают ожидаемую ценность каждого пути (EMV) и выбирают вариант с лучшим соотношением риск/доходность. Стоимостная оценка риска (Cost of Risk). Суммируют ожидаемые потери и затраты на меры. Эффективная мера снижает общую стоимость риска.</p>"}, {"number": 20, "title": "Идентификация и анализ рисков", "content": "<p>Идентификация и анализ рисков предполагает проведение качественного и количественного измерения рисков, с которыми сталкиваются хозяйствующие субъекты. Качественный анализ предполагает выявление источников и причин риска, а также этапов и работ, при выполнении которых возникает риск. Предполагает идентификацию, то есть выявление всех возможных рисков, определение потенциальных зон риска, выявление практических выгод и возможных негативных последствий, которые могут наступить при реализации содержащего риск решения, выявление источников и причин риска. Количественный анализ предполагает определение вероятности наступления риска и его последствий в будущем, а также определение допустимого уровня риска на основе расчетных методов и экспертных оценок. Предполагает: 1) численное определение риска проекта в целом и отдельных рисков 2) определение численного значения вероятности наступления рисковых событий и их последствий 3) осуществление количественной оценки уровня риска 4) определение допустимого в конкретной обстановке уровня риска и ущерба от него Этапы: 1) осмысление риска – предполагает качественный анализ, сопровождаемый исследованием структурной характеристики риска (подверженность объекта риску, уязвимость и т.п.) 2) анализ конкретных причин возникновения неблагоприятных событий и их отрицательных последствий. Данный этап обеспечивает основу для принятия решений в рамках управления риском. 3) комплексный анализ рисков предполагает изучение всей совокупности рисков, с которыми может столкнуться организация. Информация является ключевым аспектом при идентификации и анализе риска, поскольку ее наличие позволяет в дальнейшем принимать правильные решения в условиях риска и неопределенности. Объем и содержание необходимой информации зависит от конкретных условий, но они должны определяться следующими принципами: 1) принцип полезности информации (для принятия решений необходимо использовать только ту информацию, которая действительно необходима) 2) принцип эффективности получения информации, то есть затраты на получение информации и управление риском не должны превышать эффективность от снижения риска и его благоприятных последствий 3) принцип достоверности информации заключается в учете степени доверия к тем или иным источникам информации, при их использовании для анализа риска (информация считается более достоверной, если она получена из разных источников и не противоречит друг-другу)</p>"}, {"number": 21, "title": "Управление информационными рисками", "content": "<p>К информационным рискам относятся риски, связанные с возникновением убытков  или ущерба в результате применения организацией информационных технологий. Угрозу могут представлять не только технические сбои, но и несогласованность данных в различных системах, а также неограниченный доступ сотрудников к информации. То есть информационные риски связаны с созданием, передачей, хранением и использованием информации на различных носителях. Риски этой категории можно разделить на 2 группы: 1. Риски, связанные с потерей (утечкой) информации, и, как правило, использованием ее конкурентами; 2. Риски, связанные с техническими сбоями, работа каналов передачи информации. Работа по минимизации информационными рисками заключается в предупреждении несанкционированного доступа к данным, а также аварий и сбоев оборудования. Для определения наиболее рисковых зон в сфере обеспечения компаний информацией, необходимо ответить на следующие вопросы: - каким образом осуществляется контроль доступа к информационным системам?; - позволяет ли организация документооборота продолжать деятельность в прежнем режиме в случае ухода сотрудника?; - обеспечена ли защита интеллектуальной собственности компании?; - имеет ли компания резервный доступ к информации в случае сбоев в работе информационных систем?; - соответствует ли способ работы информационных систем общим целям и задачам компании. Точно рассчитать ущерб от реализации информационных рисков достаточно сложно. Для минимизации информационных рисков и их предупреждению, необходимо: 1. Доступ сотрудников к информационным системам и документам организации должен быть разграничен в зависимости от должности и необходимости использования для принятия решений; 2. Организация должна контролировать доступ к информации и обеспечить защиту уязвимых мест информационных систем; 3. Информационные системы, от которых напрямую зависит деятельность организации, должны работать бесперебойно даже в ЧС. Расходы на обеспечение информационной безопасности и снижения информационных рисков не должны превышать суммы возможного ущерба. То есть необходимо соблюдать принцип рациональности. Обязательные условия риск-менеджмента в области информационных технологий, как и процесса управления рисками в любой другой области, является его непрерывность. Поэтому оценка информационных рисков, а также разработка и обновление планов по их минимизации, должны проводиться с определенной периодичностью.</p>"}, {"number": 22, "title": "Функции и правила управления рисками", "content": "<p>Выделяют два типа функций риск-менеджмента: функции объекта управления и функции субъекта управления. К функциям объекта (риски, рисковые вложения капитала и экономические отношения, возникающие в процессе управления риском) управления в риск-менеджменте относится: Организацию разрешения риска — принятие решения о том, следует ли принимать риск, передавать его или избегать. Организацию рисковых вложений капитала — определение направлений и объёмов инвестирования с учётом возможных потерь. Организацию работы по снижению величины риска — разработку и внедрение мер, направленных на уменьшение вероятности наступления рискового события или размера ущерба. Организацию процесса страхования рисков — взаимодействие со страховыми компаниями для передачи части рисков. Организацию экономических отношений и связей между субъектами хозяйственного процесса — распределение ответственности и согласование интересов участников. К функциям субъекта управления в риск-менеджменте относятся: Прогнозирование (Разработка на перспективу изменений финансового состояния объекта в целом и его различных частей). Организация (Объединение людей, совместно реализующих программу рискового вложения капитала на основе определенных правил и процедур: создание органов управления, построение структуры аппарата управления, разработка норм, методик и т. п.). Регулирование (Воздействие на объект управления, посредством которого достигается состояние устойчивости этого объекта). Координация (Согласованность работы всех звеньев системы управления риском, аппарата управления и специалистов). Стимулирование (Побуждение финансовых менеджеров и других специалистов к заинтересованности в результате своего труда). Контроль (Проверка организации работы по снижению степени риска; контроль предполагает анализ результатов мероприятий по снижению степени риска). Правила для принятия решения в условиях риска: 1. Нельзя рисковать больше, чем это может позволить собственный капитал. Прежде чем принять решение о рисковом вложении капитала, фин. менеджер должен: определить максимально возможный объем убытка по данному риску; сопоставить его с объемом вкладываемого капитала; сопоставить его со всеми собственными финансовыми ресурсами. 2. Необходимо думать о последствиях риска. Фин. менеджер, зная возможную максимальную величину убытка, должен определить, к чему она может привести, какова вероятность риска. 3. Нельзя рисковать многим ради малого. Действие данного правила проявляется при передаче риска, т. е. при страховании. В этом случае финансовый менеджер должен определить и выбрать приемлемое для него соотношение между страховым взносом и страховой суммой. Инвестор не должен принимать на себя риск, если размер убытка относительно велик по сравнению с экономией на страховом взносе. 4. Положительное решение принимается лишь при отсутствии сомнения. 5. При наличии сомнений принимаются отрицательные решения. 6. Нельзя думать, что существует только одно решение, возможно, есть и другие. Реализация остальных правил 4–6 означает, что в ситуации, для которой имеется только одно решение (положительное/отрицательное), надо сначала попытаться найти другие решения. Если же анализ показывает, что других решений нет, то действуют «в расчете на худшее»: если сомневаешься, то принимай отрицательное решение.</p>"}, {"number": 23, "title": "Налоговые риски", "content": "<p>Налоговый риск организации - возможность для организации понести финансовые и иные потери, связанные с процессом уплаты и оптимизации налогов. Выделяют: 1. Внешние риски: политика правительства в области реформ налогообложения; складывающиеся социально-экономическая ситуация в государстве; необходимо поддерживать финансовые резервы РФ на необходимом уровне; необходимость осуществить выплаты по внутреннему и внешнему долгу; динамика цен на нефть. 2. Внутренние риски (сумма выплаты в бюджет всех уровней и других обязательных платежей). Помимо внутренних и внешних налоговых рисков выделяют риск налогового контроля и риски уголовного преследования налогового характера. 3. Риск налогового контроля — потенциальные финансовые потери из‑за действий налоговых органов. Главный рискообразующий фактор — возможность проверки полноты исчисления и уплаты налогов с последующим наложением санкций. Минимизировать риск можно путём устранения оснований для контроля и чёткого исполнения требований налогового законодательства до назначения проверки. 4. Риски уголовного преследования налогового характера — финансовые потери из‑за наступления уголовной ответственности по УК РФ. Проверка цен как пример налогового контроля Проверку правильности применения цен проводят в случаях: между взаимозависимыми лицами; по бартерным операциям; при внешнеторговых сделках; при отклонении цен более чем на 20 % от уровня цен по идентичным товарам. Минимизация рисков налогового контроля достигается квалифицированным применением норм налогового законодательства и анализом предпринимательской практики. При рассмотрении особенностей данных рисков выделяют следующие важные аспекты: Необходимость разграничений таких понятий как оптимизация и уклонение от уплаты налогов Налоговая оптимизация — уменьшение и более равномерное распределение по времени платежей в бюджет за счёт полного использования правомерных норм законодательства о налогах и сборах. Уклонение от уплаты налогов — снижение налоговых платежей с применением способов, нарушающих НК РФ. Также значимы трудности уголовно‑правовой квалификации налоговых преступлений, в частности — противоречивая правоприменительная практика в части определения квалифицирующего признака «крупный размер ущерба».</p>"}, {"number": 24, "title": "Инвестиционные риски", "content": "<p>Инвестиционные риски — вероятность финансовых потерь (снижения капитала или недополучения дохода) из-за неопределённости в инвестиционной деятельности. Их принято делить на две большие группы: общие (систематические) и специфические (несистематические). Общие (систематические) риски одинаковы для всех участников и форм инвестирования. На них инвестор не может повлиять напрямую. К ним относят: Внешнеэкономические — изменения в мировой экономике, санкции, колебания валютных курсов. Внутриэкономические — динамика ВВП, инфляция, изменение ключевой ставки, налоговые реформы. Социально-политические — политическая нестабильность, смена курса, социальные волнения. Экологические — потери из-за природных катастроф или ухудшения экологической ситуации. Риски государственного регулирования — новые законы, изменения в налогообложении, валютном регулировании, правилах рынка ценных бумаг. Конъюнктурные — неблагоприятные сдвиги на отдельных рынках или смена стадий экономического цикла. Прочие — экономические преступления, недобросовестность партнёров, неисполнение обязательств. Специфические (несистематические) риски индивидуальны: они связаны с конкретным инвестором, объектом вложения или особенностями управления. Их можно снизить за счёт грамотного выбора активов и управления. Эта группа делится на: Риски инвестиционного портфеля: Капитальный — общее ухудшение качества портфеля, ведущее к потерям. Селективный — неверная оценка качеств конкретного актива при формировании портфеля. Риск несбалансированности — нарушение соответствия между вложениями и источниками финансирования по объёму, доходности, ликвидности. Риск излишней концентрации — потери из-за узкой диверсификации: зависимости от одной отрасли, региона или направления. Риски объектов инвестирования: Страновой — вложения в страну с неустойчивой экономикой или политической ситуацией. Отраслевой — изменения в конкретной отрасли (цикличность, переориентация экономики, изменение спроса). Региональный — неустойчивое состояние экономики отдельного региона (особенно актуально д
