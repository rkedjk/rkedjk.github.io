        {"number": 13, "title": "Анализ финансовых рисков", "content": "<p>13.1 Причины и факторы возникновения и развития финансовых рисков</p><p>Риски, которым подвержена коммерческая организация, как риски</p><p>хозяйственной деятельности, классифицированные по группам:</p><p>финансовые, правовые, страновые и региональные, репутационные и</p><p>другие определены законодательно.</p><p>Самую долгую историю существования, а именно с момента</p><p>возникновения денежных отношений имеет финансовый риск, который</p><p>тесно связан с вероятностью потерь финансовых ресурсов.</p><p>Причина их возникновения кроется в воздействии на организацию</p><p>внутренних и внешних факторов.</p><p>Одним из значимых внешних факторов, влияющих на формирование</p><p>и величину рисков, является несовершенство действующего</p><p>законодательства, который имеет двойственный характер.</p><p>Образованию рисков через фактор внутреннего воздействия,</p><p>способствуют ошибки управленческого персонала, из-за</p><p>некомпетентности, недостатка экономических знаний.</p><p>Финансовый риск появляется тогда, когда расходы финансовых</p><p>ресурсов превалируют над доходами, иначе говоря, темпы роста</p><p>денежного притока ниже величины их оттока.</p><p>13.2 Формализованные методы анализа выявления финансового</p><p>риска в оценке структуры капитала</p><p>Неформализованные методы основаны на описании аналитических</p><p>процедур на логическом уровне. К ним относятся методы: экспертных</p><p>оценок, психологические сравнения, построение систем пока-зателей,</p><p>построения систем аналитических таблиц.</p><p>Оценочные критерии распознания финансового риска должны быть</p><p>ориентированы на источники финансирования. Ими могут быть:</p><p>-величина средневзвешенной цены капитала в динамике;</p><p>- изменения балансовой стоимости источников финансирования</p><p>имущества.</p><p>Причины данных изменений:</p><p>- уровень финансовой зависимости (независимости);</p><p>- степень концентрации собственных и привлеченных средств;</p><p>- эффективность распределения и использования источников</p><p>финансирования.</p><p>Бухгалтерский баланс предоставляет информацию о величине и</p><p>структуре собственного и заемного источников финансирования. На</p><p>основе его данных можно оценить эффективность размещения капитала</p><p>организации, его достаточность для осуществления текущей и</p><p>предстоящей хозяйственной деятельности, оценить кредитоспособность</p><p>организации как заемщика.</p><p>В отчете об изменениях капитала также раскрывается информация о</p><p>состоянии и движении собственного капитала организации, его остатках,</p><p>использование в разрезе элементов (уставный, добавочный, резервный</p><p>капитал и нераспределенная прибыль (непокрытый убыток)) в</p><p>соответствии с учетной политикой организации.</p><p>Анализ данных показателей позволяет оценить способность</p><p>организации к самофинансированию и наращиванию капитала.</p><p>13.2 Аналитический инструментарий выявления и прогнозирования</p><p>финансового риска в оценке структуры капитала</p><p>Цель: Диагностика и прогнозирование финансового риска в оценке</p><p>структуры капитала.</p><p>Задачи:</p><p>1. Оценка формирования структуры капитала;</p><p>2. Анализ уровня финансовой зависимости хозяйствующего субъекта от</p><p>внешних источников финансирования;</p><p>3. Диагностика и прогнозирование финансового риска;</p><p>4. Анализ эффективности распределения и использования источников</p><p>финансирования.</p><p>Система показателей для выявления финансового риска: величина</p><p>собственного капитала, величина заемного капитала.</p><p>Результаты анализа могут раскрыть уровень эффективности</p><p>использования краткосрочных заемных источников по коэффициентам</p><p>оборачиваемости и определить их достаточность для текущих финансовых</p><p>потребностей.</p><p>Коэффициенты ликвидности (формулы по строкам баланса)</p><p>Коэффициент текущей ликвидности</p><p>Ктл = 1200 / (1510 + 1520 + 1540 + 1550)</p><p>где 1200 – оборотные активы (итог раздела II), знаменатель – краткосрочные обязательства без доходов будущих периодов.</p><p>Коэффициент быстрой (промежуточной) ликвидности</p><p>Кбл = (1250 + 1240 + 1230) / (1510 + 1520 + 1540 + 1550)</p><p>где 1250 – денежные средства, 1240 – краткосрочные финансовые вложения, 1230 – дебиторская задолженность.</p><p>Коэффициент абсолютной ликвидности</p><p>Кал = (1250 + 1240) / (1510 + 1520 + 1540 + 1550)</p><p>Денежные средства + краткосрочные финансовые вложения / краткосрочные обязательства без дохлдов будущих периодов</p><p>Нормативные значения:</p><p>Ктл = 1–2</p><p>Кбл = 0,5–0,7</p><p>Кал ≥ 1  (0,5-0,7)</p><p>Платёжеспособность не имеет единой формулы – она оценивается по совокупности:</p><p>Коэффициенты ликвидности (выше) должны быть в норме.</p><p>Наличие просроченной кредиторской задолженности – если есть, то неплатёжеспособность.</p><p>Чистый денежный поток (ЧДП) &gt; 0 (из отчёта о движении денежных средств).</p><p>Коэффициенты финансовой устойчивости с названиями строк</p><p>Коэффициент автономии (независимости)</p><p>Ка = 1300 (Капитал и резервы) / 1700 (Валюта баланса)</p><p>Коэффициент финансовой устойчивости</p><p>Кфу = (1300 Капитал и резервы + 1400 Долгосрочные обязательства + 1530 Доходы будущих периодов) / 1700 Валюта баланса</p><p>Коэффициент финансирования (соотношения заёмных и собственных средств)</p><p>Кф = 1300 (Капитал и резервы) / (1400 Долгосрочные обязательства + 1500 Краткосрочные обязательства – 1530 Доходы будущих периодов)</p><p>Коэффициент маневренности собственного капитала</p><p>Км = (1300 Капитал и резервы + 1400 Долгосрочные обязательства + 1530 Доходы будущих периодов – 1100 Внеоборотные активы) / (1300 Капитал и резервы + 1530 Доходы будущих периодов)</p><p>*Часто упрощают: (1300 – 1100) / 1300*</p><p>Коэффициент обеспеченности собственными оборотными средствами</p><p>Косос = (1300 Капитал и резервы + 1400 Долгосрочные обязательства + 1530 Доходы будущих периодов – 1100 Внеоборотные активы) / 1200 Оборотные активы</p><p>*Упрощённо: (1300 – 1100) / 1200*</p><p>Коэффициент обеспеченности запасов собственными источниками</p><p>Коз = (1300 Капитал и резервы + 1400 Долгосрочные обязательства + 1530 Доходы будущих периодов – 1100 Внеоборотные активы) / 1210 Запасы</p><p>Ориентир: ≥ 0,6–0,8</p>"}
      ]

        questions.forEach(item => {
            const wrapper = document.createElement("div");
            wrapper.innerHTML = item.content;
            item.searchText = `${item.title} ${wrapper.textContent}`.toLowerCase();
        });

        searchToggle.addEventListener("click", () => toggleSearch());
        fontToggle.addEventListener("click", () => toggleFontPanel());
        fontDecrease.addEventListener("click", () => changeFontScale(-1));
        fontIncrease.addEventListener("click", () => changeFontScale(1));
        document.getElementById("fontReset").addEventListener("click", () => setFontScale(100));
        document.getElementById("searchClear").addEventListener("click", () => {
            searchBox.value = "";
            searchItems();
            searchBox.focus();
        });
        searchBox.addEventListener("input", searchItems);
        document.getElementById("readerBack").addEventListener("click", () => showList());
        document.getElementById("prevQuestion").addEventListener("click", event => openQuestion(Number(event.currentTarget.dataset.question)));
        document.getElementById("nextQuestion").addEventListener("click", event => openQuestion(Number(event.currentTarget.dataset.question)));
        window.addEventListener("scroll", () => {
            updateReadingProgress();
            updateWatchFocus();
        }, { passive: true });
        window.addEventListener("resize", updateWatchFocus);
        window.addEventListener("popstate", routeFromHash);

        setFontScale(loadFontScale(), false);
        document.body.dataset.screen = "list";
        renderItems(questions, "");
        routeFromHash();
    </script>
